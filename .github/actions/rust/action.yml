# The compiler a job builds with, installed by the rustup that is
# already on the machine.
#
# This replaced dtolnay/rust-toolchain, which is a fine action and was
# doing nothing wrong. What it was is a dependency, in two ways this
# repository does not take elsewhere. It was used at `@master`, a
# mutable branch of somebody else's repository, in every job of a tree
# that pins nine languages' toolchains to the patch level. And an action
# is downloaded from codeload.github.com before the job's first step
# runs, so a workflow is only as available as that host: when it answers
# 429 or 503, as it did through the GitHub incident of 2026-08-17, the
# job dies in `Set up job`, before there is a step to rerun or to mark
# as allowed to fail.
#
# A local action is part of the checkout, so there is nothing to fetch
# and no version of it but this one. What it does is three rustup
# commands, which is what the other action did too.
name: Rust
description: Install the toolchain this job builds with, from the local rustup.

inputs:
  toolchain:
    description: The channel or the exact version, spelled the way rustup spells it. Left out, the job builds with the version rust-toolchain.toml pins, which is what a job that has no opinion wants. `cargo xtask pins` reads this key in the workflows, so a version written here is held to toolchains.toml.
    required: false
    default: ''
  components:
    description: Components to install alongside it, comma or space separated.
    required: false
    default: ''
  targets:
    description: Targets to add, comma or space separated.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
      run: |
        set -eu

        # No toolchain named is the job saying it has no opinion, and
        # the answer for a job with no opinion is the version the
        # repository pins. Naming a channel here instead means every
        # such job builds with whatever rustup resolves that morning,
        # which is a compiler nobody in the tree chose: stable moved to
        # 1.98 on 2026-08-18, 1.98 added a lint, and main went red on
        # code nobody had touched (#489). Worse, it was silent while it
        # worked, so the twenty-five jobs that took the default had been
        # testing a different compiler than the one every developer and
        # every release build uses.
        #
        # A job that does have an opinion still says so and still gets
        # it. The pins check treats a channel written here as deliberate
        # for exactly that reason.
        if [ -z "$toolchain" ]; then
          pin="${GITHUB_WORKSPACE:-.}/rust-toolchain.toml"
          toolchain=$(sed -n 's/^ *channel *= *"\([^"]*\)".*/\1/p' "$pin" | head -1)
          if [ -z "$toolchain" ]; then
            echo "no channel in $pin and no toolchain asked for" >&2
            exit 1
          fi
        fi

        # Every hosted image ships rustup, so this is for the job
        # containers: the manylinux rows of the libzu workflow build in
        # an image that has a compiler for the wheels of somebody else's
        # ecosystem and not this one. A toolchain of `none` because the
        # install below is what decides which one, and downloading a
        # stable first would be a download nothing uses.
        if ! command -v rustup > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

        # One install rather than an install and then an add per piece,
        # since rustup resolves the manifest once that way and a
        # component that does not exist for the version asked for fails
        # here rather than half way through a job.
        #
        # The minimal profile leaves out the documentation and the local
        # standard library sources, which nothing in CI reads and which
        # are most of what a default install downloads.
        flags="--profile minimal --no-self-update"
        for component in $(echo "$components" | tr ',' ' '); do
          flags="$flags --component $component"
        done
        for target in $(echo "$targets" | tr ',' ' '); do
          flags="$flags --target $target"
        done

        install() { rustup toolchain install "$1" $flags; }

        # The date some days ago, spelled the way rustup names a
        # nightly. GNU date first and BSD date second, because this runs
        # on the macOS rows as well.
        back() {
          date -u -d "$1 days ago" +%Y-%m-%d 2> /dev/null || date -u -v-"$1"d +%Y-%m-%d
        }

        if ! install "$toolchain"; then
          # A nightly is published with the components that built that
          # night, and the ones outside the compiler go missing for a
          # day or two at a time: miri is the usual one. Rustup will not
          # fall back on its own, so walk back a fortnight and take the
          # first nightly that has everything asked for. Only a floating
          # nightly gets this. A dated one and a released version are
          # both somebody's decision, and quietly building with a
          # different compiler than the one written down is worse than
          # failing.
          if [ "$toolchain" != nightly ]; then
            exit 1
          fi
          for day in $(seq 1 14); do
            dated="nightly-$(back "$day")"
            if install "$dated"; then
              toolchain="$dated"
              break
            fi
          done
          if [ "$toolchain" = nightly ]; then
            echo "no nightly in the last fortnight has $components" >&2
            exit 1
          fi
          echo "the newest nightly is missing $components, using $toolchain"
        fi

        # An environment variable rather than `rustup default`, because
        # this repository has a rust-toolchain.toml and that file wins
        # over the default. A job that asked for a channel or a dated
        # nightly asked on purpose and has to get it; a job that asked
        # for nothing is being handed back the version that same file
        # names, so the two paths end at the same place and the variable
        # is what makes the first one work.
        export RUSTUP_TOOLCHAIN="$toolchain"
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

        # In the log, because the first question about a failure that
        # reproduces nowhere else is which compiler saw it.
        rustc --version --verbose
        cargo --version
