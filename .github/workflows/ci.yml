name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  api-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustdoc JSON is nightly only and its format is versioned, so
      # the nightly is pinned to an exact date rather than floating.
      # A floating one would turn every rustdoc format bump into a red
      # main on somebody else's release schedule, and the generator
      # refuses a format it was not taught precisely so that a bump is
      # a deliberate change to model.rs and not a silent partial read.
      - uses: ./.github/actions/rust
        with:
          toolchain: nightly-2026-08-14
      - uses: Swatinem/rust-cache@v2
      # docs/api/model.json is what the reference pages, the SDK
      # feature matrix, zu.h and the api-map.toml completeness check
      # are all generated from, so it is committed and this job holds
      # it to the source. On a mismatch the command prints the
      # identifiers that were added and removed, not just that the
      # file differs.
      - run: cargo xtask model --check --toolchain nightly-2026-08-14
      # The map says what a binding owes every entity in the model, and
      # this fails on a public symbol nothing classifies. The same
      # check runs as a test, on stable, in every job of the matrix
      # below, because that is what makes it fire on the machine of
      # whoever added the symbol. It runs here as well because a
      # command nothing exercises is a command that rots, and because
      # the two failures belong together: a new symbol makes the model
      # stale and then makes the map incomplete, and seeing both at
      # once is one round trip rather than two.
      - run: cargo xtask api-map
      # The nightly two lines above is one of the versions this checks,
      # which is the shape of the whole thing: one table says what every
      # repository builds against, and every place that would otherwise
      # hold its own answer has to agree with it. It runs as a test as
      # well, on stable, in every job of the matrix below, so a bump
      # that misses a site fails on the machine of whoever made it.
      - run: cargo run -p xtask -- pins
      # Nine repositories will run this on every push, so what the bench
      # asserts is the shape rather than the number: the cost per site
      # stays flat as the table grows, which is the difference between a
      # scan per site and a scan of everything per site.
      - run: cargo bench -p xtask --bench pins
      # The other table with a workflow on the end of it: seven tier 1
      # targets, and the matrix in libzu.yml held to them. This runs as
      # a test too, and here for the same reason as the two above.
      - run: cargo run -p xtask -- platforms
      # And the table on the end of the release: what a tag publishes,
      # which eight repositories fetch by version. release.yml assembles
      # from it and verifies the directory back against it, so an
      # artifact that stopped being produced fails the release that
      # dropped it rather than the eight that wanted it.
      - run: cargo run -p xtask -- artifacts
      # A release is compression and copying and costs what those cost.
      # What this measures is the bookkeeping either side of it, whose
      # per-artifact cost has to stay flat as the contract grows past
      # the seven platforms it has today.
      - run: cargo bench -p xtask --bench artifacts
      # The two package manager manifests are rendered from the platform
      # table rather than maintained, so a tier 1 target reaches Homebrew
      # and Scoop by being tier 1. This is the check that a formula
      # someone edited by hand, or a table that moved without them, fails
      # here rather than at the release that publishes them.
      - run: cargo run -p xtask -- packaging --check
      # The digest list is written over the whole release and checked by
      # every install, and the hasher is this repository's own. What the
      # floor catches is the order of magnitude, since a rewrite that
      # allocates per block turns a release into a minute of hashing.
      - run: ZU_GATE=1 cargo bench -p xtask --bench sha256
      # And the table under all of it: the nine repositories the split
      # created. The conductor dispatches to that list, the README
      # publishes it, and the contract above names its consumers from
      # it, so a repository joining or leaving the project is one row
      # here and a failure everywhere it was not changed.
      - run: cargo run -p xtask -- repos
      # Nine rows will not be nine forever, and the tier 3 bindings
      # arrive one repository at a time. What this measures is that
      # holding three files to the table stays flat per repository.
      - run: cargo bench -p xtask --bench repos
      # The promise on top of that list: who maintains each client, what
      # its tier asks of it, and where it stands. The page it publishes
      # is rendered rather than written, so this is the check that a
      # hand edit, or a tier that moved in one table and not the other,
      # fails here rather than on the site. The thresholds are behind
      # --gate and are the release's, because every client is under its
      # threshold until the apparatus of DX3 to DX5 exists.
      - run: cargo run -p xtask -- clients --check
      # Seven clients will not be seven forever either. What this
      # measures is that scoring and rendering stay flat per client, so
      # the tier 3 bindings arriving through the kit cost a lookup each
      # rather than a walk of everything before them.
      - run: cargo bench -p xtask --bench clients

  # The job above holds the model to the source, so a symbol that
  # appeared or went away arrives as a diff in docs/api/model.json that
  # somebody reads. This one answers the other half of the question:
  # whether what changed was a break. cargo-semver-checks knows two
  # hundred and fifty ways a Rust API can stop being compatible, and a
  # diff in a generated file does not, because a reader looking at one
  # changed line has to remember that widening a return type is fine and
  # narrowing an argument is not.
  #
  # The baseline is a git revision rather than crates.io. Nothing here is
  # published yet, so the only honest question is what this branch does
  # to the branch it is going into, and --baseline-rev asks exactly that.
  #
  # --release-type patch is not decoration. Given two equal versions the
  # tool assumes a major bump and skips all 254 lints, which would make
  # this job green forever and mean nothing; asking it to assume a patch
  # is what makes it check. The version bump is then the escape hatch,
  # the same one the Python client's griffe gate and the TypeScript
  # client's committed api report use: a break is allowed, a break
  # nobody declared is not.
  #
  # Two crates rather than the whole workspace. zu is the Rust API, the
  # one docs/api/model.json describes and the one a Rust program
  # depends on; zu-corpus is the only other crate without
  # `publish = false` on it. zu-capi is left out on purpose, because its
  # surface is a C ABI rather than a Rust one and zu.h is what holds it.
  semver:
    runs-on: ubuntu-latest
    steps:
      # The tool clones the baseline out of this checkout, so it needs
      # the branch and not just the one commit under test.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # A pinned release binary rather than a build from source, which
      # takes about four minutes, and rather than a third-party action,
      # for the reasons written on .github/actions/rust.
      - name: cargo-semver-checks
        run: |
          curl -sSfL https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -C /usr/local/bin -xzf -
          cargo semver-checks --version
      # The gate is validated the only way a gate can be: a break has to
      # fail it. Renaming a public method is the cheapest break that is
      # unambiguously one, and the tree is put back before the real
      # check reads it.
      - name: A break the gate is meant to catch, caught
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:+origin/$BASE_REF}"
          base="${base:-HEAD^}"
          perl -0pi -e 's/    pub fn epoch\(&self\) -> u64 \{/    pub fn epoch_renamed(&self) -> u64 {/' crates/zu/src/session.rs
          set +e
          cargo semver-checks check-release -p zu --baseline-rev "$base" --release-type patch
          rc=$?
          set -e
          git checkout -- crates/zu/src/session.rs
          test $rc -ne 0 || { echo "the semver gate did not fire on a renamed method"; exit 1; }
      - name: The Rust surface, against what it was
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:+origin/$BASE_REF}"
          base="${base:-HEAD^}"
          was=$(git show "$base:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          now=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$was" != "$now" ]; then
            echo "version moved from $was to $now, so a break here is one that was declared"
            cargo semver-checks check-release -p zu -p zu-corpus --baseline-rev "$base" --release-type patch || true
            exit 0
          fi
          cargo semver-checks check-release -p zu -p zu-corpus --baseline-rev "$base" --release-type patch

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The CLI bin and the C API cdylib are both called zu, so on MSVC
      # they want the same zu.pdb and whichever link gets there second
      # dies with LNK1201. Renaming either one changes what users type or
      # what they link against. Turning the debug info off by env was the
      # first try and it did not hold, the job kept failing with /DEBUG
      # still on the link line, so the two now build in separate passes
      # and never reach that file at the same time.
      # The ADBC driver's round trip opens its own shared object the way
      # a driver manager does, and `cargo test` builds the library as an
      # rlib to link the test against and stops there, since nothing it
      # knows about consumes a cdylib. The suite builds the file itself
      # when it is missing, which is what a developer gets on a clean
      # tree; building it here with the same features the tests use means
      # that nested build finds its work already done rather than
      # compiling the dependency tree a second way.
      - run: cargo build -p zu-adbc --all-features
      - if: matrix.os == 'windows-latest'
        run: |
          cargo test --workspace --exclude zu-capi --all-features
          cargo test -p zu-capi --all-features
      - if: matrix.os != 'windows-latest'
        run: cargo test --workspace --all-features
      # The one build shape the two lines above cannot reach. libzu
      # exports zu_result_arrow whether or not it was built with Arrow
      # in it, answering ZU_UNSUPPORTED when it was not, and the test
      # that says so only compiles on that side of the feature. A
      # binding that loads this library by name is the caller that
      # would find out the hard way.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p zu-capi --no-default-features
      # The point read path, where a walk reads one neighbor list rather
      # than decoding the group around it, only comes up on groups far
      # bigger than a test builds. This env asks for it on every list, so
      # the differential suite compares the two executors with the whole
      # engine on that side of the choice.
      - if: matrix.os == 'ubuntu-latest'
        run: ZU_POINT_READS=1 cargo test -p zu --test differential

  membudget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zu-cli
      # The G6 budget is 32 MiB total for an embedded reader. The build
      # and the write path run unconstrained; every read path then runs
      # under a 32 MiB address-space cap, so a decoder or open path that
      # starts buffering whole segments fails here before it ships.
      - name: Read paths under 32 MiB
        run: |
          printf '1 2\n1 3\n2 3\n3 1\n' > /tmp/edges.txt
          target/release/zu copy /tmp/edges.txt /tmp/smoke.zu1
          ulimit -v 32768
          target/release/zu stat /tmp/smoke.zu1
          target/release/zu verify /tmp/smoke.zu1
          target/release/zu neighbors /tmp/smoke.zu1 1

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      # The interpreter is a few thousand times slower than native, so
      # this runs the roundtrip distribution sweep, which crosses every
      # encoder and decoder path at miri-sized inputs, rather than the
      # whole unit suite with its hundred-thousand-value columns.
      - run: cargo +nightly miri test -p zu-encoding --test roundtrip
      # The vector layer carries the unsafe: arena allocation, the
      # MaybeUninit compare staging, and StrView. The lib tests plus one
      # differential compare run cross all of it at miri-sized inputs.
      - run: cargo +nightly miri test -p zu-vector --lib
      - run: cargo +nightly miri test -p zu-vector --test reference compare_i64_const

  check-asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The perf/11 tier 1 gate: every hot kernel that relies on
      # auto-vectorization must actually vectorize on this toolchain.
      - run: cargo bench -p zu-vector --no-run
      - run: bench/check_asm.sh

  cardinality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The perf/12 section 6 gate. Builds its own graphs, so unlike
      # the LDBC bench it needs no dataset and runs here. Holds the
      # q-error percentiles to bench/budgets.toml and fails on the
      # first ceiling the data walks through.
      - run: ZU_GATE=1 cargo bench -p zu --bench cardinality

  refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The G0 gate from gql plan/08 section 1.2: saying no has to cost
      # less than saying yes. Builds its own graph like the cardinality
      # gate above, so it needs no dataset. The number it enforces is a
      # ratio between two paths timed in the same run on the same
      # machine, which is why it can gate on a shared runner at all.
      - run: ZU_GATE=1 cargo bench -p zu --bench refuse

  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The perf/05 tail gate: the p99 of a point seeded read against
      # the p50 of the same stream, on uniform data and on power law
      # data. Builds both graphs itself, half a million people and
      # eight million edges each, in a few seconds. Like the two gates
      # above it enforces a ratio between numbers timed in one run on
      # one machine, so a shared runner cannot move it.
      - run: ZU_GATE=1 cargo bench -p zu --bench tail

  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The perf/06 path count gate: counting the shortest paths of a
      # layered graph against enumerating the same paths on the same
      # run. Forty three nodes and a third of a million paths between
      # them, so it builds in no time and still fails loudly if the
      # count goes back to being a walk. A ratio between two numbers
      # timed together, so a shared runner cannot move it.
      - run: ZU_GATE=1 cargo bench -p zu --bench paths

  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The GE09 gate: an aggregate written around a group variable
      # against the same group read as a list, fifty thousand walks of
      # eight repetitions. What settles it is the allocator, counted in
      # the bench itself: the fold asks for nothing over the walk and
      # the list asks for a kilobyte a row, and neither number moves
      # with the machine or the load. The clock is a loose second gate,
      # since the walk in front of the fold is most of what it times.
      - run: ZU_GATE=1 cargo bench -p zu --bench fold

  relprops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The G2 edge property gate: a property read off every edge of a
      # two million edge graph against the same walk reading a column
      # off the node the edge lands on. Builds the graph itself in a
      # second. Like the gates above it enforces a ratio between numbers
      # timed in one run on one machine, so a shared runner cannot move
      # it.
      - run: ZU_GATE=1 cargo bench -p zu --bench relprops

  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The G3 write gate: what one write statement costs in latency,
      # throughput, bytes pushed at the disk, bytes the store grew by and
      # memory, for a SET of one property and an INSERT of one element.
      # Two of the seven ceilings are ratios between the same statement
      # at ten thousand rows and at a hundred thousand, so a shared
      # runner cannot move those; the absolute ones are set for a box
      # whose fdatasync is several times slower than a laptop's.
      - run: ZU_GATE=1 cargo bench -p zu --bench write

  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # What a burst of writers costs, which is the P5 shape at c=8: the
      # same INSERT run at six widths, one writer up to thirty two. All
      # three keys are ratios between levels of one run on one machine,
      # so a shared runner moves the columns and not the gate. What they
      # catch is commits going back to a sync each, which reads as a
      # throughput that stops rising with the width and a latency that
      # starts rising with it.
      - run: ZU_GATE=1 cargo bench -p zu --bench commit

  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The dx/04 section 9 gate on the public API: what a connection
      # costs to take, and what a statement costs through Connection
      # against the same statement through Session. The second number is
      # a ratio between two paths timed in one run on one machine, so a
      # shared runner cannot move it, and it is what stops the SDK from
      # growing a copy or a re-read on the hot path unnoticed.
      - run: ZU_GATE=1 cargo bench -p zu --bench connect

  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The dx/04 section 6 gate on the bulk-load appender: what
      # buffering one row costs, and what batching buys over committing
      # per row. The second is a ratio between two loads timed in one
      # run on one machine, and it is the appender's reason to exist
      # stated as a number, so a flush that stopped being a batch fails
      # here rather than being noticed by a user loading a million rows.
      - run: ZU_GATE=1 cargo bench -p zu --bench append

  capi-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The dx/02 section 3 gate on the C ABI's two read paths: what a
      # chunked scan costs over a whole-column one, and what reading a
      # chunk instead of a column buys a host that stops early. Both are
      # ratios timed in one run over one column, so a shared runner
      # moves neither, and both fail on the same defect from opposite
      # sides: a chunked read that converts more than its chunk.
      - run: ZU_GATE=1 cargo bench -p zu-capi --bench result

  arrow-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # What an export costs when the result is taken instead of
      # borrowed. Both halves run over the same statement in one
      # process, so it is a ratio and a shared runner does not move it,
      # and it fails on exactly one defect: a copy coming back to the
      # path whose whole point is that there is not one.
      - run: ZU_GATE=1 cargo bench -p zu-arrow --bench export

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # What an invocation costs before it does anything, which is the
      # one number a library bench cannot give because the process is
      # the unit a user waits for. The ceiling in bench/budgets.toml is
      # deliberately loose, since startup regresses in kind and not by
      # percent; the assertion that no help form costs twice the floor
      # runs on every machine and is the sensitive half.
      - run: ZU_GATE=1 cargo bench -p zu-cli --bench cli

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      # The cases themselves run as a test in the matrix above, on all
      # three platforms, which is what makes them fire on the machine
      # of whoever adds one. This job runs them the other way, through
      # the shipped binary against a directory, because that is how the
      # release artifact is consumed and a runner that only ever ran
      # from its own source tree would not have been tested doing it.
      #
      # `--strict` is the part the test cannot do. A case the engine
      # does not implement is allowed in a working tree, on purpose,
      # because the cases are the contract and the engine catches up to
      # them. It is not allowed on a branch heading for a release, so
      # the gate lives here rather than in the runner's defaults.
      - run: cargo run -p zu-cli --release -- corpus conformance/cases --strict
      # The reader is read by nine repositories on every CI run of each
      # of them, so its cost per case is asserted to stay linear as the
      # corpus grows. The bench fails rather than reporting when it
      # does not.
      - run: cargo bench -p zu-corpus --bench corpus
      # The artifact eight other repositories consume, built here on
      # every pull request rather than for the first time on the day of
      # a release. `--check` writes nothing: what is being gated is that
      # the corpus still packs and that every case in it parses, which
      # is the packer's own precondition and the cheapest place to find
      # out it does not hold.
      - run: cargo run -p xtask -- corpus-pack --check
      - run: cargo bench -p xtask --bench corpus
      # The second reader of the same files, in the language the C
      # runner is written in. It runs over every case rather than over
      # a handful of literals, because 18 files of hand written YAML are
      # a better adversary than anything a test would think to write,
      # and it runs under both sanitizers, because a reader in C over
      # files nobody validated first is exactly where a bad index lives.
      # `-fno-sanitize-recover` because UBSan prints and carries on by
      # default, and a report nothing acts on is a report nobody reads.
      # The decoder above it gets the same treatment over the same
      # files, which is 1794 values through the temporal parser and the
      # float printer on every pull request.
      - name: The C reader and decoder over every case
        run: |
          flags="-std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer"
          cc $flags -o "$RUNNER_TEMP/yaml_test" \
            conformance/c/yaml.c conformance/c/yaml_test.c
          "$RUNNER_TEMP/yaml_test" conformance/cases/*.yaml
          cc $flags -o "$RUNNER_TEMP/value_test" \
            conformance/c/yaml.c conformance/c/value.c conformance/c/value_test.c
          "$RUNNER_TEMP/value_test" conformance/cases/*.yaml
      # The same cases as the first step of this job, through the C ABI
      # instead of through the crate, which is the thing eight client
      # repositories will be doing with them. `--strict` for the reason
      # given up there, and both sanitizers because this one runs the
      # engine as well as the reader: a pointer a result hands back and
      # a C host holds on to for one line too long is the failure that
      # would otherwise be found by a client and not by us. The library
      # is not instrumented and does not need to be, since what is being
      # watched here is the C side of the boundary.
      # What the two runners print is diffed rather than only checked,
      # because agreeing is the property that matters and passing is
      # only the case where agreeing is easy. Two runners that both
      # break in the same week would otherwise show as two red jobs
      # nobody can line up; this shows as the one case they differ on.
      # The C run's exit code is kept and used at the end, so a failure
      # gets diffed before it stops the step.
      - name: The C runner over every case, against the C ABI
        run: |
          cargo build -p zu-capi --release
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Icrates/zu-capi/include \
            -o "$RUNNER_TEMP/runner" \
            conformance/c/yaml.c conformance/c/value.c conformance/c/runner.c \
            -Ltarget/release -lzu -Wl,-rpath,"$PWD/target/release"
          mkdir -p "$RUNNER_TEMP/corpus"
          status=0
          "$RUNNER_TEMP/runner" --dir "$RUNNER_TEMP/corpus" --strict \
            conformance/cases/*.yaml > "$RUNNER_TEMP/c.txt" || status=$?
          cargo run -q -p zu-cli --release -- corpus conformance/cases \
            > "$RUNNER_TEMP/rust.txt" || true
          diff -u "$RUNNER_TEMP/rust.txt" "$RUNNER_TEMP/c.txt"
          cat "$RUNNER_TEMP/c.txt"
          # The other half of agreeing, which the corpus cannot show
          # because it passes: what the two say when a case does not.
          # Both of these exit 1 on purpose, so what is gated is the
          # diff and not the status.
          "$RUNNER_TEMP/runner" --dir "$RUNNER_TEMP/corpus" \
            conformance/c/wrong/wrong.yaml > "$RUNNER_TEMP/c-wrong.txt" || true
          cargo run -q -p zu-cli --release -- corpus conformance/c/wrong \
            > "$RUNNER_TEMP/rust-wrong.txt" || true
          diff -u "$RUNNER_TEMP/rust-wrong.txt" "$RUNNER_TEMP/c-wrong.txt"
          exit $status
      # The fourth C program the repository has, and the one a package
      # consumer actually writes: scripts/libzu-build.sh runs it on
      # seven platforms against the staged package, where it proves the
      # artifact links and answers and nothing is watching how. Here it
      # is watched. Both sanitizers, for the same reason the runner
      # gets them, and it is built from the same source file so that
      # what is checked is the program that ships and not a copy.
      - name: The C smoke test under the sanitizers
        run: |
          printf '1 2\n1 3\n2 3\n3 1\n' > "$RUNNER_TEMP/edges.txt"
          cargo run -q -p zu-cli --release -- \
            copy "$RUNNER_TEMP/edges.txt" "$RUNNER_TEMP/smoke.zu1"
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -Icrates/zu-capi/include \
            -o "$RUNNER_TEMP/smoke" crates/zu-capi/tests/smoke.c \
            -Ltarget/release -lzu -Wl,-rpath,"$PWD/target/release"
          "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke.zu1"
      # The third tool over the same four programs, and the one that
      # watches what the other two cannot. ASan instruments the source
      # it compiles, so it sees nothing libzu does with its own memory
      # and nothing a prebuilt library does with the pointers it was
      # handed; Valgrind instruments the instructions that run, so the
      # engine is watched too, across the boundary the ABI draws. It
      # also reports a read of memory nobody wrote, which ASan does not
      # look for at all and which is the bug a C client hits first. This
      # is a separate, uninstrumented build because ASan and Valgrind
      # cannot share a process.
      #
      # --error-exitcode is what makes a report a failure rather than
      # something in a log nobody opens. Definite leaks only: a Rust
      # process holds one-time allocations at exit that are still
      # reachable and not lost, and counting those would fire this gate
      # on every run and teach everyone to ignore it. --track-origins
      # roughly doubles the cost, so the two readers get it, where it
      # turns "uninitialised" into the line that left it that way, and
      # the runner does not, because the runner also runs the engine
      # over all 1246 cases and that is where the minutes are.
      - name: The C programs under Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          vg() {
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite -q "$@"
          }
          flags="-std=c99 -O1 -g -Wall -Wextra -Werror -pedantic"
          cc $flags -o "$RUNNER_TEMP/vg-yaml" \
            conformance/c/yaml.c conformance/c/yaml_test.c
          cc $flags -o "$RUNNER_TEMP/vg-value" \
            conformance/c/yaml.c conformance/c/value.c conformance/c/value_test.c
          cc $flags -Icrates/zu-capi/include -o "$RUNNER_TEMP/vg-runner" \
            conformance/c/yaml.c conformance/c/value.c conformance/c/runner.c \
            -Ltarget/release -lzu -Wl,-rpath,"$PWD/target/release"
          cc $flags -Icrates/zu-capi/include -o "$RUNNER_TEMP/vg-smoke" \
            crates/zu-capi/tests/smoke.c \
            -Ltarget/release -lzu -Wl,-rpath,"$PWD/target/release"
          vg --track-origins=yes "$RUNNER_TEMP/vg-yaml" conformance/cases/*.yaml
          vg --track-origins=yes "$RUNNER_TEMP/vg-value" conformance/cases/*.yaml
          vg --track-origins=yes "$RUNNER_TEMP/vg-smoke" "$RUNNER_TEMP/smoke.zu1"
          mkdir -p "$RUNNER_TEMP/vg-corpus"
          vg "$RUNNER_TEMP/vg-runner" --dir "$RUNNER_TEMP/vg-corpus" --quiet \
            --strict conformance/cases/*.yaml

  terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The terminology table lives in tamnd/zu-web, because the site is
      # where this program's prose is published from, and the reader
      # lives here, because the prose with the most readers is here.
      # That makes this the one job that needs two checkouts. It tracks
      # zu-web's main rather than a pin: the table is prose about what
      # words mean, a word that changed meaning has changed for this
      # repository the moment it changed for the site, and a pin would
      # mean the two agreed on paper while disagreeing in fact.
      - uses: actions/checkout@v7
        with:
          repository: tamnd/zu-web
          path: zu-web
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- terms
      # A prose check that costs seconds is a check that runs here and
      # on nobody's machine, and a check nobody runs locally only ever
      # reports things at review time. The bench asserts the cost stays
      # linear in the prose and flat in the size of the table, so that
      # adding a term stays a decision about the word.
      - run: cargo bench -p xtask --bench terms

  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grammar/package-lock.json
      # The editor's grammar, which is tamnd/tree-sitter-gql and used to
      # be a directory here. Checked out so the audit below covers all
      # three highlighters rather than the two that live here.
      - uses: actions/checkout@v7
        with:
          repository: tamnd/tree-sitter-gql
          path: tree-sitter-gql
      # One word list, three highlighters. This is the check that the
      # shell's table, the editor grammar and the website's grammar
      # still hold the same words, and that the two generated files are
      # the ones the list writes.
      - run: cargo run -p xtask -- grammar --check
        env:
          ZU_TREE_SITTER: ${{ github.workspace }}/tree-sitter-gql
      # A hundred and fifty words is not the size this list ends at, so
      # the bench asserts the cost per word stays flat rather than
      # asserting a total.
      - run: cargo bench -p xtask --bench grammar
        env:
          ZU_TREE_SITTER: ${{ github.workspace }}/tree-sitter-gql
      - run: npm ci
        working-directory: grammar
      # The website's grammar against the corpus: no word in a thousand
      # statements is painted as a kind of word it is not. The editor
      # grammar gets the same corpus put to it by its own CI, which runs
      # this repository's reader against its own tree.
      - run: npm test
        working-directory: grammar

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step, and that is the point. What the extension
      # decides before it talks to the editor is a command line, and
      # nothing about deciding it needs a package: the tests run on the
      # node that is already here, in a second, so the manifest against
      # the code and the grammar against its generator are checked on
      # every commit rather than at package time.
      - run: npm test
        working-directory: editors/vscode

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpora
        run: cargo run --manifest-path fuzz/Cargo.toml --bin seeds
      - name: Fuzz decoders
        run: |
          for target in zu1_decode decode_segment decode_for_bitpack decode_delta decode_delta_patch decode_bool_bitpack decode_frequency vector_kernels; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45 -rss_limit_mb=3072
          done
      - name: Fuzz file verify
        run: cargo +nightly fuzz run zu1_file -- -max_total_time=60 -rss_limit_mb=3072 -max_len=2200000
      - name: Keep artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
