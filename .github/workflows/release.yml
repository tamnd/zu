name: release

# The release train of dx/14 section 6: one version number, one day,
# one orchestrated run across nine repositories. This is the skeleton of
# it, and what is real here is deliberate. The build is the same matrix
# every pull request runs, the assemble step gathers exactly the rows of
# artifacts.toml, and the verify step reads the directory back against
# the same table. Two of the publishes are real, crates.io and the
# GitHub release, and only on a tag. Every other publish step is a
# no-op that says what it would do.
#
# The ordering is the part worth having this early, because it is the
# part that is expensive to discover late: crates.io lands before the
# repositories that build against it, and the Go tag is last of the
# registries because pushing a tag is the one publish that cannot be
# taken back. A skeleton that runs the real order on every rehearsal is
# how the order stops being a paragraph in a specification.

on:
  push:
    tags: ["v*"]
  # A rehearsal, on a branch, with no tag. The train is the thing that
  # must not be run for the first time on the day of a release.
  workflow_dispatch:
    inputs:
      version:
        description: The version to rehearse as
        required: false
        default: 0.0.0

concurrency:
  # Two releases at once is two versions publishing to nine registries
  # in an order neither of them chose, and cancelling the one already
  # part way through is worse than queueing behind it.
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Read only unless a job says otherwise. The one job that writes to the
# repository is the GitHub release, and the one that holds a credential
# is crates.io, which reads it from an environment rather than from the
# repository so no other job can.
permissions:
  contents: read

jobs:
  # A tag that does not pass this does not become a release. Everything
  # here is cheaper to find out before the first upload than after it,
  # because a version on crates.io cannot be taken back, only yanked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - name: The tag is the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          have=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zudb") | .version')
          if [ "${tag#v}" != "$have" ]; then
            echo "the tag $tag says ${tag#v} and Cargo.toml says $have"
            exit 1
          fi
      # The release notes are this section, so a tag without one is a
      # release with nothing to say about itself.
      - name: The changelog has the version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.version || github.ref_name }}"
          if [ "${{ github.event_name }}" = push ] && ! grep -qx "## ${tag#v}" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${tag#v}"
            exit 1
          fi
      # Every crate packaged and built from its own tarball, the way
      # crates.io will see it, before any of them is uploaded. The upload
      # verifies each crate too, but only as it reaches it, and a crate
      # that fails there leaves the ones before it published at a version
      # the rest will never join.
      - name: Every crate builds as published
        run: cargo publish --workspace --locked --dry-run

  # The seven tier 1 platforms, called rather than repeated, so a
  # release ships the artifacts CI has been building all along.
  libzu:
    needs: verify
    uses: ./.github/workflows/libzu.yml

  # Every crate without `publish = false`, in dependency order, which is
  # zudb and the zudb-* crates under it and zudb-cli. They go first of
  # the registries because everything else builds against them, and the
  # GitHub release waits for them so that a release which exists is one
  # `cargo add zudb` can get.
  #
  # The token is a secret of the crates-io environment, which only a
  # `v*` tag can deploy to, so a branch, a pull request or a rehearsal
  # never sees it. It is in the environment of one step and nothing
  # prints it. No cache step: this job compiles each crate once, inside
  # `cargo publish`, and never again.
  #
  # The first release is fourteen crates crates.io has never seen, at
  # one every ten minutes after a burst of five, so the timeout is set
  # for that. If it runs out nothing is lost: the script asks the index
  # what is up and re-running the job carries on from there.
  crates-io:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: crates-io
      url: https://crates.io/crates/zudb
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      # Current tokens are `cio` and 32 characters. Anything else is a
      # token revoked in 2020 or a value that picked up a quote or a
      # newline on its way into the secret, and either is worth finding
      # before the first upload. Only the verdict is printed.
      - name: The token is shaped like a token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if ! printf '%s' "${CARGO_REGISTRY_TOKEN:-}" | grep -Eq '^(cio)?[A-Za-z0-9]{32}$'; then
            echo "CARGO_REGISTRY_TOKEN on the crates-io environment is missing or malformed"
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  assemble:
    needs: libzu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      # One directory per platform, under the name that platform's job
      # uploaded it as, which is the name the release publishes it as.
      - uses: actions/download-artifact@v4
        with:
          pattern: libzu-*
          path: built
      # The tag is the version, with the `v` off it, because a git tag
      # is written `v0.5.0` and a package is not. A rehearsal says which
      # version it is rehearsing instead.
      - name: Assemble the release
        shell: bash
        run: |
          set -eux
          tag="${{ inputs.version || github.ref_name }}"
          version="${tag#v}"
          cargo run -p xtask -- artifacts --assemble dist --built built --version "$version"
          cargo run -p xtask -- artifacts --verify dist --version "$version"
          # The two package manager manifests, rendered over the digest
          # list that was just written, so what `brew install` and
          # `scoop install` check is the release's own numbers rather
          # than a person's copy of them. They go to a tap and a bucket
          # that live in other repositories, which is the publish step
          # below that is still a no-op, so they are uploaded here and
          # pushed there.
          cargo run -p xtask -- packaging --version "$version" --sums dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          if-no-files-found: error
          path: packaging

  # The eight repositories, driven rather than releasing on their own
  # schedule, which is what keeps one version number meaning one thing.
  # It runs after the artifacts exist because every one of them builds
  # against those artifacts, and before the registries because a binding
  # that fails its gates stops the release rather than following it.
  conductor:
    needs: assemble
    uses: ./.github/workflows/conductor.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  # A rehearsal skips crates.io, and a job whose needs were skipped is
  # skipped with them unless it says otherwise, so this says run when
  # nothing failed. The steps that publish check for a tag themselves.
  publish:
    needs: [assemble, conductor, crates-io]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance, so a downloaded archive can be checked against the
      # workflow run and the commit that built it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: What is being published
        shell: bash
        run: ls -l dist
      # Each step below is the step that will exist, in the order it
      # will run, doing nothing. They are separate steps rather than one
      # loop because the run's own step list is then the ordering, which
      # is what a person reads when a release stops half way through.
      - name: Attest the archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # The notes are the changelog section, written by hand, with
      # GitHub's list of merged pull requests after it. Created once and
      # uploaded over on a re-run, so running this job again ends where
      # the first run would have.
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          awk -v want="## ${tag#v}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" \
              --notes-file notes.md --generate-notes
          fi
      - name: crates.io
        run: |
          echo "done in the crates-io job before this one: zudb, the zudb-* crates under it, and zudb-cli"
      - name: PyPI
        run: |
          echo "no-op: publish the wheels zu-python built against these artifacts"
      - name: npm
        run: |
          echo "no-op: publish zudb and its platform packages, then the JSR re-export"
      - name: Maven Central
        run: |
          echo "no-op: publish dev.zudb, which is a staging repository that has to be closed and released"
      - name: NuGet
        run: |
          echo "no-op: publish ZuDb"
      - name: Go module tag
        run: |
          echo "no-op: push the tag on zu-go, last of the registries because a Go module cannot be unpublished"
      - name: Docs and release notes
        run: |
          echo "no-op: deploy zu-web against this version, publish the notes, push the rendered Homebrew formula and Scoop manifest to the tap and the bucket, and bump AUR"
      - name: What this run did not do
        run: |
          echo "The dispatches to the eight repositories ran and did nothing, because none of them has a release workflow yet."
          echo "What is real is crates.io and the GitHub release, and only on a tag."
          echo "Every publish above is idempotent when it is real, so a partial release is resumed and not restarted."
