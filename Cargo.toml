[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tamnd/zu"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
zu-common = { path = "crates/zu-common" }
zu-encoding = { path = "crates/zu-encoding" }
zu-storage = { path = "crates/zu-storage" }
zu-zu1 = { path = "crates/zu-zu1" }
zu-sqlite = { path = "crates/zu-sqlite" }
zu-s3 = { path = "crates/zu-s3" }
zu-query = { path = "crates/zu-query" }
zu = { path = "crates/zu" }

thiserror = "2"
crc32c = "0.6"
object_store = { version = "0.14", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
