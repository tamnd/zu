[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/zu"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
zu-common = { path = "crates/zu-common" }
zu-encoding = { path = "crates/zu-encoding" }
zu-json = { path = "crates/zu-json" }
zu-vector = { path = "crates/zu-vector" }
zu-storage = { path = "crates/zu-storage" }
zu-zu1 = { path = "crates/zu-zu1" }
zu-sqlite = { path = "crates/zu-sqlite" }
zu-s3 = { path = "crates/zu-s3" }
zu-query = { path = "crates/zu-query" }
zu-exec = { path = "crates/zu-exec" }
zu = { path = "crates/zu" }
zu-arrow = { path = "crates/zu-arrow" }
zu-corpus = { path = "crates/zu-corpus" }

thiserror = "2"
crc32c = "0.6"
zstd = "0.13"
ruzstd = "0.9"
object_store = { version = "0.14", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-array = "59"
arrow-schema = "59"
# The umbrella crate, with nothing turned on by default: zu-arrow adds
# the ffi and ipc features, and each client turns on the one it exports
# through.
arrow = { version = "59", default-features = false }
tempfile = "3"

[workspace.lints.rust]
# The loom suite compiles under RUSTFLAGS="--cfg loom"; teach the
# checker the cfg exists so plain builds stay warning-free.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# One codegen unit per crate rather than the sixteen cargo splits a
# release into. The units are compiled apart and each one carries its
# own copy of whatever it inlined, so the same generic instantiated in
# two of them is in the binary twice, and a tree that is mostly generic
# kernels pays that everywhere. Measured on aarch64-apple-darwin the CLI
# went from 13.01 MiB to 11.36, which is an eighth of it, and the build
# it costs is under two minutes more. The ceiling in platforms.toml is
# 15 MiB and the vector kernels had walked it to 15.48 on the ELF rows,
# so this is the room the rest of them land in.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Benches keep symbols so check_asm.sh and profilers can find the
# kernel anchors; codegen is otherwise identical to release.
[profile.bench]
strip = "none"
