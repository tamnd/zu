[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tamnd/zu"
authors = ["Tam Nguyen <tamnd87@gmail.com>"]

[workspace.dependencies]
zu-common = { path = "crates/zu-common" }
zu-encoding = { path = "crates/zu-encoding" }
zu-json = { path = "crates/zu-json" }
zu-vector = { path = "crates/zu-vector" }
zu-storage = { path = "crates/zu-storage" }
zu-zu1 = { path = "crates/zu-zu1" }
zu-sqlite = { path = "crates/zu-sqlite" }
zu-s3 = { path = "crates/zu-s3" }
zu-query = { path = "crates/zu-query" }
zu-exec = { path = "crates/zu-exec" }
zu = { path = "crates/zu" }
zu-arrow = { path = "crates/zu-arrow" }
zu-corpus = { path = "crates/zu-corpus" }

thiserror = "2"
crc32c = "0.6"
zstd = "0.13"
ruzstd = "0.8"
object_store = { version = "0.14", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-array = "59"
arrow-schema = "59"
# The umbrella crate, with nothing turned on by default: zu-arrow adds
# the ffi and ipc features, and each client turns on the one it exports
# through.
arrow = { version = "59", default-features = false }
tempfile = "3"

[workspace.lints.rust]
# The loom suite compiles under RUSTFLAGS="--cfg loom"; teach the
# checker the cfg exists so plain builds stay warning-free.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true

# What a release ships, which is not what a developer builds.
#
# The CLI carries arrow and parquet and libzu does not, and on darwin
# that is 5.12 MiB of a 13.03 MiB binary: 13.03 with the feature and
# 7.91 without it. Those crates are generic enough that thin LTO leaves
# most of the duplicate instantiations in place, and the three targets
# that are not darwin were over the 15 MiB ceiling because of it (#492).
# A fat link takes the pair to 11.62 MiB with no feature removed.
#
# It costs link time, which is why it is a profile of its own rather
# than a change to release. `cargo build`, `cargo test` and every bench
# keep the thin link they have, and only scripts/libzu-build.sh asks for
# this one. profile.bench inherits release for the same reason:
# check_asm.sh and the perf gates are read on the codegen a developer
# gets, not on a link nobody runs twice. How much it costs is a number
# the libzu matrix prints per target on every push, which is a better
# record of it than anything a laptop measures: the two builds here came
# out 5:03 and 15:41 in the wrong order, on a machine that throttles.
[profile.dist]
inherits = "release"
lto = "fat"

# And the same crates asked to be small rather than fast, which is
# another 1.19 MiB on top of the fat link, 11.62 to 10.43. Nothing zu
# wrote is in this list: the engine, the encodings and the kernels stay
# at opt-level 3, and what changes is the parquet reader and writer,
# which is a decoder in front of a file rather than anything on the
# query path.
#
# The cost was not settled here and this laptop cannot settle it. Six
# interleaved warm runs of `zu copy` over a 4 M edge parquet file
# measure a median of 6.6 M edges a second against 6.3, which is inside
# the spread of the runs either side of it. The number belongs on
# server1/2/3, and if it turns out to be real the answer is to drop this
# block and find the megabyte somewhere else, because size is a ceiling
# and throughput is the product.
#
# The list is written out rather than globbed so that an arrow crate
# arriving in a version bump shows up as the binary growing, which is a
# question somebody answers, rather than as a decoder quietly changing
# speed, which is not.
[profile.dist.package.parquet]
opt-level = "s"

[profile.dist.package.thrift]
opt-level = "s"

[profile.dist.package.zstd]
opt-level = "s"

[profile.dist.package.zstd-safe]
opt-level = "s"

[profile.dist.package.zstd-sys]
opt-level = "s"

[profile.dist.package.snap]
opt-level = "s"

[profile.dist.package.arrow]
opt-level = "s"

[profile.dist.package.arrow-arith]
opt-level = "s"

[profile.dist.package.arrow-array]
opt-level = "s"

[profile.dist.package.arrow-buffer]
opt-level = "s"

[profile.dist.package.arrow-cast]
opt-level = "s"

[profile.dist.package.arrow-data]
opt-level = "s"

[profile.dist.package.arrow-ipc]
opt-level = "s"

[profile.dist.package.arrow-ord]
opt-level = "s"

[profile.dist.package.arrow-row]
opt-level = "s"

[profile.dist.package.arrow-schema]
opt-level = "s"

[profile.dist.package.arrow-select]
opt-level = "s"

[profile.dist.package.arrow-string]
opt-level = "s"

[profile.bench]
strip = "none"
