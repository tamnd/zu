# to 3.9, server3 2.6 to 3.5. The floor sits under the loaded vCPU
# hosts' worst run. Raise this floor, never lower it.
read_gather_mrows_s = 1.5

# Width-13 bitpack unpack through the FastLanes style transposed
# layout, G vals/s. The perf/11 target is 4 G and the local M series
# runs 4.84, up from 1.73 on the sequential layout; gamingpc 2.63,
# server1 1.63 to 1.99, server3 1.13. The x86 hosts vectorize (the
# check_asm gate proves it) but the shared vCPUs do not reach the
