# server1 4.6 to 5.2, server3 3.5 to 3.8 under its crawl. Raise this
# floor, never lower it.
read_scan_gbs = 2.0

# The same scan under a 1 percent range predicate, effective GB/s of
# logical bytes with the chunk zone maps skipping the other 99
