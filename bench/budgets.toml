# Decode throughput floors in GB/s of decoded output, single core.
# The M0 exit gate is 1.0 for every encoding (docs/12-implementation-plan.md).
# Floors are set for the slowest gate machine (AMD EPYC vCPU, server1);
# gamingpc numbers run far above them. Raise floors, never lower them.

for_bitpack = 1.0
delta_bitpack = 1.0
delta_patch = 1.0
rle = 1.0
dict = 1.0
bool_bitpack = 1.0
frequency = 1.0
fsst = 1.0
alp = 1.0
alp_rd = 1.0

# The Zstd leaf is the deliberate exception to the 1.0 contract: docs/01
# adopted the cascade precisely so nothing hot needs general-purpose
# compression, and the leaf exists for cold string segments where ratio
# wins over decode speed (docs/04 marks id 11 optional). These floors
# track regressions in the two read paths, libzstd behind the feature
# and the pure Rust ruzstd fallback, sized for the EPYC vCPU hosts.
# Raise floors, never lower them.
zstd = 0.25
zstd_fallback = 0.05

# COPY ingest floors, single core, sort included, parse excluded (B6/B8).
# The density keys are ceilings, not floors, set just above the measured
# LiveJournal numbers with per-chunk MiniBlock cascades: raw order 22.31,
# BFS 21.52. Lower ceilings, never raise them. The 8.0 exit budget from
# docs/12 remains open: patched exceptions removed the outlier tax, but
# in-list gaps on LiveJournal run 16-18 bits even BFS-reordered, because
# BFS frontiers on a social graph are millions wide. Getting under 8
# needs an LLP-class ordering or copy-list compression, both deferred by
# docs/04 section 5.
copy_medges_s = 1.0
bits_per_edge = 22.5
bits_per_edge_bfs = 22.0

# Reverse-direction CSR density ceiling, block bytes over edge count.
# Measured 22.13 raw and 21.34 BFS on all three machines; bwd runs
# slightly denser than fwd because it carries no header or directory
# overhead. Lower this ceiling, never raise it.
bits_per_edge_bwd = 22.3

# Random 1-hop point reads on the loaded LiveJournal file, single core,
# K lookups/s. Each lookup decodes only the chunks holding the node's two
# offsets and its neighbor list. Measured: gamingpc 237, server3 50,
# server1 46; the floor leaves the usual vCPU noise headroom under the
# slowest machine. Raise floors, never lower them.
point_klookups_s = 30.0

# In-neighbor point reads through the bwd CSR. Measured: gamingpc 233,
# server3 44 to 45, server1 46 warm but 4 on the pass where the 383 MB
# dual-direction file no longer fits page cache and the tail goes to the
# virtio disk (p50 stays 16 us, p99 hits 5 ms). The floor sits under that
# cold tail until the reader manages its own memory (B3); it still
# catches a broken point path, which measures well under 1 on every
# machine when it decodes whole groups.
point_in_klookups_s = 2.0

# Random edge probes on the loaded LiveJournal file, single core,
# K probes/s, half present and half near misses. A probe reads two
# offsets and then exactly one neighbor chunk named by the fence array,
# so hub degrees do not move the number. Measured warm: gamingpc 235
# to 243, server3 34 to 62, server1 52 to 62. The 30.0 floor was set
# from warm passes only; server1 then showed the same cold tail the
# point_in floor already documents, 14 to 15 K with p50 steady at 17 us
# and p99 at 1 ms of virtio disk, on the raw-order pass after the bwd
# reads evict the fwd pages from its 850 MB of available memory. Like
# point_in_klookups_s, the floor sits under that cold tail until the
# reader manages its own memory (B3); a broken probe path that decodes
# whole neighbor lists measures well under 1 on every machine.
edge_probe_kprobes_s = 2.0

# Primary-key lookups through the sealed sorted index on the BFS
# reordered LiveJournal file, single core, K lookups/s, three quarters
# hits and one quarter misses above the key domain. A lookup is a fence
# partition point over the cached chunk directory, one key chunk decode,
# a binary search, and one row read. Measured warm: gamingpc 403,
# server1 92, server3 90. But server1 holds 750 MB of free memory
# against the 384 MB file, and on a cold pass the key segments hit the
# virtio disk (p50 stays 12 us, p99 goes to 398 us, throughput 27).
# Like point_in_klookups_s, the floor sits under that cold tail until
# the reader manages its own memory (B3); a broken lookup path that
# scans the key column measures well under 1 on every machine.
key_klookups_s = 20.0

# FullZip string segments over the raw lines of soc-LiveJournal1.txt,
# single core. The scan floor is GB/s of value bytes through the full
# read path, crc and all; the point floor is random single-row reads,
# each a chunk seek through the offset samples plus one chunk decode.
# Measured scan: gamingpc 2.11, server1 0.65; point: gamingpc 200,
# server1 40 with p99 87 us. The floors leave the usual vCPU noise
# headroom under the slowest machine; the 22 MB payload fits page cache
# everywhere, so the cold tail the CSR point floors document does not
# apply here. Raise floors, never lower them. Writer throughput prints
# as information only: FSST trains a fresh table per chunk and that
# cost is a known encoder cost, not a read-path regression signal.
fullzip_scan_gbs = 0.4
fullzip_row_kreads_s = 20.0

# On-disk ratio for the 4 M LiveJournal lines, payload bytes over value
# bytes. FSST training is deterministic, so every machine reading the
# same file lands on the same 0.476; the bench only checks this key on
# the real corpus. Lower this ceiling, never raise it.
fullzip_ratio = 0.48

# LDBC SNB SF1 latency ceilings straight from docs/11, gated by the
# ldbc bench in the facade crate over the real person-knows-person
# graph: 10 K persons, 173 K knows edges, keyed load with the original
# LDBC ids in the primary-key index. B1 is warm 1-hop expands at
# deg <= 100 p50 through the cached-group path, the read the executor's
# Expand makes once a query is warm, timed in batches of 100 because a
# single warm expand sits at timer resolution; the storage point path
# prints as
# information and keeps its own floors on LiveJournal, where server1
# measured it at 12.5 us p50 on this graph. B2 is warm pk lookups p50
# through the sealed index with its decoded-chunk cache; warm means the
# chunk was touched before, and a warm hit is a fence partition point
# plus a binary search. Lower these ceilings, never raise them.
ldbc_hop_p50_us = 10.0
ldbc_key_p50_us = 2.0

# B4, the 2-hop factorized count on SF1 under 10 ms (docs/11, docs/12).
# Three executor changes carry it. The count-to-degree rewrite turns an
# unfiltered count over a trailing expand into degree reads instead of
# 7.6 M materialized second-hop values, and the absorbed source vector
# drops its flatten, so the query is one batched degree sum per
# first-hop vector. Dead rel columns stop materializing, which on this
# query was 173 K Value::Rel per run for an anonymous rel only the
# count ever saw. Measured p50 from the 170 to 670 ms baseline:
# gamingpc 2.8 ms, local M series 3.0 ms, server1 8.6 ms with a p99 of
# 19.9 ms from vCPU steal. server3 runs a sustained background crawl
# holding its 8 vCPUs at load 15 to 31 and measures 11.6 to 13 ms
# under that contention while its idle twin server1 passes, so like
# the cold tails the CSR point floors document, its number is
# information until the box quiets down. The morsel scheduler then
# took the quiet hosts to 1.6 ms on gamingpc and 1.7 ms locally.
# server1 has since picked up a sustained service load of its own,
# sentry plus a cilium and containerd node holding its 4 cores at
# load 7 to 8, and under that oversubscription parallel runs measure
# 10 to 18 ms with sequential at 8.2 ms and a 20 ms p99, so its
# number joins server3's as information until the box quiets down.
# The pipeline executor of zu#75 then fused the trailing counting
# expands into a degree product that reads CSR offsets and never
# touches a neighbor value, which took the quiet hosts to 0.24 ms
# locally. The ceiling comes down to 8 ms rather than to anything near
# that measurement because the two loaded hosts still have to pass it.
# Lower this ceiling, never raise it.
ldbc_two_hop_p50_ms = 8.0

# The LDBC IS and IC subset on SF1 (docs/12 M2 exit), parse to result
# through zu::query::run against the person props columns the loader
# stores next to the CSR. IS is the IS1-shaped profile read, all eight
# person properties by original id, gated at the G2 1 ms warm p50 from
# docs/02. IC is the IC-shaped friends-of-friends read, 2 hops with
# DISTINCT, string projections, ORDER BY, and LIMIT; its cost is the
# 2-hop multiset's property reads, held down by the per-column decoded
# chunk the props reader keeps, and its p99 belongs to hub seeds whose
# neighborhoods hop across chunks. The IC ceiling comes down from 10 to
# 6 now that the second hop batches its descent instead of pinning one
# friend at a time: measured p50 before and after on the same files,
# gamingpc 0.88 to 0.46, server1 3.11 to 1.39, server3 2.77 to 1.49.
# Six leaves the loaded hosts the room they need, server1 ran a 23 ms
# p99 on hub seeds in the same pass, and it is still under half of what
# the slowest machine measured before. Every measured run asserts
# against a reference recomputed from the raw props and edge files.
# Lower these ceilings, never raise them.
ldbc_is_p50_ms = 1.0
ldbc_ic_p50_ms = 6.0

# The seeded two hop asked as a number rather than as rows, how many
# different people a person reaches in two steps. It is the shape every
# k-hop benchmark counts with, and unlike IC above it there is nothing
# between the walk and the answer but the distinct set, so what the set
# costs is what moves this line. Like IS and IC it goes through the one
# shot zu::query::run, so a fair part of the number is parse and plan.
#
# The count now compiles: a distinct count is a group by its own
# argument whose answer is how many groups there are, so it goes to the
# pipeline's group table instead of sending the query back to the row
# at a time engine and its BTreeSet per run. Measured p50 against the
# old engine on the same files: gamingpc 0.177 against 0.213, server1
# 0.466 against 0.595, local M series 0.218 against 0.266, with the p99
# 0.523 against 1.143 locally.
#
# server1 is the floor host and reads 0.466 and 0.469 across two
# passes, but it also read a 7.764 ms p99 on hub seeds in one of them,
# so the ceiling carries the room that spread asks for rather than
# sitting near the p50. Lower this ceiling, never raise it.
ldbc_distinct_two_hop_p50_ms = 2.0

# The unseeded directed triangle count on SF1, the AspJoin shape from
# docs/07: the optimizer marks the closing expand because probing 7.6 M
# 2-paths against storage would cost far more than the 173 K edges the
# accumulate sweeps once into a hash table. The semijoin fuses into the
# probe, which retains each unflat neighbor vector in place, so the
# count(*) sink multiplies survivors without a flatten. The run is
# dominated by the 7.6 M hash probes, about 21 ns each locally with the
# multiply-xor edge hasher; the accumulate itself is 10 K neighbors
# calls and 173 K inserts, single-digit ms. Sequential p50 measured
# gamingpc 120 to 124 ms, local M series 132 to 165 ms, server1 531
# to 599 ms with vCPU steal spikes to 872 ms. The morsel scheduler
# roughly halves it wherever a core is idle: gamingpc 67 ms, local
# 68 ms, and even oversubscribed server1 drops to 334 to 418 ms.
# The loaded hosts run 720 ms (server2) and 1217 ms (server3, under
# its crawl), information like their B4 numbers until those boxes
# quiet down. The ceiling keeps headroom for server1 to gate again
# when its service load lifts. Every measured run asserts the count
# against a reference walked from the raw edge list.
#
# P3 rewrote the closing intersect to run off borrowed pins with a
# gallop and merge switch, and the ceiling comes down 600 to 150 with
# it. Measured at 6b34892: gamingpc 8.28 and 8.42 ms, local M series
# 10.08 to 10.71, server3 33.04, server1 49.05 quiet and 65.31 under
# a load average of 5.9 on its 4 cores, server2 81.82. The two bare
# metal hosts are inside the 25 ms perf/05 asks for; the shared vCPU
# hosts are 4 to 8x behind that and the ceiling has to clear all of
# them, so it sits at 150 with headroom over server1's worst p50
# rather than at the target. Lower this ceiling, never raise it.
ldbc_triangle_p50_ms = 150.0

# The same SF1 triangle walked undirected, 1.77 M closed paths. It is a
# fifth of the graph's paths and it stands in for the 2-hop shapes
# nothing else times. An undirected end has two stored lists, and until
# P3 that was reason enough to leave the close on the binary probe: the
# optimizer would not mark it, so the close compiled to the semijoin the
# pipeline folds into the expand above it and every 2-path was walked.
# The mark now allows an undirected end when both sides live in one rel
# table, the intersection walks each stored list in turn against the
# unioned probe side, and the phase stops enumerating what it is about
# to throw away. Measured at c2638a7 with main and the branch
# interleaved on the same host in the same session: gamingpc 272 and
# 277 ms against 39 twice, local M series 418 and 466 against 49,
# server1 761 against 147 with its usual vCPU spread. That is 7x on
# gamingpc, 9x locally and 5x on server1, so the ceiling comes down
# 1200 to 400. server1 read 147 on one pass and 182 with a 218 max on
# the next, so the room over it is that spread and not slack, and the
# old plan measured 761 on the same box. Lower this ceiling, never
# raise it.
ldbc_close_p50_ms = 400.0

# The directed triangle again with `a.id < b.id < c.id` on it, the same
# 295 K triangles reached the way a user writes the query when they
# want each triangle once. The predicate binds at the second hop, so
# filter placement leaves it sitting between that hop and the close,
# where the close cannot fuse into the expand below it and goes back to
# a storage probe per candidate row. Lifting the predicate above the
# close is what this phase times, and its ceiling is set the same way
# as the close above it. Measured before and after the lift: local M
# series 452.948 to 34.195 ms, gamingpc 373.309 to 30.307, server1
# 1312.932 to 131.796. server1 then read 114 on the gate pass with a
# 255 max, which is the spread that sets the ceiling rather than the
# p50.
#
# The predicate itself then went to the pipeline. It names two levels,
# which the compiler used to decline, so the whole query fell back to
# the row at a time engine even though the plan above it was already
# right. Compiling it as a broadcast of the pinned lower end takes the
# query off that fallback, and the gather it needs is what turned the
# chunk cache on for batched property reads. Measured with main and
# the branch on the same host in the same session: gamingpc 29.645 to
# 11.838 ms, server1 94.902 to 42.352, local M series 33.249 to
# 22.288. server1 is the floor host and read 53.141 on the pass right
# after its build with a 65 max, so the ceiling comes down 400 to 150
# on that spread. Lower this ceiling, never raise it.
ldbc_ordered_triangle_p50_ms = 150.0

# Table function kernels on SF1 (docs/07 section 4, docs/12 M4), timed
# directly against the loaded knows CSR: pagerank is 20 power
# iterations at damping 0.85, wcc is union-find by minimum with path
# halving, sssp is an undirected BFS from row 0, louvain runs local
# moves plus aggregation until no level improves. Every measured run
# asserts against an independent reference computed from the raw edge
# list: pagerank within 1e-12 of a fresh power iteration, wcc and sssp
# exact, louvain checked for determinism across two runs. Measured on
# the local M series: pagerank 0.003 s, wcc 0.001 s, sssp 0.001 s,
# louvain 0.073 s; ceilings leave room for the EPYC vCPU hosts and
# their documented steal. Lower these ceilings, never raise them.
ldbc_pagerank_s = 0.05
ldbc_wcc_s = 0.02
ldbc_sssp_s = 0.02
ldbc_louvain_s = 0.5

# Graphalytics kernels on kgs (docs/12 M4), 832 K vertices and 17.9 M
# undirected edges loaded keyed, every output row validated against
# the reference vectors LDBC publishes with the dataset: pagerank at
# the published 10 iterations within 1e-9 relative, wcc and bfs exact,
# louvain deterministic across two runs since Graphalytics has no
# louvain reference. Measured on the local M series: pagerank 1.60 s,
# wcc 0.23 s, bfs 1.80 s, louvain 32.1 s; louvain's cost is the
# adjacency materialization plus level-0 local moves and is the known
# optimization target. Ceilings leave room for the EPYC vCPU hosts
# and their documented steal. Lower these ceilings, never raise them.
graphalytics_pagerank_s = 8.0
graphalytics_wcc_s = 2.0
graphalytics_bfs_s = 8.0
graphalytics_louvain_s = 120.0

# B7 exit budget straight from docs/12: a 10 GB file opens in under
# 10 ms, p99 over 1000 warm opens. Open reads 12 KiB of headers plus the
# free list chain and pages everything else lazily, so this catches any
# open path that starts scaling with file size. Gated on gamingpc, the
# host with the disk for the 10 GB build (ZU_B7=1). Lower this ceiling,
# never raise it.
open_p99_ms = 10.0

# P0 session gates (Spec/2064g/perf/07, zu#73), benches/session.rs on
# the synthetic 10k-node graph. plan_hit is Session::warm on cached
# text: epoch check plus cache lookup, the work between receiving a
# known query and starting execution. point is the full warm point
# read through the session: plan hit, bind, key lookup, one-hop count.
# When P0 landed the point read measured 2.0 us on the local M series
# and the one-shot open+plan+run path on the same file was 133 us, 65x
# it. Ceilings are the perf/07 targets and leave room for the EPYC vCPU
# hosts and their documented steal.
#
# The point read then went to 14 us and nobody noticed, because 20 was
# loose enough to hold it. Turning the pipeline executor on by default
# moved the read onto a snapshot the session built and threw away per
# query, so every point read reopened the table reader it needed and
# read its directory back out of the file, and on this graph that load
# was most of the query. server1 is the floor host and it was over the
# ceiling outright at 28.26 and 28.69 on two passes, a gate failing on
# main. Holding the readers for as long as the epoch they were read at
# is: local M series 14.50 to 2.67, gamingpc 13.98 to 3.50, server1
# 28.26 to 4.82.
#
# The ceiling comes down 20 to 10 on server1's spread, which read 4.64
# and 4.82 across two passes. It is deliberately not set near the
# measurement: the number this gate exists to catch is a read that
# stopped being warm, and that lands well past 10 on every host in the
# fleet. Lower these ceilings, never raise them.
session_plan_hit_us = 5.0
session_point_us = 10.0

