#
# The bench prints five shapes and each one twice, once through the
# pipeline over the whole batch and once with ZU_EXEC2=0 over eight
# keys, because the old engine has no plan for this at all: its index
# lookup only fires on a key that names no variable, so a key out of an
# UNWIND leaves it scanning the table once per element. Both sides are
# reported per key for that reason. Measured at 659927b, one worker, in
# us per key for the pipeline against the old engine: the read 0.11
# against 92924 on gamingpc and 0.39 against 281828 on server1; the hop
# 0.42 against 92698 and 1.54 against 269806; the counted hop 1.45
# against 92963 and 3.55 against 281854; the count per key 0.51 against
# 92758 and 2.35 against 286573; the two hop count 1.76 against 92085
# and 4.45 against 292312.
#
# The reference that says what this is worth is the last line the bench
# prints: the same page of ids read the way a client reads one today,
# one prepared point query per key, both sides on the pipeline. That is
# 44.79 us per key on gamingpc against the batch's 0.11 and 136.43 on
# server1 against 0.39, so 407x and 350x on the same work with the per
# query cost paid once instead of fifty thousand times.
#
# The floor is set off server1, the slowest host and the one that gates
# with no free page cache. This shape is the one that feels that box
# being shared: fifty thousand lookups landing all over the table are
# page cache reads, so when the neighbors take the memory the whole
# bench goes with it. Five runs there read 2.6, 2.5, 2.3, 1.8 and 0.3 M
# keys/s, the last one with a load average of 49 and 165 MB free, while
# gamingpc reads 8.7 twice in a row. The floor sits under the worst of
# those so it fails on the shape and not on a neighbor: a fallback to
# the old engine is 0.0000035 here and the group thrash this change
# fixed was 20x, both of which it still catches. Raise this floor,
# never lower it.
exec_batch_mkeys_s_core = 0.25

# Cardinality quality over the SF1 corpus, q-error percentiles
# (perf/12 section 4). Twelve queries run profiled, every operator that
# carries an estimate contributes one max(est/act, act/est), and the
# pool is 29 operators. Unlike everything else in this file these are
# not timings: they fall out of the data and the estimator alone, so
# they read the same on every host and any move in them is a change in
# the optimizer. gamingpc and server1 both report p50 1.00, p90 2.10,
# p99 2.34, max 23.76.
#
# perf/12 section 6 wants 2, 10, and 100, and all three are met. p90 and
# p99 sat at 16.37 until the point seeded hop stopped guessing: three of
# the twelve queries name their seed with a parameter, the seed SF1
# hands them holds 335 knows edges against a mean of 16.8, and no plan
# time estimate can know that because the plan is cached across
# parameter values. The run has the value, so the step off a pinned seed
# now reads that seed's degree off the offsets and reports it, which
# took those three operators from 16.4 to 1.0 and p90 from 16.37 to
# 2.10. Before that, property predicates were the whole of the miss:
# the per column statistics of perf/12 section 1 took p90 from 74.30 and
# p99 from 114.39, and the degree sequence norms of the same section
# took p50 from 1.17 and the worst operator from 45.89.
#
# What is left is the triangle close at 23.8, which the intersection
# still treats as independent of the two hops that reached its
# endpoints. The ceilings below sit close to the measurements because
# these numbers do not move with the host: any move at all is the
# estimator changing. Lower these ceilings, never raise them.
card_qerror_p50 = 1.2
card_qerror_p90 = 3.0
card_qerror_p99 = 3.0
card_qerror_max = 26.0

# Cardinality quality over graphs the bench generates itself (perf/12
# sections 4 and 6). SF1 is one graph with one degree distribution and
# it is not in CI, so this gate varies the data instead of the queries:
# a uniform graph where every node holds eight out-edges, a hub graph
# where sixteen nodes hold half the edges, and a funnel where twenty
# thousand nodes point at two hundred targets. Eleven queries run over
# each, 75 operators in the pool. Deterministic like the SF1 numbers
# above and for the same reason, so these read the same on every host.
#
# Measured p50 1.00, p90 1.02, max 447.43 on the Mac, gamingpc and
# server1 alike. The max used to be the hub seeded hop at 611.29: that
# shape gives node 3 2372 knows edges against a mean under four, and no
# plan time estimate can know which node a parameter names. Reading the
# pinned seed's own degree at run time took it to 1.0 and took the hub
# p90 from 1.68 to 1.02. What is left on top is the hub triangle at
# 447, the independence assumption on the closing edge, and that one
# does want a better estimate rather than a better reader.
#
# There is no ceiling here anywhere near as tight as the SF1 ones above
# because these shapes are built to be hostile on purpose, so the number
# to watch is whether the max moves, not how large it is. Lower these
# ceilings, never raise them.
#
# There is no budget line for bound violations on purpose. A ceiling is
# a promise the join order DP is built on, so the bench fails on the
# first one whether the run is gated or not, and no number of wrong
# ceilings is worth writing down here as acceptable.
card_gen_qerror_p90 = 1.2
card_gen_qerror_max = 500.0

# The table function port (perf/07 section 5, zu#76). A leading CALL
# yields one row per node and the pipeline now runs that whole shape
# instead of handing it to the old engine. The bench builds a million
# people in a thousand blocks, two friends each inside the block, so wcc
# labels a thousand components and a group by on the yielded label has a
# thousand real groups. Five shapes run: count the yield, sum it, group
# by it, hop off every yielded node, and hop with the yielded value in
# the WHERE. Every run is crosschecked against a union-find over the
# same edge list, so a pipeline that loses rows fails before it prints.
#
# One worker, so these are per core. gamingpc reads the count at 169.6
# M rows/s against the old engine's 73.3 ms, the sum at 109.0 against
# 89.4, the group by at 93.0 against 156.1, the hop at 140.8 against
# 58.7 and the filtered hop at 140.6 against 89.4, which is 12.4x, 9.7x,
# 14.5x, 8.3x and 12.6x. server1 reads 51.9, 33.0, 26.2, 35.1 and 36.2
# M rows/s for 12.8x, 11.6x, 13.4x, 7.8x and 10.3x on the same shapes.
# The wcc kernel itself is 5.6 ms on gamingpc and 17.2 on server1, and
# both engines pay it, so the ratios above are what the rows cost with
# the algorithm left in.
#
# The floor is the count case end to end in millions of rows a second,
# so it carries the kernel both engines run. That is on purpose: the
# whole query finishes in less time than a standalone wcc reads, 5.9 ms
# against 5.6 on gamingpc, so a floor on the pipeline's own share would
# be a floor on timing noise. The kernel does not hide a regression
# either, because a fallback to the old engine reads 4.1 M rows/s on
# server1 and the floor sits three times above that. It also sits under
# the worst the shared box has printed, 41.0 M rows/s at a load average
# of 16, so it fails on the shape and not on a neighbor. Raise this
# floor, never lower it.
exec_call_mrows_s_core = 12.0

# Factorized aggregation over a hop (perf/13 section 1, zu#76). An
# aggregate that reads nothing off the expanded level does not need the
# expanded rows, only how many of them there were, so the hop becomes a
# weight: a degree read over offsets alone, the neighbor array never
# touched, one group probe per source row instead of one per neighbor.
# The bench is a million people over a thousand cities with out degrees
# zero to seven, 3.5M edges and 17.5M two hop rows, and every case is
# crosschecked against the edge list per group and in total, so a weight
# that lands on the wrong key fails before it prints.
#
# One worker, so these are per core, and the rate counts the hop rows
# the walk would have produced. gamingpc reads the counted key at 502.5
# M hop rows/s against the old engine's 152.0 ms, the summed key at
# 341.0 against 195.8, the bare sum at 602.1 against 110.5 and the two
# hop at 240.3 against 2318.2, which is 21.8x, 19.1x, 19.0x and 31.8x.
# server1 at a load average of 14 reads 147.2, 70.0, 205.7 and 48.8 M
# hop rows/s for 30.8x, 12.4x, 20.8x and 23.6x.
#
# The two hop is the case the sorted degree read is for. Its neighbors
# arrive in the order their source rows did, and a degree read that
# walks into a new storage group every row reads two offsets out of the
# file for each of them, which was 4.8s of the 4.9s the case took before
# the order went in.
#
# The floor is the counted key, the shape whose whole per row cost is a
# hash and an increment. It sits three times under the worst the shared
# box has printed and eight times over what the same query reads when it
# falls back to the old engine, 4.8 M hop rows/s on server1, so it fails
# on the fusion going away rather than on a noisy neighbor. Raise this
# floor, never lower it.
exec_factor_mrows_s_core = 40.0

# The second pattern branch and the hub weight (perf/05 section 2,
# zu#76). Two patterns off one variable with both far ends read is a
# cross product per source row: the shared end is pinned, its list is
# read once, and every row of the newest level pairs with the whole of
# it. When one of the two ends is read by nothing the walk on that side
# is not a walk at all, it is a degree, and the rows the other side
# keeps carry it as a weight.
#
# Same graph as the factor bench, a million people over a thousand
# cities with out degrees zero to seven, and the same crosscheck: every
# case is checked against the edge list on every run, rows and total, so
# a pairing that drops or repeats fails before it prints. The rate
# counts the pairs the cross product has to walk.
#
# One worker, so these are per core. gamingpc reads the grouped branch
# at 179.8 M pairs/s against the old engine's 579.8 ms, both ends
# grouped at 25.1 against 3018.6, the paired predicate at 30.7 against
# 1760.6 and the two hop branch at 26.5 against 11785.7, which is 6.0x,
# 4.3x, 3.1x and 173.3x. server1 at a load average of 40 reads 20.5,
# 6.3, 8.1 and 7.6 M pairs/s for 5.8x, 4.9x, 2.8x and 401.0x. The shared
# box was between 24 and 80 loaded across those runs and printed 5.4 M
# pairs/s for the paired predicate on the run before, which is what the
# floors are set under.
#
# Two floors, because the two halves fail differently. The hub weight
# floor is the one that catches a fallback: the same grouped query reads
# 3.5 M pairs/s when it goes back to the old engine on server1, and the
# floor sits three times over that. The branch floor catches a collapse
# rather than a fallback, since the old engine is only 2.4x behind it on
# the shared box, and it sits under the worst that box has printed.
# Raise these floors, never lower them.
exec_branch_mpairs_s_core = 3.0
exec_hub_mpairs_s_core = 10.0

# The value join (perf/05 section 3, zu#76). Two patterns that share no
# variable, tied by an equality on a property. The old engine picks one
# to drive and scans the whole of the other for every row of it, so the
# shape is rows times rows. The pipeline reads one integer column of the
# held side into a hash table once and probes it a row at a time, which
# is a pass over each side plus the rows that match.
#
# The build is paid on every execution, since nothing caches a compiled
# plan yet, so it is inside every number here. That is what a caller
# pays today and the floor is set over it rather than over a warm table
# nobody has.
#
# A million people over a thousand cities, four shapes plus a miss case,
# every one crosschecked against the generators on every run, rows and
# total, so a join that drops rows, repeats them or lands them on the
# wrong key fails before it prints. The rate counts probe rows, the rows
# of the driving side.
#
# One worker, so these are per core. gamingpc reads the unique key at
# 9.85 M probes/s, a key with a thousand rows under it at 15.6 us a
# probe, an all miss probe at 30.7 M/s, the grouped join at 4.93 M/s and
# a hop off the joined level at 1.41 M/s. server1 at a load average of
# 35 reads 1.19, 45.8 us, 7.85, 0.71 and 0.31.
#
# There is no ratio against the old engine at this size because it does
# not finish: it is 72 ms a probe row on gamingpc and 207 ms on server1,
# which is twenty hours and two and a half days for the million the
# pipeline does in a tenth of a second. So the bench times the old
# engine over two hundred probe rows and reports per probe, and the
# unique key case comes out 714371x ahead per probe on gamingpc and
# 246985x on server1.
#
# One floor, on the unique key case, since that is the one where the
# table is at its widest and the build is the largest share of the time.
# It sits under the worst the shared box has printed. Raise it, never
# lower it.
exec_join_mprobes_s_core = 0.8

# The semi join at one worker, M probe rows/s (docs/07): the same
# million people over a thousand cities, asked whether anyone shares
# their city rather than for the rows. A thousand rows sit under every
# key and the answer needs one of them, which is the whole reason this
# case is here and has its own floor. Nothing else in the bench reads a
# key's run partly, so nothing else would notice if the early stop
# stopped working and the semi went back to walking a thousand rows to
# answer a question the first one answers.
#
# Measured at b0df8c9, one worker: 76.3 ms on gamingpc and 361.4 on
# server1 at a load average of 10, against 460.7 and 1372.7 us a probe
# for the old engine over two hundred probe rows, so 6037x and 3798x per
# probe. Before the run was cut into doubling parts the same case read
# 530.3 ms locally, slower than the left join it is the cheaper version
# of, and it is 85.4 there now.
#
# The floor is set off server1, the slowest host and the one that gates
# under other tenants' load, at about two thirds of its worse run. Raise
# this floor, never lower it.
exec_semi_mprobes_s_core = 1.8

# G0 refusal gates (Spec/2064g/gql/plan/08 section 1.2, zu#115),
# benches/refuse.rs on the same synthetic 10k-node graph the session
# gates use. The milestone asks for one thing: refusing a statement has
# to cost less than answering one. It is worth gating because a
# conformance corpus is mostly statements this engine cannot run, 156
# of 377 in the run of 2026-08-12 ended in a refusal, and because a
# refusal that costs more than an answer hands anyone sending nonsense
# a cheaper way to spend a core than a client sending work.
#
# refuse_over_answer is the slowest gated refusal p50 over the warm
# point read p50 measured in the same run, so it compares two paths on
# one machine and does not move with the host. Three refusals are timed,
# one per stage a statement can die at: syntax in the parser, an
# undefined reference after the parse, and a missing parameter at bind
# time on a plan that is already cached and correct. Measured on an
# idle local M series against a 3.67 us answer: syntax 0.75 (0.21x),
# undefined reference 0.75 (0.21x), missing parameter 0.75 (0.21x).
# All three sit together because after #655 none of them parses: the
# first send of a text decides what it is and the cache answers for
# every send after it, so what is left is a lookup and the refusal.
# Before that they read 1.54, 2.12 and 2.54 against a 5.50 us answer.
# The GitHub runner the gate job uses is about twice as slow on both
# sides and lands on the same ratios: answer 6.22, syntax 0.97 (0.16x),
# undefined reference 0.98 (0.16x), missing parameter 1.09 (0.18x).
# Before #655 the same runner read answer 12.81, syntax 3.27 (0.25x),
# undefined reference 4.57 (0.36x) and missing parameter 5.58 (0.44x),
# so it took the whole 2x there too. That the two machines agree to
# within a few hundredths on the ratio while disagreeing by 1.7x on the
# latencies is the reason the gate is written this way.
# The milestone only asks for a ratio under 1.0; the ceiling sits at
# 0.6 because 0.33 is what the engine actually does and a refusal that
# drifted up to two thirds of an answer would be worth looking at.
#
# refuse_p50_us is the absolute backstop on the same worst refusal, so
# a run where both paths got slower together still fails. It sits at
# twice what the machine it was written on reads rather than near it,
# because the number it exists to catch is a refusal that started doing
# real work, and that lands far past 4. Lower these ceilings, never
# raise them.
#
# The backstop is a number of microseconds, which is a statement about
# a machine, and the gate job runs on whatever the provider hands it. A
# runner slower than the reference machine reads the undefined
# reference refusal at 3.40, 3.94, 4.01 and 4.04 us on four consecutive
# runs of the same code, which is a coin flip against a ceiling of 4
# and cost main a red run on 2026-08-14 with nothing wrong with it.
#
# The bench used to answer that by measuring the host with a loop that
# touched nothing in zu and reading the backstop at what the loop said.
# That does not work and #648 is why. Four proxies were tried here and
# in benches/write.rs and none of them tracks: a pointer chase reads
# 0.99x on a runner because its memory is as fast as the reference
# machine's and its core is not, the string and map loop that replaced
# the chase read 1.15x on one runner and 1.61x on the next while both
# ran zu at about 2x, and timing the store build reads under one
# because it is a filesystem measurement and Linux takes an unsynced
# write more cheaply than Darwin does.
#
# The one thing that tracks a query engine is the query engine, and
# here that is the answer path this bench already times. It cannot
# scale the backstop, though: the ratio gate above divides by the same
# number, so a backstop scaled by it is refuse_over_answer with a
# looser constant and catches nothing the ratio does not. So the
# backstop is held on a host that reads within a quarter of the
# reference and reported and not held anywhere else, which is honest
# about what a shared vCPU can say about a 4 us target. The reference
# is 3.67 us, three idle runs of the local M series reading 3.71, 3.62
# and 3.67; it lives in the bench and not here because it is a property
# of one machine rather than a budget. refuse_over_answer is a ratio
# between two paths timed in one run, holds on every host, and needs no
# help from any of this.
refuse_over_answer = 0.6
refuse_p50_us = 4.0

# Tail latency of a served read (perf/05, zu#76), benches/tail.rs: the
# p99 of a point seeded one hop over the p50 of the same stream, on a
# graph with no skew and on one with a lot of it. Half a million people
# and eight million edges either way, two thousand requests per shape,
# seeds spread evenly over people because that is how requests arrive.
#
# The ratio is gated rather than the latency because it is the number a
# caller can put a timeout on, and because it holds still across hosts
# that differ by more than 2x on the latencies themselves. The uniform
# graph gets 5x since every seed has the same sixteen friends and any
# spread left is the engine. The power law graph gets 10x because a seed
# stream over that data really does hand some requests a hundred
# thousand times the work of the median one, and answering those in
# order is the job, not a defect to gate away.
#
# Writing this bench found one. Before it, a point seeded expand pinned
# the whole CSR group to read one seed's list, which decodes two million
# edges to hand back sixteen, and on a working set past the adjacency
# pool it re-decodes them on every request. The uniform stream read p50
# 1902.0 us and p99 4354.8 (2.29x), the power law one p50 837.6 and p99
# 15113.2 (18.04x). Reading only the chunks the list covers, which the
# snapshot now picks between per group by chunk count, put the same
# streams at p50 5.9 p99 7.1 (1.21x) and p50 6.1 p99 11.4 (1.88x) on the
# local M series, and the counts, which never touch a neighbor, at 1.19x
# on both. So the ceilings sit at roughly 4x and 5x what the engine
# reads, which leaves room for a slower box without leaving room for
# that defect to come back.
tail_p99_p50_uniform_x = 5.0
tail_p99_p50_power_x = 10.0

# The same two graphs read a page of ids at a time, eight to a request,
# which is what a service sends when it has a list of people in hand
# rather than one. Same ceilings as the single seed streams above, and
# they sit further off the engine than those do: a batch of eight
# averages eight seeds together, so the spread across requests is
# narrower by construction, and the local M series reads 1.14x with no
# skew and 2.23x with it.
#
# What these gate is the batch being cut into work rather than into
# equal counts of keys. Split by position, one worker draws the
# celebrity and runs the whole request alone while the rest sit idle,
# and the requests holding one are the p99. The power law ceiling is the
# looser of the two because a batch of eight really can hold a seed
# worth a hundred thousand edges, and answering that is the job.
tail_p99_p50_uniform_batch_x = 5.0
tail_p99_p50_power_batch_x = 10.0

# One shell frame through the JSON reader, ns (benches/json.rs in
# zu-json). This is the transport in front of every statement a client
# sends over the pipe, so it is gated against the warm point read it
# precedes: session_point_us above is 10 us, and a frame that took a
# meaningful fraction of that would mean the wire costs more than the
# database. The frame is an execute with six bound parameters, 119
# bytes, which is what `zu shell` actually reads.
#
# Writing this bench found a defect. The reader copied string contents
# one scalar at a time and validated UTF-8 by calling from_utf8 on the
# entire remaining input per character, which is linear per character
# and quadratic per document. A frame is short enough to hide it at 701
# ns; a 523 KiB rustdoc document read at 1.24 MB/s against a writer
# doing 506. Copying each unescaped run whole put the frame at 381 ns
# and the document at 434 MB/s, flat from 32 KiB to 523 KiB. The bench
# now measures three document sizes and fails if the rate halves
# between them, because that is the shape of the defect and a single
# measurement cannot see it.
#
# Measured on the local M series at 381 ns. The ceiling is not set near
# that: what it exists to catch is a reader that went quadratic again,
# and that lands orders of magnitude past 2000 on any host. Lower this
# ceiling, never raise it.
json_frame_parse_ns = 2000.0

# Edge property reads, as a multiple of the same walk reading a column
# off the node the edge lands on (benches/relprops.rs). The graph is two
# hundred thousand people and two million knows edges with one int
# column on the edge and one on the person. The gated shape sums the
# edge column over every edge and the shape it is measured against sums
# the person column over the same walk, so the two differ in one thing:
# a node's row is the offset already in hand and an edge's has to be
# found.
#
# A property row is addressed by the edge's ordinal, its place in the
# load order, and an edge that did not arrive from a forward walk has to
# have that ordinal found. Writing this bench found what that cost. The
# lookup took the point path, which decodes one chunk of the offset
# array and one chunk of the neighbor array per call, so a scan reading
# a property off every edge decoded two chunks per edge: 4498.4 ms
# against 54.3 ms for the node column, 82.8x, 0.44 M reads/s. Reading
# the ordinal out of the group cache the neighbor lists already keep,
# which is a binary search over a slice when the group is warm, put it
# at 341.4 ms, 8.5x, 5.86 M/s on the local M series. The point shape,
# one node's ten links, did not move: it pays for the group either way,
# once.
#
# Like the gates above this is a ratio between numbers timed in one run
# on one machine, so a shared runner cannot move it. What is left in the
# ratio is the ordinal lookup itself, which a forward expand could count
# out as it walks and hand to the read; until it does, the ceiling sits
# where a slower box has room and the per call decode, an order of
# magnitude past it, does not. Lower this ceiling, never raise it.
rel_prop_over_walk_x = 20.0

# Taking a connection off an open database, us, p50 (benches/connect.rs).
# The whole Database/Connection split of dx/04 §2 rests on this being
# cheap: a connection that cost what a database costs is a connection
# every binding would pool around, and the pool would then be the thing
# with the bugs. What it buys is a private file handle, private caches,
# and a private plan cache, so two threads reading one graph never share
# a seek position.
#
# Measured on the local M series at 57 to 72 us over 2000 connections
# against the 10k node synthetic graph, of which the validating open is
# about 27 and the catalog and schema load is the rest. The ceiling is
# set for the slowest gate machine with the usual vCPU headroom, and the
# number it exists to catch is a connection that started copying
# something per connect rather than reading a header. Lower this
# ceiling, never raise it.
connect_us = 400.0

# The warm point read through Connection over the same read through
# Session, both timed in one run against the same file with the same
# seed and one thread, so a shared runner cannot move the ratio. This is
# the dx/04 §9 obligation as a number: the public API is a delegation
# and a read-only check, and it has to stay one. Measured 0.987 to 1.021
# on three passes, which is the noise floor of two 10000-read medians.
#
# The ceiling has room for a slow box and none for the defect it is
# here for: a wrapper that copies the result, or re-reads the header, or
# rebinds the parameters on the way through, lands at 2x and up.
api_overhead_x = 1.25

# The per row cost of the appender's buffering path, ns
# (benches/append.rs). This is the loop a bulk load is in, so every cost
# in it is paid per row: the row is read out of its tuple straight into
# the column buffers, with no vector of values in between and no
# allocation on an integer column at all.
#
# Measured 26 to 42 ns per row over 200000 rows on the local M series,
# for a two column table where one column is a string and so costs a
# copy; the spread across that range is what else the machine was
# running. The ceiling is set for a slow box, and the defect it is
# here for is an allocation or a name lookup creeping into the row path,
# which lands an order of magnitude above this and nowhere near the
# ceiling from below. Lower this ceiling, never raise it.
append_row_ns = 250.0

# What batching buys: the same rows loaded with one flush over the same
# rows loaded with a flush each, both timed in one run against files
# built the same way, so a shared runner cannot move the ratio. It is
# the appender's whole reason to exist as a number, and a regression
# here means a flush stopped being a batch: an appender that committed
# per row, or one whose flush did work proportional to what it had
# already written, would walk this toward 1.
#
# Measured 0.0007 to 0.0011 on the local M series, which is 2000 rows
# in 73 ms against 67 s of committing them one at a time, and the ratio
# holds across runs because both halves move together. The ceiling
# leaves two orders of magnitude of room and still fails long before
# batching stops paying. Lower this ceiling, never raise it.
append_batch_x = 0.05

# The C ABI's chunked column reads against its whole-column ones
# (crates/zu-capi/benches/result.rs). Two numbers, both ratios, so a
# shared runner or a slow box moves neither: each pair is timed in one
# run over the same column.
#
# scan reads a 500000 row int column both ways and sums it. The chunked
# loop does the same conversions plus a call and a bounds check per
# 2048 rows, so the honest expectation is a small tax; measured 0.53 to
# 0.74 on the local M series and 0.92 on the ubuntu runner, under 1
# everywhere because a 16 KiB buffer summed while it is still warm
# beats streaming 3.9 MB out of memory, and closer to 1 on the runner
# because its memory is quicker to reach relative to its cores. The
# ceiling is set well above all of that, because what it exists to
# catch is a per-chunk allocation or a rebuild of the whole column per
# chunk, either of which lands far above 1 rather than just over it.
# Lower this ceiling, never raise it.
capi_chunk_scan_ratio = 1.5

# early reads the first chunk and stops, which is the host that streams
# into its own arrays or the user who pressed a key. The whole-column
# call converts all 500000 rows before returning any, so the conversion
# alone is the result's 244 chunks of work against one; measured 179 to
# 337 on the local M series and 154 on the ubuntu runner, running above
# 244 when the 3.9 MB the whole-column path allocates has to be faulted
# in as well and below it when that memory was already warm. The floor
# is set under the slowest of those, with room for a noisy vCPU, and
# still fails immediately if a chunked read ever converts more than its
# chunk. Raise this floor, never lower it.
capi_chunk_early_speedup = 50.0

# lent is the accessor call on its own, on a result the executor filled
# its columns for against one it built row by row. The first hands back
# the buffer the executor already wrote, so it is a bounds check and a
# pointer and nothing that grows with the result; the second walks all
# 500000 rows and copies every cell, which is what this path did for
# every plan before there was anything to lend. The sum is outside both
# measurements, because the question is what asking for a column costs
# and not what reading one does.
#
# Measured 5800 on the local M series, and the number is that large
# because the two sides are not the same kind of work: one is constant
# and the other is linear in the rows. The floor is two orders of
# magnitude under it, which leaves room for a slow box and a noisy vCPU
# and still fails the moment a copy creeps back into the filled path,
# because a copy would put the two sides within a small factor of each
# other rather than thousands. Raise this floor, never lower it.
capi_lent_col_speedup = 100.0

# cell reads the same column one value at a time through the cell
# reader, which is the path a temporal, a list and a node's table take
# because no column holds them. The ratio is against the whole-column
# read of the same 500000 ints, so it is what a binding would pay for
# taking the per-value path on a column that has a bulk one.
#
# Measured 0.5 on the local M series, which is under 1 rather than over
# it: a cell is a borrow of the row the result already holds, so the
# per-value path allocates nothing at all while the whole-column path
# builds and keeps a 3.9 MB buffer. That is the property this number
# guards. A cell that copied its value, as the NUL-terminated string
# accessor beside it has to, would be an allocation per row and would
# land far above this ceiling rather than just over it. Lower this
# ceiling, never raise it.
capi_cell_scan_ratio = 4.0

# What the C loader costs over the Rust bulk load path it forwards to,
# building one table of 200000 rows and four columns both ways
# (crates/zu-capi/benches/loader.rs). Both paths make the same engine
# calls, so the ratio is the boundary and nothing else: a copy per
# column, a UTF-8 check per string, and a call per column.
#
# The copy is what this guards. The loader owns the arrays it is handed,
# because a borrow would be a lifetime rule the header could not state
# safely and a host that broke it would get a corrupt database rather
# than an error, so the question is whether that honesty is affordable.
# Measured between 0.92 and 1.22 across runs on the local M series,
# which is to say it is free and the spread is the filesystem rather
# than either path: the copy is a memcpy against a load that writes
# every one of those bytes to disk, and a run where the C path came out
# faster than the Rust one is a run where the disk was in a better mood.
# The ceiling is above the spread so that a slower machine or a busy
# runner does not fail the gate on noise, and far below what a per-row
# allocation or a second pass over the data would cost. Lower this
# ceiling, never raise it.
capi_load_ratio = 2.0

# What a `zu` invocation costs before it does anything, milliseconds per
# run, measured end to end on `zu version`
# (crates/zu-cli/benches/cli.rs). It is mostly fork, exec and the
# dynamic loader, so it moves with the machine and with the size of the
# binary that T7 caps at 15 MiB, and only a little with what the command
# does. Measured: local M series 4.5, with `zu --help` and `zu --help
# --format json` inside a millisecond of it because generated help is a
# print and not a build.
#
# The ceiling sits far above that on purpose. A CLI's startup regresses
# in kind and not by percent: a config file read at launch, a thread
# pool, a runtime, a lazy table that turned out to be eager, each of
# which lands in the hundreds of milliseconds and none of which is
# hiding in the noise of a shared runner. A tighter number here would
# fail on a busy vCPU and teach everyone to ignore it. The bench also
# asserts, on every run and on every machine, that no help form costs
# twice the floor, which is the sensitive half of the check.
# Lower this ceiling, never raise it.
cli_startup_ms = 25.0

# What one keystroke costs in the interactive shell, microseconds,
# measured over the whole path a key travels
# (crates/zu-cli/benches/editor.rs): the bytes are decoded, the editor
# applies the key, and the escape sequence that shows the result is
# built. The write is not in it, because that is the terminal's time and
# the link's. Measured: local M series 0.21 to 0.46 on a one-line
# statement and 0.47 to 1.03 on a six-line one, since every key rebuilds
# the whole buffer, the spread being what else the machine was doing.
# Painting the six-line statement is the dear one at 2.17, since colour
# rescans the buffer and writes escapes into it, and a tab against a
# hundred labels and a hundred tables is 2.85. Both are the price of a
# key that does something more than echo, and both are still forty times
# under the ceiling.
#
# The ceiling is 50, which is more than an order above the measurement
# and still two orders below the millisecond where typing starts to feel
# like it is being answered rather than echoed. A redraw that allocated
# per character, or a completeness scan that reparsed the statement,
# would land well above it on the long line and stay under it on the
# short one, which is why the gate takes the worst of the three.
# Lower this ceiling, never raise it.
cli_keystroke_us = 50.0

# SHA-256 throughput in MiB/s at 16 MiB, single core, from the hasher
# the release writes its digest list with and both install scripts check
# against. Measured: local M series 231, and flat from 64 KiB up, which
# is what says the cost per block does not grow with the input.
#
# The floor is a third of that, because this is a scalar implementation
# on purpose (a build tool that pulls a crate to hash ten files has
# added a supply chain to the thing whose job is to be the trusted end
# of one) and a shared vCPU runs it at half the speed of a laptop. What
# it catches is the order of magnitude: a rewrite that allocates per
# block, or a copy of the input per call, lands at 20 MiB/s and turns a
# release into a minute of hashing and an install into a pause on the
# step meant to reassure. The bench also asserts on every machine that
# 16 MiB runs within a factor of two of 64 KiB, which is the shape half
# of the check. Raise this floor, never lower it.
sha256_mibs = 80.0

# What one write statement costs, in each of the resources it spends
# (crates/zu/benches/write.rs). A `SET` of one property of one element
# and an `INSERT` of one element, each its own statement and so each its
# own commit, run against a two column table of 10000 rows.
#
# These two are wall clock, and wall clock here is the disk: one
# statement is one commit is one fdatasync, and on a box whose syncs
# are several times slower than this one the whole column moves with
# them. So the ceilings are loose on purpose. What they exist to catch
# is a regression that adds another sync or another column rewrite,
# which lands multiples above rather than just over; the processor and
# bytes columns below are where a write path getting more expensive
# shows up.
#
# The write path used to fold after every commit that changed
# something, because a reader read the sealed file and nothing else, so
# a change that was not folded was a change the next MATCH could not
# see. That cost four fdatasyncs a statement rather than the one a
# commit needs (the WAL commit frame, two inside the header flip, and
# the WAL truncate) and rewrote every column of the table the statement
# touched: 39 to 50 ms and 1556 kB per SET at 10000 rows, 45 to 54 ms
# and 2836 kB per INSERT. Both shapes now hand the readers a patch and
# fold nothing, and the same run is 4.7 ms and 16.1 kB for either.
# Lower these ceilings, never raise them.
set_stmt_us = 250000.0
insert_stmt_us = 250000.0
# Bytes written per SET, which is now the log frame and the header and
# not a column rewrite: 9.4 kB when the ceiling was written, against
# 55.4 kB when every statement folded. The ceiling is above the first
# and well below the second, so a commit that goes back to sealing
# itself fails here.
#
# It reads 16 kB on the local M series and 64 kB on the Linux gate box,
# for the same statement. The counters are not the same counter: macOS
# reports the bytes the process handed the disk and Linux charges it by
# the page, so a commit that dirties the log page, the header page and
# the pages behind them lands four times higher there for writing the
# same thing. The 32 held until the log started taking its room ahead
# of the commits that go in it, which turned an append that grew the
# file into a write into a page the file already had, and on Linux that
# is charged in full every commit. The ceiling moves to cover the
# loudest counter of the two rather than passing on one box and failing
# on the other, and it comes back down when commits stop syncing one at
# a time.
set_stmt_kb = 96.0

# The processor time of the same two statements, user and system
# together, per statement. The wall clock above is mostly the storage:
# one statement is one commit is one fdatasync, 3.9 ms of it on this
# box, and waiting on a sync is not burning processor time. So the two
# columns move for different reasons and the latency one cannot see a
# write path that got twice as expensive.
#
# Measured 134 us per SET and 131 us per INSERT at 10000 rows. The SET
# is the one that reads a table and changes one cell of it, which is
# the shape the read half of a write statement is measured by; the
# INSERT has no table to read and is nearly all write path. What these
# ceilings are here to catch is the read half falling back to the row
# at a time engine, and they also catch a commit going back to folding
# per statement, which was 475 us for the SET at 10000 rows and 767 us
# at 100000.
#
# The INSERT ceiling was 30000 while a row added still folded, which
# cost 1513 us of processor time at 10000 rows against 131 us now that
# the rows ride to the readers on a patch. It comes down to the SET's,
# because the two now do the same amount of work: one log frame and
# nothing else. Lower these ceilings, never raise them.
set_stmt_cpu_us = 400.0
insert_stmt_cpu_us = 400.0

# Bytes written and file growth per INSERT of one node, measured 16.1
# kB and no growth at all at 10000 rows, against 293.8 kB and 14418
# bytes a statement while the row still folded. A row added past the
# end of a column has nothing under it to be laid over, so the patch
# carries it whole and the readers serve it from there; nothing is
# rewritten and the file does not grow. The kB ceiling is the SET's,
# because it is the same one log frame, and the growth ceiling is a
# page, loose enough for the log to extend the file and tight enough to
# catch a fold coming back. Lower these ceilings, never raise them.
insert_stmt_kb = 96.0
insert_stmt_growth_b = 4096.0

# The same SET with the sync's own processor cost taken off, one sync a
# statement, which is what one statement commits. A sync is not only a
# wait: on a Mac it is fcntl with F_FULLFSYNC and it burns 20 to 83 us
# of processor time before the disk is asked, measured by the bench on
# the machine it runs on, which is most of the ceiling above and none of
# the write path.
#
# This is no longer the column P5 is written against; write_cpu_nosync_us
# at the end of this file is. Taking one calibrated sync off a statement
# that pays more than one, and off a store far bigger than the scratch
# file the calibration used, leaves something that read 53, 122 and 201
# us across three runs of one commit. It is kept as the loose thing it
# is: a statement that starts burning milliseconds shows up here whatever
# the sync is doing.
#
# Measured 165 to 205 us over four runs at 10000 rows, against a raw cpu
# of 242 to 280 us for the same statements. Lower it as the write path
# gets cheaper, never raise it.
set_stmt_cpu_nosync_us = 300.0

# A DELETE at the same shape, measured 3.7 ms, 76 us of processor time,
# 16.0 kB written and no growth at all at 10000 rows. It is the cheapest
# of the three because a delete moves nothing: the row keeps its offset,
# so all the commit has to hand a reader is the offset, and the readers
# merge that list over the table's tombstone chain the way a cell patch
# goes over a column. Nothing folds, so nothing is rewritten and the
# file does not grow.
#
# Before the commit was deferred this was 321 us with the sync taken
# out against 78 us for the SET in the same run, and it is now 42 us
# against 33 us, so about three times less processor time once the
# machine is normalised away, with 41.6 kB down to 16.0 and 6554 bytes
# of growth a statement down to none. The bytes are the part that does
# not move between machines, and they are what the fold cost. The kB
# ceiling is the SET's, because it is now the same one log frame, and
# the growth ceiling is a page, which is loose enough for the log to
# extend the file and tight enough to catch a fold coming back. Lower
# these ceilings, never raise them.
delete_stmt_us = 250000.0
delete_stmt_kb = 96.0
delete_stmt_cpu_us = 400.0
delete_stmt_growth_b = 4096.0

# A DETACH DELETE of an element that still has edges on it, measured 3.6
# ms, 84 us of processor time, 16.1 kB written and no growth at all at
# 10000 rows and 10000 edges. It now costs what a DELETE does, because
# it no longer folds: an edge has no offset a reader could filter it out
# by, so what a reader is handed instead is the pair it runs between,
# and the pair is the whole name of the edge, so the adjacency reader
# drops it out of the two lists it is in as it reads them. The CSR is
# not rebuilt and the columns underneath it do not move.
#
# Before the commit was deferred this was 6309 us with 1348 us of
# processor time, 208.0 kB written and 13107 bytes of growth a
# statement, and it is now 84 us, 16.1 kB and no growth, so about
# sixteen times less processor time and thirteen times fewer bytes. The
# bytes and the growth are the part that does not move between machines
# and they are what the CSR rebuild cost. The kB ceiling is the DELETE's
# because it is now the same one log frame, and the growth ceiling is a
# page, loose enough for the log to extend the file and tight enough to
# catch a fold coming back. Lower these ceilings, never raise them.
detach_stmt_us = 250000.0
detach_stmt_kb = 96.0
detach_stmt_cpu_us = 400.0
detach_stmt_growth_b = 4096.0

# A MERGE over two rows, one the walk finds and one it does not,
# measured 4.2 ms, 650 us of processor time, 16.1 kB written and no
# growth at all at 10000 rows.
#
# This is the one statement shape that writes twice, because the row the
# walk missed is an insert and the row it found is a SET. Until they
# shared a transaction it cost 11.5 ms, 61.0 kB written and 10486 bytes
# of growth a statement, so about three times the clock and four times
# the bytes. The bytes are where the mechanism shows: two commits a
# statement fill the log twice as fast, the log tripping its threshold
# is what makes a fold checkpoint, and a checkpoint syncs the base file
# and cuts the log. One commit a statement leaves the growth at nothing,
# the same as every other write here.
#
# The processor ceiling is the loose one of the set, because most of
# what it covers is the walk and not the write: the pattern is
# correlated with the row the UNWIND handed it, so the walk runs per row
# rather than once, and that read is an order of magnitude more than the
# commit underneath it. The kB and growth ceilings are the ones every
# other write on this list carries, and they are the two that do not
# move between machines. Lower these ceilings, never raise them.
merge_stmt_us = 250000.0
merge_stmt_kb = 96.0
merge_stmt_cpu_us = 2400.0
merge_stmt_growth_b = 4096.0

# What a burst of writers costs against what one writer costs
# (crates/zu/benches/commit.rs). The same INSERT of one element run at
# six widths, one writer up to thirty two, each on its own connection,
# every level writing the same total.
#
# All three are ratios between levels of one run on one machine, so the
# storage under it cancels: a box whose fdatasync is five times slower
# than a laptop's moves every level by the same five and leaves these
# where they were. That is what makes them gateable on a shared runner
# when the absolute latency in write.rs cannot be.
#
# A durable commit has a floor of between one and two sync periods, and
# the width does not change it. A writer that staged its frames while a
# sync was already in the air cannot be covered by that sync, because
# the sync was told how far to reach before those bytes existed, so it
# waits the one in flight out and then waits for the next one. What the
# width decides is how many writers ride in that next sync, which is
# why the throughput is a straight line in the width and the latency is
# flat.
#
# Measured 17.1 times the statements a second of one writer at thirty
# two writers, with the latency at 1.6 times one writer's and the p99 at
# 1.8. The floor is set well under the measurement and well over the 1.0
# that writers syncing one at a time would give, because it is a
# regression gate and not a claim about the machine. Raise this floor as
# the commit path shares more, never lower it.
#
# The p99 is read against the one writer level's own p99 and not against
# its median. It was the median at first, and on a machine somebody else
# was also using that read 9.6 and failed a gate nothing in the engine
# had moved: the load is in the tail at every width and only tail over
# tail cancels it.
#
# All three are read only where one writer's commit costs a sync. The
# hosted runners commit in about 150 us against a laptop's 3500, which
# is storage that answers before there is anything to batch, and the
# columns there are thirty two threads bidding for four cores rather
# than writers sharing a sync. The bench says so and reports without
# gating; the numbers below are for a machine that syncs.
commit_x = 6.0
commit_p50_x = 3.0
commit_p99_x = 6.0

# A SET of one property of one edge, measured 3.6 ms, 398 us of
# processor time and 15.7 kB at 10000 rows and 10000 edges. It is the
# same statement as the node SET against a column of a different shape:
# a node column is in row order, so a change lands in one place in it,
# while an edge column is dense over the edges in the order the table
# holds them and the change names the pair of rows the edge runs between
# instead of an offset. That used to mean a fold per statement, which
# rewrote the column through the edge order it rebuilt and put the bytes
# near the DETACH DELETE number, 2580 kB. The writer now works the pair
# into the ordinal it holds and the word goes in the patch, so the bytes
# are the log frame and nothing else and the store does not grow at all.
# The processor ceiling is the one that says the ordinal lookup stayed a
# lookup rather than becoming a scan. Lower these ceilings, never raise
# them.
set_edge_stmt_us = 250000.0
set_edge_stmt_kb = 64.0
set_edge_stmt_cpu_us = 1200.0
set_edge_stmt_growth_b = 2048.0

# A SET of the whole record of one element, measured 3.6 ms, 126 to 145
# us of processor time and 16.1 kB at 10000 rows. Two columns, one of
# each kind, so this is the shape that says a string is deferred as well
# as a word: the name goes over the name the row holds, and the readers
# rebuild the blob range around it rather than reading a rewritten
# column. It used to fold per statement at 77.4 kB and 7864 bytes of
# growth, which was the whole table's two columns written out for two
# cells, and the fold is why writing two columns cost what writing one
# did. The bytes and the growth are the exact pair to watch: they say
# the statement wrote a log frame and nothing else. Lower these
# ceilings, never raise them.
set_record_stmt_us = 250000.0
set_record_stmt_kb = 64.0
set_record_stmt_cpu_us = 800.0
set_record_stmt_growth_b = 2048.0

# A SET or a REMOVE of a label, measured 3.2 ms, 82 us of processor time,
# 16.1 kB written and no growth at all at 10000 rows. A label is one bit
# of one word beside the row rather than a cell of a column, so the write
# itself is the cheapest one the statement has, and the bytes used to be
# almost all fold: it rewrote the columns of the table it touched even
# when what changed was not in a column, and wrote the label word per row
# on top of that.
#
# A change is written as two masks, the bits to put on the row and the
# bits to take off it, and what a reader wants is the word. The writer is
# the only side that can read the word the row was carrying, so it puts
# the masks over it once, on the way in, and the patch holds the answer.
# Before the commit was deferred this was 683 us of processor time, 65.9
# kB and 1311 bytes of growth a statement, so it is about eight times
# less processor time and four times fewer bytes. The kB ceiling is the
# DELETE's because it is now the same one log frame, and the growth
# ceiling is a page, loose enough for the log to extend the file and
# tight enough to catch a fold coming back. Lower these ceilings, never
# raise them.
set_label_stmt_us = 250000.0
set_label_stmt_kb = 96.0
set_label_stmt_cpu_us = 400.0
set_label_stmt_growth_b = 4096.0

# What a statement that changed nothing added to the store, per
# statement. A SET that writes back the value it read leaves a table of
# the same shape, so the blocks a fold takes must come out of the free
# list the old ones went onto and the file must not grow at all;
# measured 92 bytes a statement, against 6556 when every statement
# folded. What is left is the fold that does run, once in a few hundred
# statements, and this ceiling is what says the run between them is
# free. Lower this ceiling, never raise it.
set_stmt_growth_b = 2048.0

# Peak resident growth across a 200 statement run, MB. A write of one
# cell holds one cell, and the fold holds the columns it is rebuilding,
# so this is bounded by the table rather than by the statement count;
# measured 19 MB. A path that kept a copy per statement would climb
# with the loop and clear this immediately. Lower this ceiling, never
# raise it.
set_peak_rss_mb = 128.0

# How much of a one cell write is the table it sits in: the same SET
# timed at 10000 rows and at 100000 rows, in time and in bytes written.
# Both are ratios measured in one run, so a slow box moves neither. A
# write path that did not read the table to change one cell of it would
# hold both at 1, and folding per statement means neither is at 1;
# measured 2.1 to 2.5 in time and 1.3 in bytes, well under the 10 a
# fully linear fold would give because four syncs and a header flip are
# the same size at either row count. The ceilings sit between what is
# measured and that 10, so a fold that starts rewriting more than the
# table it touched fails here. These are the two numbers that should
# fall to 1 when the read path learns to consult overlays and the fold
# becomes a background checkpoint. Lower these ceilings, never raise
# them.
set_fold_x = 6.0
set_write_x = 4.0

# An INSERT of one edge between two rows that already exist, the shape
# LinkBench writes most of and the most expensive write there is: a node
# write rewrites the columns of the table it touched, an edge write
# rebuilds the whole CSR both ways and then rewrites every edge property
# column into the new edge order. It is measured at two edge counts for
# the same reason the SET is, and insert_edge_x is the number that says
# how much of one edge write is the edges already in the table. Ten
# would mean the write reads all of them, one would mean it reads none.
#
# Measured 9.2 ms wall, 2.9 ms of processor and 231 kB at 10000 edges.
# The absolute ceilings are loose enough for a shared vCPU and are here
# to catch another sync or another structure being rebuilt, not drift.
#
# insert_edge_x asks the ratio of the processor time and not of the
# clock. Asked of the clock it read 2.5x here and 7.4x on the gate box
# for the same code, because a sync on this laptop is 5 ms and sits in
# both halves of the ratio and flattens it, and a sync on the gate box
# costs nothing. Of the processor time the two agree: 7.0 here and 7.8
# there, which is the write reading most of the edges the table already
# had, near enough to linear that the ceiling is set just above linear.
# Anything over it is a write that got worse than linear in the edges
# in front of it. Lower these ceilings, never raise them.
#
# Since edges commit without folding, insert_edge_x no longer says what
# it was written to say. The write it is a ratio of is flat now, and
# what is left in the number is the MATCH over two patterns that finds
# the two endpoints, which is linear in the rows of the table: measured
# on its own it is 800 us of the statement's 1350 at 10000 rows and
# 9470 of 9976 at 100000. The ceiling stays where it is and the number
# stays printed, because it is the honest cost of the statement a
# client sends, but the write is watched by insert_edge_write_x below.
# The read is worth its own work: two single row selections joined on
# nothing should not cost a scan of the table, and a one pattern MATCH
# over the same predicate is 19 us against 800 for the pair.
insert_edge_stmt_us = 250000.0
insert_edge_stmt_kb = 512.0
insert_edge_stmt_cpu_us = 8000.0
insert_edge_x = 10.0

# The same edge staged straight onto a transaction, with no statement
# in front of it, which is the write on its own.
#
# This is the P5 line: an edge commits into an overlay the readers
# merge, so it stops being linear in the edges already there and stops
# moving the ones behind it. Measured 152 us of processor at 10000
# edges and 148 at 100000, 38 us of that outside the sync, against a
# statement that was 800 us and 4400 us for the same two sizes before
# the deferral. 16.1 kB written is the log frame and nothing else.
#
# The ceilings are set to catch the fold coming back, not to track
# drift: a fold at 100000 edges is thousands of microseconds and
# hundreds of kilobytes, so anything near these numbers is the overlay
# doing its job on a slow box. insert_edge_write_x is the one that
# matters, and it is set just above flat.
insert_edge_write_us = 1000.0
insert_edge_write_kb = 64.0
insert_edge_write_str_us = 1200.0
insert_edge_write_x = 2.0

# The same insert against edges that also carry a 64 character payload,
# which is what LinkBench really writes. A string column is the one the
# rewrite cannot just shuffle: the blob is re-encoded, and re-encoding
# used to mean training a fresh FSST symbol table on a column that had
# already trained one. Measured 6.2 ms of processor at 10000 edges,
# against 28.8 ms before the rewrite started reading the table off the
# segment it is replacing, so the ceiling is set to catch training
# coming back and not to track drift. The wall clock one is loose for
# the same reason as above, it is mostly the sync.
insert_edge_str_stmt_us = 250000.0
insert_edge_str_stmt_cpu_us = 20000.0

# The typed row layer (dx/04 §4) over the same read written as a match
# on Value, both timed in one run against one result of 100000 rows and
# two columns, best of five passes each. This is the same obligation
# api_overhead_x states for the connection, one level up: a caller
# writes `let (id, name): (i64, &str) = row.get()?` instead of a match
# per column, and that has to cost nothing, because a row layer that
# taxes the loop is one every serious caller writes around.
#
# Measured on the M-series laptop over six runs: 0.965 to 1.124 for the
# tuple, and 1.09 to 1.53 for the single string column. The second range
# is wide because both sides of it run under a nanosecond and a fifth of
# a nanosecond of jitter is 20% of the ratio, so its ceiling is set to
# catch the defect and not the drift. The defect is a string that
# started being copied: `String` in place of `&str` on this path
# allocates per row and measures 8x and up, which no amount of jitter
# reaches.
typed_row_x = 1.25
typed_str_x = 2.0

# Streaming a result instead of collecting it (dx/04 §4), measured over
# one scan of 200000 rows on one connection with warm caches, best of
# five timed passes and one separately counted pass for the bytes.
# stream_x is the wall clock of the streamed read over the buffered one.
# It is above 1 and meant to be: the buffered read runs the query and
# then walks a contiguous answer, two tight loops, where the streamed
# one interleaves them and pays a callback and a batch drop every 2048
# rows. Measured 1.18 to 1.75 across runs, so the ceiling catches a
# streamed read that starts costing twice a buffered one rather than the
# spread. stream_bytes_x is what the two hold at their highest, live
# heap above where it stood when the statement started: every row on one
# side, one batch and the morsel feeding it on the other, measured at
# 0.018 and stable because it is a count and not a clock. stream_stop_x
# is a caller that reads the first batch and stops, over the whole scan;
# it measures about 0.015, which is the morsel it had to finish, and it
# is the number that says a stopped scan really stops.
stream_x = 2.0
stream_bytes_x = 0.05
stream_stop_x = 0.10

# Nodes a second through `zu convert`, the route the conformance harness
# ingests by and the only one that carries labels and properties (gql
# plan/09 section 4.3, zu#116). This is a floor, and it is the one
# performance number the plan set out loud: 350000, ten times the 35359
# Neo4j reaches over Bolt on the same fixture, against 493 to 2691 for
# Ladybug. The harness numbers zu was quoted at, 107681 to 136863, were
# a SQLite point query per node per column plus a symbol table trained
# per 1024 row chunk; one scan of the staging table and a symbol lookup
# that indexes instead of hashing put a million nodes with two
# properties at 553135 and 562865 nodes/s on the M-series laptop. The
# floor stays at the contract line rather than just under what this
# machine does, because the gate machines are slower vCPUs and because
# 350000 is the number the plan owes. Raise this floor, never lower it.
convert_nodes_s = 350000.0

# What a declared type is worth on disk, in bits of property data per
# element (gql plan/09 section 4.2, zu#116). The same 200000 node ring
# with four node properties and one edge property is written three
# ways: with no properties, with a column per property and a graph type
# in the catalog naming them, and with one document per element
# carrying its own key names, which is what a store with no catalog has
# to write and what Ladybug's 1094 to 3267 bits/edge is measuring. The
# topology store is subtracted from both, so these are property bytes
# and nothing else.
#
# Measured 94.4 closed and 125.8 schemaless, so the catalog is worth
# 1.33x and not the 4x the key names weigh, because the string
# compressor trains on the column and a key name repeated in every row
# is exactly what it is good at. Both figures are byte counts of a
# deterministic fixture and do not move with the machine; the headroom
# in the ceilings is one 64 KiB block, which is the granularity a file
# size lands on. Lower these ceilings, never raise them.
density_closed_prop_bits = 96.0
density_schemaless_prop_bits = 128.0

# Counting shortest paths against building them (perf/06, zu#77),
# benches/paths.rs. A layered graph, six nodes per layer and seven
# layers, so 335922 paths of least length leave the source and the
# whole count is a sum the bench checks by hand.
#
# The count is answered off the levelled graph the breadth-first
# prepass builds: a node's shortest paths are its predecessors' added
# up, so it is one pass over 43 nodes whatever the paths multiply out
# to. The local M series reads 29.8 us against 53381.2 us before this
# was a sum rather than a walk, and the enumeration of the same paths
# on the same run reads 68549.5 us.
#
# The ratio is the gate that matters and the one that holds still
# across hosts: it says the count is not quietly walking the paths.
# Measured 0.00043, held to a hundredth, which is a factor of twenty
# three of headroom and still fails the moment counting turns back into
# enumerating. The microsecond ceiling is the backstop, set well above
# the reading so a slower box passes.
paths_count_us = 2000.0
paths_count_over_enumerate_x = 0.01

# What a horizontal aggregate costs (ISO 20.9, feature GE09),
# benches/fold.rs. A chain of fifty thousand nodes and a stretch
# repeated eight times, so every row's group holds eight elements and
# the statement folds about four hundred thousand of them, at one
# worker.
#
# plan/04 asked for the fold to be a kernel over the group rather than a
# loop over a list built to be walked, and the allocator is what settles
# it: a fold that built the list would ask for it once a row. Measured
# 5416.4 bytes a row for the match with nothing on it, 5416.5 for the
# same match with the fold, and 6440.4 for the same group read as a
# list, so the fold asks for nothing over the walk and the list asks for
# exactly 1024 bytes a row. Those three numbers do not move with the
# machine or the load, which is why the byte ceiling is the tight gate
# and is set at one byte a row.
#
# The clock is the loose one. The walk is nine tenths of all three
# shapes, so the aggregation is a difference of two large numbers: it
# read 0.32 to 1.11 of the list build over ten runs on a laptop with a
# load average of nineteen, taken as the median of the per round ratios.
# A fold that built its list would pay for the list and then fold it,
# which is near 1.7, so the ceiling is 1.4: it catches the shape of
# regression this is about and is not asked to catch a tenth. The
# microsecond ceiling is a backstop on the whole statement and is set to
# catch an order of magnitude and nothing finer, since what it mostly
# measures is the walk in front of the fold. Lower these ceilings, never
# raise them.
fold_alloc_bytes_row = 1.0
fold_over_list_x = 1.4
fold_group_us = 2000000.0

# What an Arrow export costs when the result is taken rather than
# borrowed, crates/zu-arrow/benches/export.rs. A projection of one
# stored column over 500000 nodes, exported both ways.
#
# Borrowing leaves the result readable, so every buffer the sink filled
# is memcpied into the array that leaves and the export costs a copy of
# the answer. Taking consumes the result and moves those buffers into
# Arrow, so it costs a pointer a column and nothing per row. Measured
# 0.339 ms borrowed against 0.001 ms taken on an M series laptop, which
# is 0.003, and the number is a fixed cost against a cost per row so it
# falls as the answer grows.
#
# The ceiling is set two orders of magnitude above the measurement,
# because what it exists to catch is a copy coming back on the taking
# path, and a copy lands at 1 rather than just over 0.003. Lower this
# ceiling, never raise it.
arrow_taken_export_ratio = 0.25

# i64 addition over two 2048-row flat vectors, the arithmetic kernel
# with the conditions the row engine raises. A sum that does not fit an
# integer is refused rather than wrapped, and what says whether any row
# could have gone over is one fold of both operands into a single
# magnitude, so the rows with an answer pay a fold and nothing else. The
# bench prints the ordinary case and the wide case beside it, the second
# being the checked walk the fold could not rule out. Floors sit under
# the worst observed run on the loaded vCPU hosts. Raise floors, never
# lower them.
vec_arith_grows_s = 0.2

# The distance from nought over a 2048-row flat vector, GF01 as a vector
# kernel. An integer argument keeps its type, so the loop is one
# instruction per row, and the one argument with no answer is found by
# the same kind of fold the arithmetic kernels use rather than by a
# branch inside the loop. Floor sits under the worst observed run on the
# loaded vCPU hosts. Raise floors, never lower them.
vec_math_grows_s = 0.2

# A square root over a 2048-row flat vector, the approximate half of the
# same library. The answer is a float whatever arrived, so the loop is
# one hardware instruction per row and the argument that has no answer,
# a number below nought, is found by one pass over the column rather
# than by a branch inside the loop. Floor sits under the worst observed
# run on the loaded vCPU hosts. Raise floors, never lower them.
vec_math_real_grows_s = 0.2

# A remainder over a 2048-row flat vector, the two argument half of the
# same library. The answers are filled first and the conditions are read
# off them, so the loop is one division per row and the fold that clears
# a chunk of divisors is a single pass. Floor sits under the worst
# observed run on the loaded vCPU hosts. Raise floors, never lower them.
vec_math_pair_grows_s = 0.2

# G9 (zu#124). The fault bit per morsel pattern, priced (plan/07
# section 1.1). The four floors above say the kernels are fast; these
# two say the conditions are why, and they are ratios rather than rates
# because what they gate is a shape and a shape reads the same on a
# quiet machine and a swamped one.
#
# The first is what the guard costs, as the same allocation and the
# same wrapping addition with no condition behind them over the answer
# the kernel gives with one. The fold reads both operands where the
# loop reads both and writes one, so about twice the traffic and about
# twice the time is the honest price of the pattern on the very
# cheapest operation there is, and every operation dearer than an
# integer add pays less of it. Measured on the local M series over
# three interleaved passes at load 11: 1.93, 1.97, 2.11. The ceiling is
# 3, which is not where the measurements are but is well under where a
# check standing in the loop lands: this gate read 6.97 before the
# arithmetic kernel settled its operation outside its loop, and that is
# the number it exists to catch.
vec_guard_x = 3.0

# The second is what the walk costs, as the fold that clears a chunk
# over the walk behind it, both measured on the same operands and the
# same kernel with only the magnitude of the numbers differing. A
# kernel that checked every row where it computed it would read near 1
# here, since the wide operands differ from the ordinary ones only in
# whether the fold can rule them out. Measured on the same three
# passes: 12.50, 11.18, 12.61. The floor is 4, far under the
# measurements and far above where the pattern gone reads. Raise this
# floor, never lower it.
vec_condition_walk_x = 4.0

# A count of characters over a 2048-row flat string vector, the string
# library's first kernel. Nothing here can raise, so the loop is a fold
# over the bytes of each row with no check ahead of it, and the same
# kernel over a coded column measures the table once and gathers. This
# floor started at 0.1, which was read off one run on a machine that
# was busy rather than swamped, and a later run at load 17.6 on ten
# cores measured just under it. The number below sits under that, which
# is what the rule about the worst observed run actually asks for.
vec_str_length_grows_s = 0.05

# An ASCII fold over a 2048-row flat string vector, the string library's
# first kernel whose answer is a string. Every answer is written into a
# builder rather than read out of the argument, so this measures the
# copy and the new view as well as the fold, which is why it runs at
# about half the count above it. The same kernel over a coded column
# writes one answer per table entry instead of one per row. Floor sits
# under the worst observed run, which was 0.05 at load 17.6 on ten
# cores. Raise floors, never lower them.
vec_str_fold_grows_s = 0.03

# A trim of the digits off both ends of a 2048-row flat string vector,
# the string kernel that fills no buffer at all: an answer is a part of
# its argument, so it points back into the argument's own bytes. That
# saves the memory rather than the walk, and the bench prints it beside
# the fold to say so: the two come out about level, a trim paying a
# test of the set for every character it takes off. Floor sits under
# the observed run, which was 0.09 at load 10.8 on ten cores, with the
# same margin the fold beside it has. Raise floors, never lower them.
vec_str_trim_grows_s = 0.03

# A decomposition of a 2048-row flat string vector, the string kernel
# that has to write its answers out: a normal form can make a string
# longer or shorter, so neither the trim's trick of pointing back into
# the argument nor the fold's exact sizing is available to it. What is
# available is the question this measures. The column is plain ASCII,
# which is what nearly every stored column is, and no character below
# 128 decomposes or combines, so every row is in all four forms already
# and the work is a scan that finds that out plus a copy of the views.
# The bench prints the same kernel over an accented column beside this
# one, where every row is decoded, looked up, sorted and written out,
# and that line runs at about a hundredth of this one. Floor sits under
# the worst observed run, which was 0.17 at load 11.5 on ten cores, an
# earlier run at load 5.8 measuring 0.49. Raise floors, never lower
# them.
vec_str_normalize_grows_s = 0.08

# Four characters off the front of a 2048-row flat string vector, which
# is the substring function and the trim's trick a second time: an
# answer is a part of its argument, so it points back into the
# argument's own bytes and no buffer is filled. The walk is bounded by
# the count rather than by the column, so a cut of four characters is
# four steps however long the strings are, and the bench prints it
# beside the trim of the same column to show what the trim was paying
# for its set test. The same call with the count coming from a column
# prints beside it with no target, since the difference between the two
# is one number read a row. Floor sits well under the observed run,
# which was 0.16 at load 5.3 on ten cores, with a wider margin than the
# kernels above it because that is the only run it has been read off
# and a busy machine has measured a third of a light one elsewhere in
# this file. Raise floors, never lower them.
vec_str_cut_grows_s = 0.04

# The identifiers of a 2048-row level, which is the one element function
# whose answer is a string and so the one that has to write anything.
# The table is the level's and is the same for every row, so the head of
# an identifier is written once for the whole chunk and only a row's own
# number goes round the loop, backwards into a stack buffer so the
# digits are divided out once rather than once to measure them and again
# to write them. Nearly every answer fits the twelve bytes a string view
# holds inline, so a chunk of a normal graph fills no buffer at all, and
# the bench prints it beside the fold of a string column to show what a
# kernel that writes seven bytes a row costs against one that writes
# fourteen. Floor sits well under the observed run, which was 0.05 at
# load 6.0 on ten cores in a run where the fold beside it measured 0.02
# against its own floor of 0.03, so the machine was swamped and the
# margin is written for that rather than for the number. Raise floors,
# never lower them.
vec_str_element_id_grows_s = 0.02

# What a write costs with its housekeeping in the number rather than
# beside it.
#
# Every other write key here is measured over 200 statements on a store
# loaded a moment earlier, and a window that short falls entirely inside
# the first deferred batch: no fold runs in it, no checkpoint runs in
# it, and the growth column reads zero because nothing that grows a file
# has happened yet. Those numbers are honest about the deferred path and
# quiet about the rest of it, which is why the sustained run exists. It
# ramps past the point where the file stops growing and then measures
# 2500 statements, long enough to hold folds at their own rate and more
# than one checkpoint. The same SET measures 75 us of processor time in
# the short window and 144 in this one, so a bit under half of what a
# write really costs was falling outside the old window.
#
# The absolute ceilings are loose for the same reason the ones above are
# loose: a commit ends in a full sync, this laptop has measured that
# sync anywhere from 22 to 67 us of processor time between two runs an
# hour apart, and the gate boxes are shared vCPUs. They are here to
# catch another sync or another structure being rebuilt. Lower these
# ceilings, never raise them.
sustained_stmt_us = 250000.0
sustained_stmt_cpu_us = 800.0
sustained_stmt_cpu_nosync_us = 600.0
# The sustained window's bytes, which are the two boxes' two counters
# again and not two different amounts of writing. It reads 19.2 kB on
# the local M series and 69.2 on the Linux gate box for the same 2500
# statements, for the reason set out at set_stmt_kb above: macOS reports
# the bytes the process handed the disk and Linux charges it by the
# page, so a commit that dirties the log page, the header page and the
# pages behind them lands several times higher there. The 64 was the
# laptop's number with room over it and it fails on the gate box by five
# kilobytes, so it moves to 96 alongside the other byte ceilings, which
# is the loudest counter of the two with the same margin those have.
# Lower this ceiling, never raise it, and it comes back down when
# commits stop syncing one at a time.
sustained_stmt_kb = 96.0

# What the store grew by per statement while all that was going on.
# A SET that writes back the value it read leaves a table of the same
# shape, so a store that has reached its steady size must not grow at
# all whatever it folds: the blocks a fold takes have to come out of the
# free list a checkpoint published. Measured 0. Unlike set_stmt_growth_b
# above, this window contains the folds, so the zero means the blocks
# are coming back rather than that nothing has taken any yet.
sustained_stmt_growth_b = 512.0

# The store at its biggest against what the checkpoint rule lets it
# hold.
#
# A fold takes fresh blocks for whatever it rewrites and gives back none
# of them until a checkpoint publishes, because until then the header a
# crash would find still reads what they replaced. So the file carries
# transient garbage, and what bounds it is the checkpoint slack and
# nothing else. It read 18.3 times the store once, 3.9 MB running to
# 71.8, on a threshold that was a flat 256 blocks whatever the store
# was.
#
# This was that ratio, peak over loaded, with a ceiling of 3.0. The
# ratio is the wrong shape: the slack is a quarter of the file held
# between a one megabyte floor and a 64 MB ceiling, so for a store
# under the floor the floor is what is in force and the file is allowed
# to be several times the store while behaving exactly as designed. The
# bench store is 0.4 MB and the flat ceiling failed it at 3.92 on a run
# where the churn never came near the megabyte it was entitled to. What
# is gated now is the churn against the rule, at any store size: one
# means the file used every byte of slack it had.
#
# Over one because the slack is read at the commit after the fold that
# crossed it, so the fold that crosses is over the line by whatever it
# took. A fold of this store is a couple of blocks and the run measures
# 1.12. Lower this ceiling, never raise it.
sustained_slack_x = 1.25

# The tail of a statement on the write path, with no disk under it.
#
# Every other latency in the write bench has an fsync in it. A ceiling
# on one of those is a ceiling on the disk the run happened to have,
# which is why they sit at 250 ms and catch nothing smaller than a
# storage stack falling over. So the p50 and the p99 of each statement
# are printed on its line and none of them is gated, and the write
# side's tail is gated here instead, on the one window whose syncs
# return without asking a platter.
#
# Scaled by the host calibration, the same way write_cpu_nosync_us is,
# because this is a product target and not a number fitted to a box.
# Measured 27, 28 and 43 us over three runs on an M series laptop, and
# 60 and 62 on the gaming box. The gaming box is the tight one: its
# calibration has come back at both 1.24 and 1.00 for the same
# hardware, so the ceiling it enforces is somewhere between 100 and
# 124 against a 62 us reading. That is the headroom a p99 wants, since
# it is one statement in a hundred and moves with whatever else is on
# the box, where the alloc counts a few keys up sit a few percent over
# their measurement because nothing about them is a clock.
write_p99_nosync_us = 100.0

# The same tail over its own median, which no host can move.
#
# A fold is milliseconds where these statements are tens of
# microseconds, and DEFERRED_COMMITS is set so the share of statements
# carrying one stays under what a p99 leaves. The run folds once every
# 240 statements, 0.4 percent, so the folds sit just above the p99 and
# the tail is a statement and not a fold: 1.44 to 2.05 on the laptop
# and 1.94 to 2.68 on the gaming box, off medians of 19 to 31 us. A deferral bound that
# shrank, or a fold that got slower, pulls a fold into the tail and
# doubles this. Lower it as the write path gets flatter, never raise
# it.
write_p99_p50_x = 4.0

# The P5 point write gate: processor time a statement excluding fsync,
# under 30 us (docs/12, zu#78).
#
# Measured rather than estimated, and the difference matters. The
# cpu-sync column beside every other write key is the processor time
# with one calibrated sync subtracted from it, and that subtraction does
# not work: a sustained statement pays its own commit sync plus its
# share of the two a checkpoint costs, so one is the wrong number of
# them to take off, and the calibration syncs a scratch file with a few
# bytes behind it while the statement syncs a nine megabyte store with a
# fold's worth of dirty pages, so one sync is also the wrong size. Three
# runs of the same commit on this laptop put that column at 53, 122 and
# 201 us, which measures the machine's mood.
#
# This key comes off a store on the memory filesystem instead. It runs
# the identical write path, encodes the same log frames, keeps the same
# overlay, folds on the same schedule and checkpoints on the same
# threshold, and the only thing it does differently is return from a
# sync without asking a disk. So the difference between it and the
# durable run beside it is durability and nothing else. Measured 19.0
# against the same window's 106.7 with the syncs in it, and 19.1 over a
# window too short to fold, so the folds are about four microseconds of
# it and the run is not measuring a store that quietly stopped working.
#
# This is a target and not a ceiling fitted to what was measured: it is
# the number docs/12 asks for, so a gate box slower than this laptop is
# supposed to fail it rather than have it raised.
write_cpu_nosync_us = 30.0

# There is no second key for a shared runner any more. There used to be
# one, because the ceiling above is a product target rather than a number
# fitted to a box and a hosted runner cannot meet it, and a per box class
# key drifts: it was fitted at 60 off two readings, went red on every run
# for a day, and had to be refitted to 100 off twelve. That is #648.
#
# write.rs now does what refuse.rs does. It times a proxy loop shaped
# like a write, divides by what that loop costs on the host the target
# was written for, and reads the ceiling at that ratio, clamped to three.
# So the target above is enforced everywhere, at 30 us on a machine with
# its cores to itself and at whatever multiple of 30 the box has earned
# on a slower one, and there is nothing here to keep current.

# A bound on a stored date at one worker, M rows/s (docs/07): two
# million people with a birthday strided over forty years, so
# neighboring rows hold unrelated dates, every chunk holds the whole
# range and the zone map rules out none of them. What the bound costs
# is the comparison and nothing else.
#
# The bench prints the same filter written over a number beside it,
# and that pair is the whole point of the gate: a date is a count of
# days in the word an integer rides, so the two do the same work and
# any gap between them is what the lane tag is costing. On a quiet
# local M series the date bound measured 856 and 818 M rows/s over two
# runs against the integer bound's 853 and 836, which is the same
# number twice. On server3 at load 14 the two came in at 125 against
# 196 on one run and 112 against 92 on the next, the second one
# putting the date ahead of the integer, which is a busy machine
# rather than a result. The other three spellings land where the first
# one does: the selective bound 1052 locally, the duration equality
# 516, the grouping on a duration 158, and against the old engine
# those are 23x, 22x, 12x and 15x.
#
# Read off server3 rather than server1, which is where the rest of
# this file's floors were set: server1 is a shared node with five
# gigabytes of memory and none of it free, and a build there thrashed
# rather than finishing. The floor sits well under the worse of the
# two server3 runs, with a wider margin than the settled kernels above
# because two readings on a loaded box is all it has been read off.
# Raise this floor, never lower it.
exec_temporal_mrows_s_core = 70.0

# What a burst of eight writers sees at the tail, on a store whose
# syncs return without asking a disk (zu#78, crates/zu/benches/commit.rs).
#
# The durable columns of that bench cannot carry this. They report
# ratios, and ratios are all they can report: a laptop pays four
# milliseconds a commit to fcntl and a runner on a memory filesystem
# pays none, so the same engine reads two orders of magnitude apart and
# an absolute ceiling over them would be a ceiling on whichever disk
# the run happened to land on. The unsynced pass is the same burst with
# the storage taken out from under it, and what is left is the part
# this repository owns: the queue in front of the write side, and the
# fold that runs while a writer is holding it.
#
# The number is the fold. A fold lands every so many statements, costs
# milliseconds where a statement costs microseconds, and holds the write
# side while it runs, so the writers queued behind it wait it out too.
# That puts about one statement in every (bound / writers) over a
# millisecond, and while the bound was 256 the tail at eight writers was
# a fold every time: six runs on a quiet thirty two core box read
# between 3450 and 3645 with the median statement at 281.
#
# The bound is 4096 now for what this bench writes, which is rows on the
# end of a table, and a p99 at eight writers no longer reaches a fold.
# It reads 357 on that box and 156 to 188 on a laptop, against the 3548
# the same box read on the commit before. That is under the P5 target of
# 2000 and this ceiling is under it too, which it could not be while the
# tail was a fold. Writes over rows that are already there keep the old
# bound of 256 and would read the old tail, for the reason DEFERRED_COPIED
# gives: what they cost is not the commit but every scan after it.
#
# What made the bound moveable was not the fold getting cheaper. It was
# the deferred patch: every commit used to copy the whole run of rows it
# had accumulated, so a run of length n cost n squared and 256 was as far
# as it went. The patch keeps its rows in sealed chunks now and a commit
# copies a pointer, so the run costs what it holds.
#
# Set at four times the worst reading rather than at the measurement,
# because a fold is processor work and a box with somebody else's build
# on it stretches processor work: the same commit was seen at 156, 357
# and 523 on three boxes at three loads. Four times the worst still
# catches the tail going back to being a fold, which is the regression
# this is here for and is a factor of seven away.
#
# Both of these are held only where the level's own median leaves room
# under a millisecond. On two shared cores eight writers queue for
# long enough that a tail in milliseconds is reading the box, and the
# bench says so and reports rather than failing.
commit_p99_nosync_us = 1500.0

# How many statements a fold makes slow, at eight writers on the
# unsynced store.
#
# The tail above says how slow and this says how many. It read 3.21
# percent on a quiet laptop and 3.77 to 3.99 over six runs on the
# thirty two core box while a fold landed every 256 statements, against
# 0.58 percent at one writer, and the gap between those two is the
# whole point: one fold is one slow statement when one writer is
# waiting for the write side and eight when eight are.
#
# So this is the number that goes down when folds come off the
# statement's path. It is 0.34 percent now, on the laptop and on the
# thirty two core box, which is the same arithmetic run at a bound of
# 4096 instead of 256.
#
# The ceiling is not three times that but four, and the reason is a
# reading of 0.73 percent on the laptop under load, on a run whose
# median was 246 us against the 80 of the quiet one. A fold costs
# milliseconds on any box, so the folds themselves put the same count
# over the line either way, but a loaded box also queues statements
# past a millisecond that no fold was anywhere near, and those land on
# this number too. Four times leaves room for that and still catches
# the bound going back, which would be worth ten times.
commit_slow_share = 0.015

# What eight writers get through against one, on the same unsynced
# store.
#
# One is the ceiling and not the floor: a store has one write side, so
# eight writers take turns at it and the best a wide level can do is
# lose nothing to the taking of turns. What this catches is the turns
# costing more than the work. It read 0.40 before the write side began
# handing over to one waiter instead of waking all of them, and 0.53
# after, on the same box in the same hour.
#
# Left where it is although both ends of it got faster, because the
# ratio went the wrong way while doing so: one writer went from 36915
# statements a second to 67475 and eight went from 20849 to 31647, so
# more got through at both widths and the ratio fell from 0.56 to 0.47.
# That is one writer having been the one paying most of the copy this
# ratio's denominator is made of, and it is not the taking of turns
# getting worse. The laptop, whose cores are not shared, reads 0.96.
commit_stmt_nosync_x = 0.45

# What an append costs at ten times the table
# (crates/zu/benches/write.rs).
#
# A fold rewrites the columns a statement touched, and an append
# touches every column of its table because it adds a row past the end
# of each of them. Whether that means rewriting a column or extending
# one is the difference between an insert rate that holds as a table
# fills and one that falls off, and nothing here asked: the bench
# priced SET at two table sizes and INSERT at one.
#
# It extends. Ten times the rows costs 1.11x the processor time, which
# is the fold copying the encoded bytes of the chunks it did not
# change rather than putting them back through the encoder. The ceiling
# is where a real rewrite would show up long before it reached ten.
insert_fold_x = 2.0
