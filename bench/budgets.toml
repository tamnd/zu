# The grouping sink at one worker, M rows/s (perf/05 section 4): ten
# million people scanned and grouped on an integer key into a hundred
# thousand groups. It is the whole query, decode and scan and sink and
# the final sort of the groups, because that is what a user waits for.
#
# perf/05 asks for 100 M rows/s/core and the bare metal hosts clear
# it now that a counting group by keeps the count in the probe slot:
# gamingpc 115 and 113 against 91 and 94 before. The shared vCPU
# hosts moved with it, server1 9 to 13 and server3 7 to 10, and they
# are still an order of magnitude behind, which is not the sink. The
# same query grouped into twelve groups, where the whole table fits
# in L1, runs 72 to 79 on server1 and 63 to 65 on server3 against 205
# on gamingpc, so the gap is already there before the group table is
# wide enough to miss. These boxes do not have the memory bandwidth
# to feed one core a scan this size, and no amount of work on the
# sink moves that. So the floor sits under server3's worst run and
# the number that answers perf/05 is the bare metal one. The bench
# crosschecks the group count and the row total against the generator
# on every run. Raise this floor, never lower it.
exec_group_mrows_s_core = 8.0

# What the ORDER BY costs on a query that already has one, percent
# (perf/05 section 5). The bench runs the same ten thousand row fan
# three ways, unordered, ordered with a LIMIT 10, and fully ordered,
# and the share is what the ORDER BY and the LIMIT add over the plain
# projection. perf/05 asks for under 5 percent.
#
# Measured at feb4a69, the bench run on its own: gamingpc -2.3,
# server1 -2.5, local M series -2.3, against 3.9, 3.8 and 5.9 for the
# same three hosts the commit before. The share is negative because
# the ordered query is now the cheaper of the two: the sink knows the
# limit before the first row arrives, so it builds ten rows where the
# plain projection builds ten thousand, and the ORDER BY more than
# pays for what it asks.
#
# The share is a difference of two timings a few milliseconds apart,
# so it carries the noise of both, and at 6b34892 that noise ran to
# five points either way on a loaded host: server1 read 1.9 quiet and
# 9.4 loaded, and one of its fully ordered runs came in at 11.29 ms
# against 11.58 for the top ten, the strictly larger job finishing
# first. The spread is still there, the four runs at the end of the
# full gate read -0.9 and -1.2 on gamingpc and -0.8 and -4.7 on
# server1, but it now sits around a negative number instead of around
# 4, so the ceiling can be the target perf/05 named rather than a
# number picked to clear the noise. The top ten rows are crosschecked
# against a reference sort on every run. Lower this ceiling, never
# raise it.
exec_sort_share_pct = 5.0

# The rate a wide ORDER BY orders at, M rows/s (perf/05 section 5). The
# same bench runs a hundred thousand row fan twice over: once ordered on
# three integer columns, which is 24 bytes of normalized key and past
# what one 128 bit word holds, and once ordered on a name with an id
# behind it, which is not an integer key at all. Each is timed against
# the same projection with the ORDER BY taken off, so the two timings
# differ by the sort and nothing else, and the floor is the slower of
# the two shapes so neither can slip while the other carries it.
#
# Measured at dcdcbbe, against the same bench with only sink.rs put back
# to what main had: gamingpc 13.5 and 28.1 against 9.3 and 8.0, server1
# 3.3 and 9.4 against 1.3 and 1.4. The three column key gains the least
# because a 24 byte compare is a memcmp either way; the name key gains
# the most because before this it was not a normalized key at all and
# every compare walked a row of values.
#
# server1 sets the floor and it swings, 3.9 on one run and 3.3 on the
# next inside the same hour, so the margin under it is that spread and
# not slack. Raise this floor, never lower it.
exec_sort_wide_mrows_s = 3.0

# The unchained join table probed on distinct keys, M rows/s (perf/05
# section 2): a million build rows, four million probes, every one of
# them a hit. It floors the probe rather than the build because it is
# the shape with the least room to hide, one directory word and one
# short range per row with nothing amortized over a match list.
#
# Measured: local M series 78 to 93, gamingpc 73 to 82, server1 7 to 10.
# The same probe on a std HashSet, which is what exec.rs uses today, is
# 1.0 to 2.6x slower on every host, and the miss probe that the folded
# Bloom tag is actually there for is 2.0 to 4.9x slower. Those are the
# two shapes this table was chosen for and it wins both. Nothing
# compiles to a join yet, so this gate guards a primitive and not a
# query. The bench crosschecks every timed run against a scan of the
# build side. Raise this floor, never lower it.
exec_join_probe_mrows_s = 6.0

# The same table on the duplicate-heavy join, M pairs/s: forty build
# rows to a key, so a probe that hits reads a run of forty. This is the
# shape a join on a graph key produces once a hub is in the data, and
# perf/05 section 2 quotes its largest number on it.
#
# It used to run at a third of a HashMap<u64, Vec<u64>> and was left
# unfloored for it. Storing a key once and pointing at its run of rows
# put it level with that map, so there is ground to hold now. Measured
# after that: local M series 3300 to 3600, gamingpc 2260 to 2490,
# server1 166 to 242. The floor is set off server1, the slowest of them
# and the one that runs a gate under memory pressure, at about two
# thirds of the worst run seen there. Raise this floor, never lower it.
exec_join_dup_mpairs_s = 100.0

# The build of that same table, M rows/s over a million distinct keys.
# Every probe worker waits on this before it reads a row, so it is the
# serial part of a join and the one that does not divide by the number
# of cores.
#
# The build is a counting sort, and until the rows were dealt into
# partitions of the directory first it wrote at random over a structure
# the size of the build side. Measured with the deal in: local M series
# 61 to 67, gamingpc 37 to 45, server1 10.6 to 14.3, against 43 to 55,
# 37 to 40 and 9.7 to 13.0 without it. The floor is set off server1, the
# slowest of them and the one that runs a gate under memory pressure,
# under the worst median seen there, since a build under memory pressure
# is the run most likely to wander. Raise this floor, never lower it.
exec_join_build_mrows_s = 8.0

# The filter a join build passes sideways, M probe rows/s selected
# (perf/13 section 1): a million build keys scattered over the whole
# word, so the filter is the bloom rather than the exact bitmap, and
# four million probe rows of which one in sixteen matches. The misses
# sit inside the build side's own range on purpose, so the range check
# cannot answer them and the membership test has to earn the number.
#
# The bloom is floored rather than the mask because it is the general
# case and the slower of the two. Measured, in M rows/s on the local M
# series, gamingpc and server1: the mask 797, 496 to 517 and 114 to 207,
# the bloom 401 to 406, 302 to 360 and 76 to 101. The join table's own
# directory tags, which perf/13 suggests reusing instead, read 574 to
# 653, 270 to 351 and 19 to 25 on the same hosts and let 2.36 percent of
# the strangers through against the bloom's 0.48, which is why the
# filter is its own structure rather than a view of the table.
#
# The floor is set off server1, the slowest of them and the one that
# runs a gate with no free page cache, at about two thirds of the worst
# run seen there. That box swings widely, 76 to 101 on this line inside
# one afternoon, so the margin is the spread and not slack. Raise this
# floor, never lower it.
exec_sip_select_mrows_s = 50.0

# What a query is left at when the join publishes that filter to the
# level it probes, against the same plan with ZU_SIP=0 holding it back
# (perf/13 section 1). The join bench times two shapes both ways and
# this floors the weaker of the two, so it is a no regression gate:
# a filter that costs more than it saves fails here.
#
# The two shapes are the two halves of the pass. One has build keys
# eight apart, close enough together that the filter is the exact mask
# and one probe row in eight survives the test; the other has a build
# side whose keys are city numbers against a probe key that climbs with
# the row, so the range alone skips every chunk but the first before it
# is decoded.
#
# The range one is worth having everywhere and the membership one only
# pays where a probe is dear. Measured at 622e4ba, second pass on each
# host, in ms with the filter on against the same plan with ZU_SIP=0:
# the mask 43.7 against 45.6 on the local M series, 38.3 against 42.3
# on gamingpc and 171.1 against 228.3 on server1, so 1.0, 1.1 and 1.3x.
# The range 14.1 against 16.5, 15.0 against 19.9 and 86.1 against 120.5,
# so 1.2, 1.3 and 1.4x. The slowest box gets the most out of the mask
# and the fastest gets nothing, which is the same story as everywhere
# else: the mask saves a random read, and a random read is only worth
# saving when it costs something. The worst either shape has come back
# on any pass is 0.9, the local mask on a cold one, and the floor sits
# just under that.
#
# Neither is the pass at its best, and the reason is the join side
# choice rather than the filter: the optimizer drives the cheaper
# estimated side and builds the dearer one, so the filter is published
# from the big side onto the small one and the big side's build is
# still in both numbers. Raise this floor once that turns around.
exec_sip_worst_x = 0.85

# The summed arithmetic projection at one worker, M rows/s (perf/05
# section 5): two million people and `sum(p.score * 2 + p.bucket)`,
# which returns one row, so nothing is built and the number is the
# scan and the expression and nothing else.
#
# The bench prints three shapes and each one twice, once through the
# pipeline and once with ZU_EXEC2=0, which is where all three ran
# before an arithmetic projection had a compiled shape. Measured at
# f3f7d2f, one worker, in ms for the pipeline against the old engine:
# the sum 13.8 against 185.3 on the local M series, 12.2 against 221.4
# on gamingpc, 45.6 against 655.1 on server1; the hundredth-of-a-table
# read 8.9 against 93.7, 8.9 against 120.4 and 29.5 against 316.0; and
# the same expression returned for every row 48.5 against 331.8, 66.8
# against 314.4 and 286.2 against 1028.4. So 13.5x, 18.2x and 14.4x on
# the shape with no rows to build, and 6.8x, 4.7x and 3.6x once two
# million rows have to be handed back, where the row build is most of
# what is left.
#
# The floor is set off server1, the slowest host and the one that
# gates with no free page cache, at about two thirds of what it
# measured there. Raise this floor, never lower it.
exec_project_mrows_s_core = 25.0

# The OPTIONAL MATCH bracket at one worker, M outer rows/s (docs/07):
# two million people of whom every fourth is isolated, so a quarter of
# the outer rows take the miss path and the number is not the matching
# case with a branch in it. The rest know two people each. The counted
# shape is what the floor sits on, since it has nothing built above the
# bracket and so is the walk and the miss handling and nothing else.
#
# The bench prints four shapes and each one twice, once through the
# pipeline and once with ZU_EXEC2=0, which is where the first three ran
# before an OPTIONAL MATCH had a compiled shape at all. Measured at
# c7c02f0, one worker, in ms for the pipeline against the old engine:
# the count 51.6 against 156.1 on gamingpc and 158.2 against 574.4 on
# server1; the rows shape 145.4 against 591.9 and 529.0 against 2220.8;
# the filtered shape, whose WHERE sits inside the bracket and turns
# most hits into misses, 296.5 against 697.4 and 1283.1 against 3299.9.
# So 3.0x and 3.6x on the count, 4.1x and 4.2x on the rows, 2.4x and
# 2.6x on the filtered one, which is dominated by the filter running
# over a vector of two rather than by the bracket.
#
# The fourth shape is the same walk and the same projection with the
# bracket taken off: 131.1 ms on gamingpc against the rows shape's
# 145.4, and 411.5 against 529.0 on server1. That gap is what the
# bracket costs, and it is the miss path and the null level, not a tax
# on the rows that matched.
#
# The floor is set off server1, the slowest host and the one that gates
# with no free page cache, at about two thirds of its worse run. Raise
# this floor, never lower it.
exec_optional_mrows_s_core = 8.0

# The batch point read at one worker, M keys/s (docs/07): a leading
# UNWIND over fifty thousand ids strided across a two million row table
# so no two lookups land near each other, which is the serving shape of
# a client holding a page of ids. The bare read is what the floor sits
# on, since it is the key index and the gather and nothing else.
#
# The bench prints five shapes and each one twice, once through the
# pipeline over the whole batch and once with ZU_EXEC2=0 over eight
# keys, because the old engine has no plan for this at all: its index
# lookup only fires on a key that names no variable, so a key out of an
# UNWIND leaves it scanning the table once per element. Both sides are
# reported per key for that reason. Measured at 659927b, one worker, in
# us per key for the pipeline against the old engine: the read 0.11
# against 92924 on gamingpc and 0.39 against 281828 on server1; the hop
# 0.42 against 92698 and 1.54 against 269806; the counted hop 1.45
# against 92963 and 3.55 against 281854; the count per key 0.51 against
# 92758 and 2.35 against 286573; the two hop count 1.76 against 92085
# and 4.45 against 292312.
#
# The reference that says what this is worth is the last line the bench
# prints: the same page of ids read the way a client reads one today,
# one prepared point query per key, both sides on the pipeline. That is
# 44.79 us per key on gamingpc against the batch's 0.11 and 136.43 on
# server1 against 0.39, so 407x and 350x on the same work with the per
# query cost paid once instead of fifty thousand times.
#
# The floor is set off server1, the slowest host and the one that gates
# with no free page cache. This shape is the one that feels that box
# being shared: fifty thousand lookups landing all over the table are
# page cache reads, so when the neighbors take the memory the whole
# bench goes with it. Five runs there read 2.6, 2.5, 2.3, 1.8 and 0.3 M
# keys/s, the last one with a load average of 49 and 165 MB free, while
# gamingpc reads 8.7 twice in a row. The floor sits under the worst of
# those so it fails on the shape and not on a neighbor: a fallback to
# the old engine is 0.0000035 here and the group thrash this change
# fixed was 20x, both of which it still catches. Raise this floor,
# never lower it.
exec_batch_mkeys_s_core = 0.25

# Cardinality quality over the SF1 corpus, q-error percentiles
# (perf/12 section 4). Twelve queries run profiled, every operator that
# carries an estimate contributes one max(est/act, act/est), and the
# pool is 29 operators. Unlike everything else in this file these are
# not timings: they fall out of the data and the estimator alone, so
# they read the same on every host and any move in them is a change in
# the optimizer. gamingpc and server1 both report p50 1.00, p90 2.10,
# p99 2.34, max 23.76.
#
# perf/12 section 6 wants 2, 10, and 100, and all three are met. p90 and
# p99 sat at 16.37 until the point seeded hop stopped guessing: three of
# the twelve queries name their seed with a parameter, the seed SF1
# hands them holds 335 knows edges against a mean of 16.8, and no plan
# time estimate can know that because the plan is cached across
# parameter values. The run has the value, so the step off a pinned seed
# now reads that seed's degree off the offsets and reports it, which
# took those three operators from 16.4 to 1.0 and p90 from 16.37 to
# 2.10. Before that, property predicates were the whole of the miss:
# the per column statistics of perf/12 section 1 took p90 from 74.30 and
# p99 from 114.39, and the degree sequence norms of the same section
# took p50 from 1.17 and the worst operator from 45.89.
#
# What is left is the triangle close at 23.8, which the intersection
# still treats as independent of the two hops that reached its
# endpoints. The ceilings below sit close to the measurements because
# these numbers do not move with the host: any move at all is the
# estimator changing. Lower these ceilings, never raise them.
card_qerror_p50 = 1.2
card_qerror_p90 = 3.0
card_qerror_p99 = 3.0
card_qerror_max = 26.0

# Cardinality quality over graphs the bench generates itself (perf/12
# sections 4 and 6). SF1 is one graph with one degree distribution and
# it is not in CI, so this gate varies the data instead of the queries:
# a uniform graph where every node holds eight out-edges, a hub graph
# where sixteen nodes hold half the edges, and a funnel where twenty
# thousand nodes point at two hundred targets. Eleven queries run over
# each, 75 operators in the pool. Deterministic like the SF1 numbers
# above and for the same reason, so these read the same on every host.
#
# Measured p50 1.00, p90 1.02, max 447.43 on the Mac, gamingpc and
# server1 alike. The max used to be the hub seeded hop at 611.29: that
# shape gives node 3 2372 knows edges against a mean under four, and no
# plan time estimate can know which node a parameter names. Reading the
# pinned seed's own degree at run time took it to 1.0 and took the hub
# p90 from 1.68 to 1.02. What is left on top is the hub triangle at
# 447, the independence assumption on the closing edge, and that one
# does want a better estimate rather than a better reader.
#
# There is no ceiling here anywhere near as tight as the SF1 ones above
# because these shapes are built to be hostile on purpose, so the number
# to watch is whether the max moves, not how large it is. Lower these
# ceilings, never raise them.
#
# There is no budget line for bound violations on purpose. A ceiling is
# a promise the join order DP is built on, so the bench fails on the
# first one whether the run is gated or not, and no number of wrong
# ceilings is worth writing down here as acceptable.
card_gen_qerror_p90 = 1.2
card_gen_qerror_max = 500.0

# The table function port (perf/07 section 5, zu#76). A leading CALL
# yields one row per node and the pipeline now runs that whole shape
# instead of handing it to the old engine. The bench builds a million
# people in a thousand blocks, two friends each inside the block, so wcc
# labels a thousand components and a group by on the yielded label has a
# thousand real groups. Five shapes run: count the yield, sum it, group
# by it, hop off every yielded node, and hop with the yielded value in
# the WHERE. Every run is crosschecked against a union-find over the
# same edge list, so a pipeline that loses rows fails before it prints.
#
# One worker, so these are per core. gamingpc reads the count at 169.6
# M rows/s against the old engine's 73.3 ms, the sum at 109.0 against
# 89.4, the group by at 93.0 against 156.1, the hop at 140.8 against
# 58.7 and the filtered hop at 140.6 against 89.4, which is 12.4x, 9.7x,
# 14.5x, 8.3x and 12.6x. server1 reads 51.9, 33.0, 26.2, 35.1 and 36.2
# M rows/s for 12.8x, 11.6x, 13.4x, 7.8x and 10.3x on the same shapes.
# The wcc kernel itself is 5.6 ms on gamingpc and 17.2 on server1, and
# both engines pay it, so the ratios above are what the rows cost with
# the algorithm left in.
#
# The floor is the count case end to end in millions of rows a second,
# so it carries the kernel both engines run. That is on purpose: the
# whole query finishes in less time than a standalone wcc reads, 5.9 ms
# against 5.6 on gamingpc, so a floor on the pipeline's own share would
# be a floor on timing noise. The kernel does not hide a regression
# either, because a fallback to the old engine reads 4.1 M rows/s on
# server1 and the floor sits three times above that. It also sits under
# the worst the shared box has printed, 41.0 M rows/s at a load average
# of 16, so it fails on the shape and not on a neighbor. Raise this
# floor, never lower it.
exec_call_mrows_s_core = 12.0

# Factorized aggregation over a hop (perf/13 section 1, zu#76). An
# aggregate that reads nothing off the expanded level does not need the
# expanded rows, only how many of them there were, so the hop becomes a
# weight: a degree read over offsets alone, the neighbor array never
# touched, one group probe per source row instead of one per neighbor.
# The bench is a million people over a thousand cities with out degrees
# zero to seven, 3.5M edges and 17.5M two hop rows, and every case is
# crosschecked against the edge list per group and in total, so a weight
# that lands on the wrong key fails before it prints.
#
# One worker, so these are per core, and the rate counts the hop rows
# the walk would have produced. gamingpc reads the counted key at 502.5
# M hop rows/s against the old engine's 152.0 ms, the summed key at
# 341.0 against 195.8, the bare sum at 602.1 against 110.5 and the two
# hop at 240.3 against 2318.2, which is 21.8x, 19.1x, 19.0x and 31.8x.
# server1 at a load average of 14 reads 147.2, 70.0, 205.7 and 48.8 M
# hop rows/s for 30.8x, 12.4x, 20.8x and 23.6x.
#
# The two hop is the case the sorted degree read is for. Its neighbors
# arrive in the order their source rows did, and a degree read that
# walks into a new storage group every row reads two offsets out of the
# file for each of them, which was 4.8s of the 4.9s the case took before
# the order went in.
#
# The floor is the counted key, the shape whose whole per row cost is a
# hash and an increment. It sits three times under the worst the shared
# box has printed and eight times over what the same query reads when it
# falls back to the old engine, 4.8 M hop rows/s on server1, so it fails
# on the fusion going away rather than on a noisy neighbor. Raise this
# floor, never lower it.
exec_factor_mrows_s_core = 40.0

# The second pattern branch and the hub weight (perf/05 section 2,
# zu#76). Two patterns off one variable with both far ends read is a
# cross product per source row: the shared end is pinned, its list is
# read once, and every row of the newest level pairs with the whole of
# it. When one of the two ends is read by nothing the walk on that side
# is not a walk at all, it is a degree, and the rows the other side
# keeps carry it as a weight.
#
# Same graph as the factor bench, a million people over a thousand
# cities with out degrees zero to seven, and the same crosscheck: every
# case is checked against the edge list on every run, rows and total, so
# a pairing that drops or repeats fails before it prints. The rate
# counts the pairs the cross product has to walk.
#
# One worker, so these are per core. gamingpc reads the grouped branch
# at 179.8 M pairs/s against the old engine's 579.8 ms, both ends
# grouped at 25.1 against 3018.6, the paired predicate at 30.7 against
# 1760.6 and the two hop branch at 26.5 against 11785.7, which is 6.0x,
# 4.3x, 3.1x and 173.3x. server1 at a load average of 40 reads 20.5,
# 6.3, 8.1 and 7.6 M pairs/s for 5.8x, 4.9x, 2.8x and 401.0x. The shared
# box was between 24 and 80 loaded across those runs and printed 5.4 M
# pairs/s for the paired predicate on the run before, which is what the
# floors are set under.
#
# Two floors, because the two halves fail differently. The hub weight
# floor is the one that catches a fallback: the same grouped query reads
# 3.5 M pairs/s when it goes back to the old engine on server1, and the
# floor sits three times over that. The branch floor catches a collapse
# rather than a fallback, since the old engine is only 2.4x behind it on
# the shared box, and it sits under the worst that box has printed.
# Raise these floors, never lower them.
exec_branch_mpairs_s_core = 3.0
exec_hub_mpairs_s_core = 10.0

# The value join (perf/05 section 3, zu#76). Two patterns that share no
# variable, tied by an equality on a property. The old engine picks one
# to drive and scans the whole of the other for every row of it, so the
# shape is rows times rows. The pipeline reads one integer column of the
# held side into a hash table once and probes it a row at a time, which
# is a pass over each side plus the rows that match.
#
# The build is paid on every execution, since nothing caches a compiled
# plan yet, so it is inside every number here. That is what a caller
# pays today and the floor is set over it rather than over a warm table
# nobody has.
#
# A million people over a thousand cities, four shapes plus a miss case,
# every one crosschecked against the generators on every run, rows and
# total, so a join that drops rows, repeats them or lands them on the
# wrong key fails before it prints. The rate counts probe rows, the rows
# of the driving side.
#
# One worker, so these are per core. gamingpc reads the unique key at
# 9.85 M probes/s, a key with a thousand rows under it at 15.6 us a
# probe, an all miss probe at 30.7 M/s, the grouped join at 4.93 M/s and
# a hop off the joined level at 1.41 M/s. server1 at a load average of
# 35 reads 1.19, 45.8 us, 7.85, 0.71 and 0.31.
#
# There is no ratio against the old engine at this size because it does
# not finish: it is 72 ms a probe row on gamingpc and 207 ms on server1,
# which is twenty hours and two and a half days for the million the
# pipeline does in a tenth of a second. So the bench times the old
# engine over two hundred probe rows and reports per probe, and the
# unique key case comes out 714371x ahead per probe on gamingpc and
# 246985x on server1.
#
# One floor, on the unique key case, since that is the one where the
# table is at its widest and the build is the largest share of the time.
# It sits under the worst the shared box has printed. Raise it, never
# lower it.
exec_join_mprobes_s_core = 0.8
