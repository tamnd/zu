# Decode throughput floors in GB/s of decoded output, single core.
# The M0 exit gate is 1.0 for every encoding (docs/12-implementation-plan.md).
# Floors are set for the slowest gate machine (AMD EPYC vCPU, server1);
# gamingpc numbers run far above them. Raise floors, never lower them.

for_bitpack = 1.0
delta_bitpack = 1.0
delta_patch = 1.0
rle = 1.0
dict = 1.0

# COPY ingest floors, single core, sort included, parse excluded (B6/B8).
# The density keys are ceilings, not floors, set just above the measured
# LiveJournal numbers with Delta+Patch: raw order 22.77, BFS 22.01.
# Lower ceilings, never raise them. The 8.0 exit budget from docs/12
# remains open: patched exceptions removed the outlier tax, but in-list
# gaps on LiveJournal run 16-18 bits even BFS-reordered, because BFS
# frontiers on a social graph are millions wide. Getting under 8 needs
# an LLP-class ordering or copy-list compression, both deferred by
# docs/04 section 5.
copy_medges_s = 1.0
bits_per_edge = 23.0
bits_per_edge_bfs = 22.5

# Random 1-hop point reads on the loaded LiveJournal file, single core,
# K lookups/s. Each lookup decodes only the chunks holding the node's two
# offsets and its neighbor list. Floor set for the slowest gate machine;
# raise floors, never lower them.
point_klookups_s = 50.0
