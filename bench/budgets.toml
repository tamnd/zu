# known query and starting execution. point is the full warm point
# read through the session: plan hit, bind, key lookup, one-hop count.
# Measured on the local M series: plan hit 0.04 us, point read 2.0 us
# (the one-shot open+plan+run path on the same file is 133 us, 65x).
# Ceilings are the perf/07 targets and leave room for the EPYC vCPU
# hosts and their documented steal. Lower these ceilings, never raise
# them.
session_plan_hit_us = 5.0
session_point_us = 20.0

# P1 vector kernel gates (Spec/2064g/perf/02 and perf/11, zu#74),
# benches/kernels.rs, single core, all inputs cache resident. The spec
# targets print next to every measurement; floors sit under the worst
# observed run on the loaded EPYC vCPU hosts so the gate catches a
# broken kernel, not a noisy neighbor. Raise floors, never lower them.
#
# cmp is the SWAR compare fill, i64 against a constant over 2048-row
# vectors. The perf/11 target is 8 G rows/s and the local M series
