# Decode throughput floors in GB/s of decoded output, single core.
# The M0 exit gate is 1.0 for every encoding (docs/12-implementation-plan.md).
# Floors are set for the slowest gate machine (AMD EPYC vCPU, server1);
# gamingpc numbers run far above them. Raise floors, never lower them.

for_bitpack = 1.0
delta_bitpack = 1.0
rle = 1.0
dict = 1.0

# COPY ingest floors, single core, sort included, parse excluded (B6/B8).
# bits_per_edge is a ceiling, not a floor. Raw-order LiveJournal measures
# 24.29 bits/edge today: delta packs 1024-value chunks, each chunk spans
# about 70 adjacency lists at average degree 14, and one 23-bit restart
# delta per chunk sets the whole chunk width. The docs/12 budget of 8
# bits/edge needs patched bitpacking (outlier exceptions); the ceiling
# drops when that encoding lands. Lower ceilings, never raise them.
copy_medges_s = 1.0
bits_per_edge = 25.0
# BFS reorder measures 23.28 bits/edge: ordering is not the bottleneck,
# the per-chunk max width is, because nearly every list holds one low-id
# hub neighbor and one 23-bit delta per 1024-value chunk prices the whole
# chunk. Patched bitpacking is the path to the 8.0 exit gate.
bits_per_edge_bfs = 23.5
