# Decode throughput floors in GB/s of decoded output, single core.
# The M0 exit gate is 1.0 for every encoding (docs/12-implementation-plan.md).
# Floors are set for the slowest gate machine (AMD EPYC vCPU, server1);
# gamingpc numbers run far above them. Raise floors, never lower them.

for_bitpack = 1.0
delta_bitpack = 1.0
delta_patch = 1.0
rle = 1.0
dict = 1.0
bool_bitpack = 1.0
frequency = 1.0
fsst = 1.0
alp = 1.0
alp_rd = 1.0

# The Zstd leaf is the deliberate exception to the 1.0 contract: docs/01
# adopted the cascade precisely so nothing hot needs general-purpose
# compression, and the leaf exists for cold string segments where ratio
# wins over decode speed (docs/04 marks id 11 optional). These floors
# track regressions in the two read paths, libzstd behind the feature
# and the pure Rust ruzstd fallback, sized for the EPYC vCPU hosts.
# Raise floors, never lower them.
zstd = 0.25
zstd_fallback = 0.05

# COPY ingest floors, single core, sort included, parse excluded (B6/B8).
# The density keys are ceilings, not floors, set just above the measured
# LiveJournal numbers with per-chunk MiniBlock cascades: raw order 22.31,
# BFS 21.52. Lower ceilings, never raise them. The 8.0 exit budget from
# docs/12 remains open: patched exceptions removed the outlier tax, but
# in-list gaps on LiveJournal run 16-18 bits even BFS-reordered, because
# BFS frontiers on a social graph are millions wide. Getting under 8
# needs an LLP-class ordering or copy-list compression, both deferred by
# docs/04 section 5.
copy_medges_s = 1.0
bits_per_edge = 22.5
bits_per_edge_bfs = 22.0

# Reverse-direction CSR density ceiling, block bytes over edge count.
# Measured 22.13 raw and 21.34 BFS on all three machines; bwd runs
# slightly denser than fwd because it carries no header or directory
# overhead. Lower this ceiling, never raise it.
bits_per_edge_bwd = 22.3

# Random 1-hop point reads on the loaded LiveJournal file, single core,
# K lookups/s. Each lookup decodes only the chunks holding the node's two
# offsets and its neighbor list. Measured: gamingpc 237, server3 50,
# server1 46; the floor leaves the usual vCPU noise headroom under the
# slowest machine. Raise floors, never lower them.
point_klookups_s = 30.0

# In-neighbor point reads through the bwd CSR. Measured: gamingpc 233,
# server3 44 to 45, server1 46 warm but 4 on the pass where the 383 MB
# dual-direction file no longer fits page cache and the tail goes to the
# virtio disk (p50 stays 16 us, p99 hits 5 ms). The floor sits under that
# cold tail until the reader manages its own memory (B3); it still
# catches a broken point path, which measures well under 1 on every
# machine when it decodes whole groups.
point_in_klookups_s = 2.0

# Random edge probes on the loaded LiveJournal file, single core,
# K probes/s, half present and half near misses. A probe reads two
# offsets and then exactly one neighbor chunk named by the fence array,
# so hub degrees do not move the number. Measured warm: gamingpc 235
# to 243, server3 34 to 62, server1 52 to 62. The 30.0 floor was set
# from warm passes only; server1 then showed the same cold tail the
# point_in floor already documents, 14 to 15 K with p50 steady at 17 us
# and p99 at 1 ms of virtio disk, on the raw-order pass after the bwd
# reads evict the fwd pages from its 850 MB of available memory. Like
# point_in_klookups_s, the floor sits under that cold tail until the
# reader manages its own memory (B3); a broken probe path that decodes
# whole neighbor lists measures well under 1 on every machine.
edge_probe_kprobes_s = 2.0

# Primary-key lookups through the sealed sorted index on the BFS
# reordered LiveJournal file, single core, K lookups/s, three quarters
# hits and one quarter misses above the key domain. A lookup is a fence
# partition point over the cached chunk directory, one key chunk decode,
# a binary search, and one row read. Measured warm: gamingpc 403,
# server1 92, server3 90. But server1 holds 750 MB of free memory
# against the 384 MB file, and on a cold pass the key segments hit the
# virtio disk (p50 stays 12 us, p99 goes to 398 us, throughput 27).
# Like point_in_klookups_s, the floor sits under that cold tail until
# the reader manages its own memory (B3); a broken lookup path that
# scans the key column measures well under 1 on every machine.
key_klookups_s = 20.0

# FullZip string segments over the raw lines of soc-LiveJournal1.txt,
# single core. The scan floor is GB/s of value bytes through the full
# read path, crc and all; the point floor is random single-row reads,
# each a chunk seek through the offset samples plus one chunk decode.
# Measured scan: gamingpc 2.11, server1 0.65; point: gamingpc 200,
# server1 40 with p99 87 us. The floors leave the usual vCPU noise
# headroom under the slowest machine; the 22 MB payload fits page cache
# everywhere, so the cold tail the CSR point floors document does not
# apply here. Raise floors, never lower them. Writer throughput prints
# as information only: FSST trains a fresh table per chunk and that
# cost is a known encoder cost, not a read-path regression signal.
fullzip_scan_gbs = 0.4
fullzip_row_kreads_s = 20.0

# On-disk ratio for the 4 M LiveJournal lines, payload bytes over value
# bytes. FSST training is deterministic, so every machine reading the
# same file lands on the same 0.476; the bench only checks this key on
# the real corpus. Lower this ceiling, never raise it.
fullzip_ratio = 0.48

# LDBC SNB SF1 latency ceilings straight from docs/11, gated by the
# ldbc bench in the facade crate over the real person-knows-person
# graph: 10 K persons, 173 K knows edges, keyed load with the original
# LDBC ids in the primary-key index. B1 is warm 1-hop expands at
# deg <= 100 p50 through the cached-group path, the read the executor's
# Expand makes once a query is warm, timed in batches of 100 because a
# single warm expand sits at timer resolution; the storage point path
# prints as
# information and keeps its own floors on LiveJournal, where server1
# measured it at 12.5 us p50 on this graph. B2 is warm pk lookups p50
# through the sealed index with its decoded-chunk cache; warm means the
# chunk was touched before, and a warm hit is a fence partition point
# plus a binary search. Lower these ceilings, never raise them.
ldbc_hop_p50_us = 10.0
ldbc_key_p50_us = 2.0

# B4, the 2-hop factorized count on SF1 under 10 ms (docs/11, docs/12).
# Three executor changes carry it. The count-to-degree rewrite turns an
# unfiltered count over a trailing expand into degree reads instead of
# 7.6 M materialized second-hop values, and the absorbed source vector
# drops its flatten, so the query is one batched degree sum per
# first-hop vector. Dead rel columns stop materializing, which on this
# query was 173 K Value::Rel per run for an anonymous rel only the
# count ever saw. Measured p50 from the 170 to 670 ms baseline:
# gamingpc 2.8 ms, local M series 3.0 ms, server1 8.6 ms with a p99 of
# 19.9 ms from vCPU steal. server3 runs a sustained background crawl
# holding its 8 vCPUs at load 15 to 31 and measures 11.6 to 13 ms
# under that contention while its idle twin server1 passes, so like
# the cold tails the CSR point floors document, its number is
# information until the box quiets down. Lower this ceiling, never
# raise it.
ldbc_two_hop_p50_ms = 10.0

# The LDBC IS and IC subset on SF1 (docs/12 M2 exit), parse to result
# through zu::query::run against the person props columns the loader
# stores next to the CSR. IS is the IS1-shaped profile read, all eight
# person properties by original id, gated at the G2 1 ms warm p50 from
# docs/02. IC is the IC-shaped friends-of-friends read, 2 hops with
# DISTINCT, string projections, ORDER BY, and LIMIT; its cost is the
# 2-hop multiset's property reads, held down by the per-column decoded
# chunk the props reader keeps, and its p99 belongs to hub seeds whose
# neighborhoods hop across chunks. Measured p50, IS then IC: gamingpc
# 0.13 and 1.4 ms, local M series 0.16 and 1.4 ms, server1 0.38 and
# 4.6 ms. Both loaded hosts fit under the ceilings even mid-contention,
# server2 at 0.59 and 6.1 ms beside a compile job holding load 7.5 on
# 6 cores and server3 at 0.62 and 8.7 ms under its documented crawl,
# so unlike B4 these gates hold fleet-wide. Every measured run asserts
# against a reference recomputed from the raw props and edge files.
# Lower these ceilings, never raise them.
ldbc_is_p50_ms = 1.0
ldbc_ic_p50_ms = 10.0

# B7 exit budget straight from docs/12: a 10 GB file opens in under
# 10 ms, p99 over 1000 warm opens. Open reads 12 KiB of headers plus the
# free list chain and pages everything else lazily, so this catches any
# open path that starts scaling with file size. Gated on gamingpc, the
# host with the disk for the 10 GB build (ZU_B7=1). Lower this ceiling,
# never raise it.
open_p99_ms = 10.0
