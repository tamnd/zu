# What zu declares it can do, for the gql-compat harness.
#
# Generated by `zu conformance --declare`. Do not edit by hand: run
# `ZU_UPDATE_CONFORMANCE=1 cargo test -p zu-cli --test conformance_toml`.
#
# Every entry carries a reason, because a `false` with no reason is
# indistinguishable from a `false` nobody thought about, and the second
# is a bug that reads exactly like a finding.

[engine]
name = "zu"
version = "0.0.1"

# What the storage can hold.
[data]
labels = true  # a node table is a label
multi-label = true  # a node row carries a word with a bit per label, and the table it lives in is the label every row of it carries
node-properties = true  # node tables carry property columns
edge-properties = true  # a rel table carries property columns, addressed by the edge ordinal the load order gives every edge
edge-types = true  # a rel table is an edge type
multiple-edge-types = true  # a graph holds several rel tables
multiple-node-labels = true  # a rel table names the node table at each of its ends, and the two need not be the same one
temporal-values = true  # dates, local times and durations ride their own lanes, declared across the sqlite staging hop
list-values = true  # a list column holds one element type, staged as a JSON array in a text column
null-properties = true  # a column is dense either way and carries validity words saying which of its rows hold a value
float-values = true  # float columns ride the fixed width lane as their IEEE bits
boolean-values = true  # boolean columns ride the lane, declared BOOLEAN across the sqlite staging hop
undirected-edges = true  # a rel table says whether its edges have a direction, and both stored lists answer for one that has none
self-loops = true  # the converter reads endpoints through, so an edge to itself survives
parallel-edges = true  # a second edge over the same ordered pair survives
parallel-edge-properties = true  # an edge property is addressed by the ordinal the match bound, not by searching the forward list for the destination, so two edges over one pair carry their own values

# What the session and the wire protocol can do.
[capabilities]
gqlstatus = true  # every reply carries a code from the ISO conditions artifact
parameters = true  # the shell takes a params object and prepare reports its names
transactions = true  # START TRANSACTION, COMMIT and ROLLBACK run across statements on a session
multiple-statements = true  # one shell process runs a case's setup list in order
isolated = true  # a reset is a statement on the running session, so a case starts on a graph the case before it did not write to

# Printed verbatim beside zu's numbers in the report.
notes = [
  "driven through `zu shell --format jsonl`, one long-lived process per session",
  "loaded through `zu convert`, which reads a SQLite database in zu's schema",
  "the evaluator is MATCH WHERE FILTER LET FOR CALL UNWIND WITH RETURN, plus INSERT of node patterns and of edges between the elements a statement has in scope, SET and REMOVE of properties and of labels, and DELETE and DETACH DELETE of elements, so a case that writes anything else is answered with an error rather than a skip",
  "several statements chain with NEXT, and what one hands the next is the result it returned and nothing else it had in hand, so a variable the statement before it matched is out of scope behind the NEXT; the chain runs as one pipeline rather than materialising a table between statements",
  "two result tables meet with UNION, EXCEPT or INTERSECT in both their forms, ALL keeping every copy and DISTINCT keeping one, and leaving the quantifier out means DISTINCT; the conjunctions are all at one level and fold to the left, so there is no precedence between UNION and INTERSECT, and EXCEPT and INTERSECT hold whichever operand the planner estimates fewer rows for and stream the other past it",
  "OTHERWISE answers the left operand, and runs the right one only when the left answered no rows at all",
  "the operands of a conjunction have to have the same columns, in the same order and under the same names, and neither of them may write, because how many times a write ran would otherwise depend on which operand the planner chose to hold",
  "a FILTER keeps the rows its condition holds for and has no pattern under it, so it reads what the statement already has, including what a NEXT handed it, and the WHERE the standard allows after the word is optional and says nothing more",
  "a LET names values and takes no name away, which is what makes it a LET rather than a WITH, and the definitions read left to right so a later one may use a name an earlier one in the same statement gave; the name is a variable, so LET of a property is refused with the statement that does change a property named",
  "a projection holding an aggregate groups by the items that are not aggregates, and GROUP BY says that same grouping out loud, so the keys and the non-aggregate items have to be the same: an item the grouping does not fix has no one value in a group and a key the projection does not carry leaves no column saying which group a row is, and both are refused by name rather than answered with a row of the group picked arbitrarily",
  "a page of a result is written OFFSET and LIMIT, and SKIP is the synonym the standard names for OFFSET, so the two words are one clause and writing both of them is refused rather than skipping twice",
  "a FOR makes a row of every element of a list, which is the same statement UNWIND is and the spelling the standard gives it, and WITH ORDINALITY or WITH OFFSET numbers those rows, from one and from zero; the number counts the elements of the list rather than the rows the statement has answered, so a FOR under a match starts again at each row that reaches it",
  "a block of match statements stands wherever one does: an EXISTS takes one and asks whether it answered a row, and an OPTIONAL takes one and keeps what it answered. The statements of a block are all required and they share the names they write, so a block is one conjunction and the same thing the commas of a single statement are; under an OPTIONAL it is also one operand, so a block that matches half of itself matches none of it and every name it writes reads null",
  "an INSERT runs once for every row the clauses before it answered, and the clauses after it read the rows it wrote rather than the store, so a MATCH followed by an INSERT writes one element per row the match answered",
  "an edge carries properties the way an element does, so a written edge holds one value for every column its table stores, and an edge written into a table that stores none on its edges is refused by name rather than dropping what it carried",
  "a SET changes what an element an earlier clause found holds, one row at a time, and the clauses after it read the new value; a property of a node, a property of an edge and the whole record of either are all reachable, and the record form empties every property it does not name",
  "SET and REMOVE of a label change the bit the label is in the row's label word, so a pattern naming that label finds the row afterwards; a label the row's table has not declared is declared by the SET that puts it on, published with the rows the statement changed and undone with them, while the name of the table is the label every row of it carries rather than one a statement puts on or takes off",
  "a REMOVE is the assignment of a null the standard says it is, so it and SET of a null are one write and a column holds the absence as a clear validity bit",
  "a DELETE takes away the element an earlier clause found, a DETACH DELETE takes its edges with it, and a plain DELETE of an element that still has edges on it is refused with the code the standard gives that rather than leaving a dangling edge",
  "a delete item is a variable an earlier clause bound or a query answering the element, written VALUE and the query in braces, and the query runs on its own against the same graph, so it reads the store rather than the variables around it and has to answer one row of one column because one item takes away one element",
  "an element is created in the node table whose own name is the label the pattern wrote, and a label no node table is named by makes one, out of the properties the pattern writes and under the savepoint the statement holds, so a property written as a value that has to be worked out first is refused rather than guessed at",
  "an edge type no rel table is named by makes one as well, between the node tables the two ends of the step are in, and an end nothing gives a label to is refused rather than guessed at because a rel table has to have both of its ends",
  "a graph with a closed graph type is checked at the write rather than at the read, so a label change that would leave an element carrying a label set no element type of that graph type describes is refused with the code the standard gives that, naming the row and the set it would have carried, and a label that names no node table makes no table in such a graph because the type already says what the graph holds",
  "the limits a write can reach are declared and finite rather than absent, so a statement that asks for more than one of them is told the standard's answer for hitting that limit rather than a general failure: a node carries between one label and 64 of them, an edge carries the one label its rel table is named by, and an element or an edge carries up to 4096 properties",
  "assigning to the same property of one element twice in one SET is refused, because an element holds one value per property and the clause has not said which of the two it wants, while two SET clauses in a row stay last wins",
  "an element an earlier clause found and a DELETE in the same statement took away is gone for the clauses after it, so reading a property off it and writing an edge onto it are both refused by name rather than reading what the row used to hold",
  "a protocol fault, a malformed frame or an unknown op, reports no GQLSTATUS on purpose and is scored on its message",
]
