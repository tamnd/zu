schema: 4
suite: wrong
doc: Cases the engine does not answer the way they say, so that the two runners can be compared on what they say when a case fails. The corpus itself passes, which is the point of it and also why it can never show this. These are not corpus cases and are not packed with them; they live beside the C runner because they are a test of the C runner.

cases:
  - name: wrong-value
    doc: A case asserting the wrong answer, which is the failure a report has to be most precise about, since it names the row, the column and both values.
    query: RETURN 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 2

  - name: wrong-column-name
    doc: The projected name is part of the answer, and a report that said the value was wrong would send somebody looking in the wrong place.
    query: RETURN 1 AS n
    columns:
      - m
    rows:
      - values:
          - type: INT8
            value: 1

  - name: too-many-rows
    doc: Two rows where the case writes one. A runner that compared what it was given and stopped would call this a pass.
    query: UNWIND [1, 2] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1

  - name: too-few-rows
    doc: The same thing the other way round, where the engine gives back less than the case asked for.
    query: UNWIND [1] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1
      - values:
          - type: INT8
            value: 2

  - name: wrong-condition
    doc: A statement that raises, against a case naming a condition it does not raise. The code is the contract, so the two have to be compared and not merely counted.
    query: RETURN 1 / 0
    raises: 22003

  - name: no-condition-at-all
    doc: A statement that returns rows, against a case saying it raises. Rows where a condition was expected is a failure and not an unexpected pass.
    query: RETURN 1 AS n
    raises: 22012

  - name: wrong-bound-value
    doc: A case whose parameter arrives intact and whose answer is still wrong, so the report says the value the statement gave back and not the one that was bound.
    params:
      - name: n
        type: INT64
        value: "1"
    query: RETURN $n AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: wrong-node
    doc: A case naming the wrong row of the right table, which is the graph value a report has to print as a name and an offset rather than as whatever the engine holds inside.
    setup:
      - "INSERT (:thing {n: 1})"
    query: MATCH (n:thing) RETURN n
    columns:
      - n
    rows:
      - values:
          - type: NODE
            value: "thing#1"

  - name: wrong-arrow-type
    doc: A case whose rows are right and whose export is not, which is the failure the `arrow:` key exists to catch, and the one a report has to name the column and both format strings for.
    query: RETURN 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1
    arrow:
      - name: n
        format: g

  - name: wrong-arrow-field-name
    doc: The same thing one level down, so that the two runners are compared on how they point at a field inside a column rather than only on a column.
    query: RETURN [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
    arrow:
      - name: n
        format: "+l"
        children:
          - name: element
            format: l

  - name: an-export-that-was-not-refused
    doc: A case saying Arrow has no type for the result, against a result Arrow exports. A runner that read a refusal as permission to skip the check would call this a pass.
    query: RETURN 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1
    arrow: refused

  - name: a-wrong-answer-on-another-connection
    doc: A case whose write and whose read are on different connections and whose count is wrong anyway, so the two runners are compared on a report from a connection neither of them opened the case with.
    setup:
      - on: writer
        query: "INSERT (:thing {n: 1})"
    on: reader
    query: MATCH (t:thing) RETURN count(t) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-setup-that-fails-on-another-connection
    doc: A setup statement that raises, written in the form that names the connection it runs on. The report says which setup statement and what it raised, and it says it the same way whichever connection the statement was on.
    setup:
      - on: writer
        query: RETURN 1 / 0
    on: writer
    query: RETURN 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1

  - name: ahead-of-the-engine
    doc: A statement this engine does not implement, which is the third outcome and neither of the other two.
    query: MERGE (n:person)
    columns:
      - n
    rows:
