schema: 4
suite: aggregate
doc: The set functions, which are where a type changes on the way through: a count is an integer whatever it counted, an average is a float whatever it averaged, and a sum is neither reliably. They are also the one place in the language where a null does not propagate, and the empty input is where each of them chooses separately between zero and null.

cases:
  - name: count-of-rows
    doc: Counting rows rather than a value, which is the form that has no argument to be null and so no reason ever to disagree with the number of rows.
    query: UNWIND [1, 2, 3] AS n RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: count-of-a-value
    doc: Counting a column counts the rows where it is not null, which is the same number here and is a different question, as the two cases below show.
    query: UNWIND [1, 2] AS n RETURN count(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: count-of-a-value-skips-nulls
    doc: A null row is counted by the star and not by the column, which is the difference between the two forms written in one statement so a client cannot pass by implementing one of them twice.
    query: UNWIND [null] AS n RETURN count(*) AS a, count(n) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: INT64
            value: "1"
          - type: INT64
            value: "0"

  - name: count-with-no-rows
    doc: Counting nothing is zero and not null, which is the one set function whose empty answer everybody agrees on and the baseline the others are compared against.
    query: UNWIND [] AS n RETURN count(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: count-with-no-input-at-all
    doc: A set function with no rows under it still produces one row, because a statement that groups by nothing has one group. A client that returns no rows here has confused an empty group with no group.
    query: RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: count-distinct
    doc: DISTINCT inside a set function counts values rather than rows, which is a different number from the one above whenever anything repeats.
    query: UNWIND [1, 2, 2] AS n RETURN count(DISTINCT n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: sum
    doc: A sum of integers is an integer, so a client whose accumulator is a double gives back a float and every later comparison against it is a comparison of a different type.
    query: UNWIND [1, 2, 3] AS n RETURN sum(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "6"

  - name: sum-stays-exact-past-a-double
    doc: A sum whose answer is past where a double is exact stays exact, which is the case that catches the client from the case above, because 9007199254740994 is a number a double cannot hold.
    query: UNWIND [9007199254740993, 1] AS n RETURN sum(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "9007199254740994"

  - name: sum-skips-nulls
    doc: A null is left out rather than making the whole sum null, which is the rule that separates a set function from every operator in the language. The engine raises a warning saying it happened, which this corpus does not check and a client should surface.
    query: UNWIND [1, null] AS n RETURN sum(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: sum-with-no-rows
    doc: A sum of nothing is zero, and this is the choice that differs from the average below. A client that has one empty answer for all its set functions gets one of the two wrong.
    query: UNWIND [] AS n RETURN sum(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: sum-distinct
    doc: DISTINCT under a sum adds each value once, so the repeated 1 here is added once and the answer is 3 rather than 4.
    query: UNWIND [1, 1, 2] AS n RETURN sum(DISTINCT n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: sum-refuses-text
    doc: A sum of strings raises rather than concatenating them, even though the plus operator on two strings does concatenate. The set function and the operator are separate and this is where they part.
    query: UNWIND ['a', 'b'] AS n RETURN sum(n) AS c
    raises: "22G03"

  - name: average-is-a-float
    doc: An average of integers whose answer is a whole number is still a float. A client giving back an integer has changed the column's type on a value that happened to divide evenly, which means the type of the column depends on the data.
    query: UNWIND [1, 2, 3] AS n RETURN avg(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "2.0"

  - name: average-of-a-fraction
    doc: The same function where the answer is not whole, which is the case a client truncating to an integer fails and the case above hides.
    query: UNWIND [1, 2] AS n RETURN avg(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "1.5"

  - name: average-skips-nulls
    doc: A null is left out of both the total and the count, so this is 1 and not the half a client dividing by the number of rows would give.
    query: UNWIND [1, null] AS n RETURN avg(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "1.0"

  - name: average-with-no-rows
    doc: An average of nothing is null and not zero, because there is no such number, and this is the case that says a client cannot use one empty answer for every set function.
    query: UNWIND [] AS n RETURN avg(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: NULL

  - name: minimum
    doc: The smallest value, which keeps the type of what it selected rather than becoming a number of its own.
    query: UNWIND [1, 2, 3] AS n RETURN min(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: maximum
    doc: The other end, written separately because a client implementing one in terms of the other has to have reversed the comparison and not the result.
    query: UNWIND [1, 2, 3] AS n RETURN max(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: minimum-of-text
    doc: The smallest string, by the code point order the string suite pins, which says these two functions work on anything that compares and not only on numbers.
    query: UNWIND ['a', 'b'] AS n RETURN min(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: STRING
            value: a

  - name: minimum-skips-nulls
    doc: A null is not the smallest value even though it sorts after everything, because it is left out before the comparison rather than taking part in it.
    query: UNWIND [1, null] AS n RETURN min(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: minimum-with-no-rows
    doc: The smallest of nothing is null, which is the third empty answer in this suite and the second of the three shapes: zero for a count and a sum, null for an average and an extreme, an empty list for a collection.
    query: UNWIND [] AS n RETURN min(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: NULL

  - name: collect
    doc: Rows back into one list, in the order they arrived, which makes it the only set function whose answer depends on the order of its input.
    query: UNWIND [1, 2, 3] AS n RETURN collect(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
              - type: INT64
                value: "3"

  - name: collect-keeps-the-input-order
    doc: The same function on rows that are not sorted, which gives them back unsorted. A client that sorts what it collects passes the case above and fails this one.
    query: UNWIND [2, 1] AS n RETURN collect(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "2"
              - type: INT64
                value: "1"

  - name: collect-skips-nulls
    doc: A collected list has no nulls in it, which means its size is not the number of rows, and a client pairing a collected list against another column positionally is pairing the wrong things.
    query: UNWIND [1, null] AS n RETURN collect(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"

  - name: collect-with-no-rows
    doc: A collection of nothing is an empty list and not a null, the third of the three empty answers, and the one where a null would be indistinguishable from a column that was never computed.
    query: UNWIND [] AS n RETURN collect(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:

  - name: collect-distinct
    doc: DISTINCT under a collection keeps one of each, in the order each was first seen.
    query: UNWIND [1, 1, 2] AS n RETURN collect(DISTINCT n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"

  - name: grouping
    doc: Everything returned beside a set function is a grouping key, which is implicit rather than written, and is where a client generating statements from a query builder is most likely to produce something that means a different thing from what it meant to say.
    query: UNWIND [1, 2, 3, 4] AS n WITH n % 2 AS k, n RETURN k, count(n) AS c ORDER BY k
    columns:
      - k
      - c
    rows:
      - values:
          - type: INT64
            value: "0"
          - type: INT64
            value: "2"
      - values:
          - type: INT64
            value: "1"
          - type: INT64
            value: "2"

  - name: one-group-per-distinct-key
    doc: Keys that repeat nowhere give a row each and a count of one, which is the degenerate grouping and the one that looks like no grouping happened.
    query: UNWIND [1, 2] AS n RETURN n, count(*) AS c ORDER BY n
    columns:
      - n
      - c
    rows:
      - values:
          - type: INT64
            value: "1"
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "2"
          - type: INT64
            value: "1"

  - name: filtered-before-aggregating
    doc: A condition before the set function reduces what it sees, so this counts what passed and not what arrived, which is the ordinary reading and is worth one case because the other reading is a plausible optimisation.
    query: UNWIND [1, 2, 3] AS n WITH n WHERE n > 1 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: aggregated-then-used
    doc: A collected list is a value like any other and can be measured, which is what makes the aggregation a step in the statement rather than the end of it.
    query: UNWIND [1, 2, 3] AS n WITH collect(n) AS c RETURN size(c) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: collect-list-is-the-standard-name
    doc: COLLECT_LIST is what ISO 20.9 calls the function COLLECT is openCypher's name for, and both spellings reach it. A client that implements only the short name fails here and a client that implements only the long one fails every collect case above.
    query: UNWIND [1, 2, 3] AS n RETURN collect_list(n) AS c
    columns:
      - c
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
              - type: INT64
                value: "3"

  - name: the-set-quantifier-all-is-the-default-written-down
    doc: ALL is the other set quantifier the standard allows and it means what leaving the quantifier out means, so these two columns are the same number. A client that refuses the word fails a query that is only being explicit.
    query: UNWIND [1, 1, 2] AS n RETURN count(ALL n) AS a, count(n) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: INT64
            value: "3"
          - type: INT64
            value: "3"

  - name: standard-deviation-of-a-sample
    doc: The sample deviation of the eight values every textbook uses, which divides the squared deviations by one less than the count. The digits are given in full because an engine computing this from the sum of squares agrees to about six of them and then does not.
    query: UNWIND [2, 4, 4, 4, 5, 5, 7, 9] AS n RETURN stddev_samp(n) AS s
    columns:
      - s
    rows:
      - values:
          - type: FLOAT64
            value: "2.138089935299395"

  - name: standard-deviation-of-a-population
    doc: The same eight values divided by the count rather than one less, which is the whole of the difference between the two functions and is the case that catches a client that implements one of them twice.
    query: UNWIND [2, 4, 4, 4, 5, 5, 7, 9] AS n RETURN stddev_pop(n) AS p
    columns:
      - p
    rows:
      - values:
          - type: FLOAT64
            value: "2.0"

  - name: standard-deviation-of-one-value
    doc: One value is a population sitting on its own mean, which is a deviation of nought, and is no sample of a spread at all, which is null. The two divisors say so and neither is a special case, but they are the pair a client is most likely to get wrong in the same direction.
    query: UNWIND [7] AS n RETURN stddev_samp(n) AS s, stddev_pop(n) AS p
    columns:
      - s
      - p
    rows:
      - values:
          - type: NULL
          - type: FLOAT64
            value: "0.0"

  - name: standard-deviation-with-no-rows
    doc: Neither deviation has an answer for no values, so both are null rather than nought, which is the fourth of the empty answers and the only one the two spellings agree on.
    query: UNWIND [] AS n RETURN stddev_samp(n) AS s, stddev_pop(n) AS p
    columns:
      - s
      - p
    rows:
      - values:
          - type: NULL
          - type: NULL

  - name: standard-deviation-skips-nulls
    doc: A null is left out of the count as well as the total, so this is the deviation of two values and not of three, the same rule the average follows.
    query: UNWIND [2, null, 4] AS n RETURN stddev_pop(n) AS p
    columns:
      - p
    rows:
      - values:
          - type: FLOAT64
            value: "1.0"

  - name: standard-deviation-distinct
    doc: DISTINCT under a deviation measures the spread of the values rather than of the rows, which is a different number whenever anything repeats and is here the same number only because two of these three are equal.
    query: UNWIND [2, 2, 4] AS n RETURN stddev_pop(DISTINCT n) AS p
    columns:
      - p
    rows:
      - values:
          - type: FLOAT64
            value: "1.0"

  - name: standard-deviation-refuses-text
    doc: A deviation of strings raises rather than measuring their lengths or their order, the same refusal the sum gives and for the same reason.
    query: UNWIND ['a', 'b'] AS n RETURN stddev_pop(n) AS p
    raises: "22G03"

  - name: percentile-cont-of-an-even-count
    doc: The median of four values under the continuous percentile, which falls between the second and the third and is answered by the point on the line between them. The answer is a number that is not in the input, which is the whole difference between this function and the one below.
    query: UNWIND [1, 2, 3, 4] AS n RETURN percentile_cont(n, 0.5) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "2.5"

  - name: percentile-disc-of-an-even-count
    doc: The same median under the discrete percentile, which answers the first value whose share of the group reaches the fraction. That is a value that was there and it comes back with the type it had, so this column is an integer where the one above is a float.
    query: UNWIND [1, 2, 3, 4] AS n RETURN percentile_disc(n, 0.5) AS d
    columns:
      - d
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: percentile-of-the-ends
    doc: A fraction of nought is the smallest value and a fraction of one is the largest, under both functions, which is where the two have to agree and is the pair that catches an off by one in either.
    query: UNWIND [1, 2, 3, 4] AS n RETURN percentile_cont(n, 0.0) AS a, percentile_cont(n, 1.0) AS b, percentile_disc(n, 0.0) AS c, percentile_disc(n, 1.0) AS d
    columns:
      - a
      - b
      - c
      - d
    rows:
      - values:
          - type: FLOAT64
            value: "1.0"
          - type: FLOAT64
            value: "4.0"
          - type: INT64
            value: "1"
          - type: INT64
            value: "4"

  - name: percentile-that-lands-on-a-value
    doc: A quarter of the way through five values lands on the second one exactly, so nothing is interpolated and both functions answer it, one as a float and one as the integer it was.
    query: UNWIND [1, 2, 3, 4, 5] AS n RETURN percentile_cont(n, 0.25) AS c, percentile_disc(n, 0.25) AS d
    columns:
      - c
      - d
    rows:
      - values:
          - type: FLOAT64
            value: "2.0"
          - type: INT64
            value: "2"

  - name: percentile-ignores-the-order-of-the-rows
    doc: A percentile is about the values and not about the order they arrived in, so shuffling the input does not move it. A client that reads the rows positionally rather than sorting them fails this and passes every case above.
    query: UNWIND [4, 1, 3, 2] AS n RETURN percentile_cont(n, 0.5) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "2.5"

  - name: percentile-skips-nulls
    doc: A null is not a value at the bottom of the order, it is not a value at all, so this is the median of two numbers and not of three things.
    query: UNWIND [1, null, 3] AS n RETURN percentile_cont(n, 0.5) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "2.0"

  - name: percentile-with-no-rows
    doc: No values is no percentile, so both answer null rather than nought, which is the same choice the deviations make and the opposite of the one the count makes.
    query: UNWIND [] AS n RETURN percentile_cont(n, 0.5) AS c, percentile_disc(n, 0.5) AS d
    columns:
      - c
      - d
    rows:
      - values:
          - type: NULL
          - type: NULL

  - name: percentile-of-a-null-fraction
    doc: A fraction of null is a question with nothing asked in it, which is null and not an error, the same reading every other null argument gets.
    query: UNWIND [1, 2, 3] AS n RETURN percentile_cont(n, null) AS c
    columns:
      - c
    rows:
      - values:
          - type: NULL

  - name: percentile-refuses-a-fraction-past-one
    doc: The fraction is a fraction, so a number outside nought to one is out of range rather than clamped to the nearest end. A client that clamps answers the largest value here and is wrong quietly.
    query: UNWIND [1, 2, 3] AS n RETURN percentile_cont(n, 1.5) AS c
    raises: "22003"

  - name: percentile-refuses-a-negative-fraction
    doc: The other end of the same rule, written down because clamping to nought is the more tempting of the two mistakes.
    query: UNWIND [1, 2, 3] AS n RETURN percentile_disc(n, -0.5) AS d
    raises: "22003"

  - name: percentile-refuses-text
    doc: Both arguments are numbers, so a column of strings has no percentile, the same refusal the sum and the deviations give.
    query: UNWIND ['a', 'b'] AS n RETURN percentile_cont(n, 0.5) AS c
    raises: "22G03"

  - name: percentile-distinct
    doc: DISTINCT under a percentile measures the values rather than the rows, so the repeated ones count once and the median moves. Without the quantifier this is the median of five and with it the median of three.
    query: UNWIND [1, 1, 2, 2, 3] AS n RETURN percentile_cont(DISTINCT n, 0.5) AS c
    columns:
      - c
    rows:
      - values:
          - type: FLOAT64
            value: "2.0"

  - name: sorted-by-a-count-no-column-carries
    doc: A sort key of ISO 14.9 is an expression, so a set function may stand in one, and it means there what it means in a returned item: the rows group by everything else the statement answers and the key is read once per group. Nothing here carries the count, so a client that only accepts a set function where a column will hold it answers three rows in the order they arrived.
    query: UNWIND ['a', 'a', 'a', 'b', 'c', 'c'] AS t RETURN t ORDER BY count(*) DESC
    columns:
      - t
    rows:
      - values:
          - type: STRING
            value: a
      - values:
          - type: STRING
            value: c
      - values:
          - type: STRING
            value: b

  - name: sorted-by-an-expression-over-a-count
    doc: The key is the whole expression and not a call standing on its own, so the arithmetic runs on what the group answered. A client that matches sort keys against the returned items by their text finds nothing to match here and has to work the count out for itself.
    query: UNWIND ['a', 'a', 'a', 'b', 'c', 'c'] AS t RETURN t, count(*) AS c ORDER BY count(*) * -1 ASC
    columns:
      - t
      - c
    rows:
      - values:
          - type: STRING
            value: a
          - type: INT64
            value: "3"
      - values:
          - type: STRING
            value: c
          - type: INT64
            value: "2"
      - values:
          - type: STRING
            value: b
          - type: INT64
            value: "1"

  - name: sorted-by-a-sum-of-a-column
    doc: The star is the easy form because it needs no argument, so the same question is asked of a set function that reads one: the argument is a row's and the sum is a group's, which is the one place behind a grouping where a name is still read once per row.
    query: UNWIND [1, 2, 2] AS n RETURN n % 2 AS parity ORDER BY sum(n) DESC
    columns:
      - parity
    rows:
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "1"
