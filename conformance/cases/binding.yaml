schema: 4
suite: binding
doc: The binding variable definition block, ISO 13.3, which is the head a statement may carry naming things no row does. A definition stands for a value, a binding table or a graph, and it is worked out once, before the first row, in the order the definitions are written. That ordering is what most of these cases are about, because it is the difference between a name and an expression written out longhand: a name read in a hundred rows costs one evaluation, and a definition may read the ones in front of it and nothing that comes after. The fixture is the procedure suite's, four people and three edges with one running from a node to itself, so a count here can be read beside a count there.

load:
  nodes: person
  edges: knows
  count: 4
  columns:
    - name: name
      type: STRING
      values:
        - ann
        - bo
        - cy
        - di
    - name: age
      type: INT64
      values:
        - "30"
        - "40"
        - "50"
        - "40"
  pairs:
    - from: 0
      to: 1
    - from: 1
      to: 2
    - from: 3
      to: 3

cases:
  - name: a-value-variable-is-a-name-for-a-value
    doc: The simplest definition there is, read where a value goes. One row comes back because nothing was matched, which is also what says a definition is not a source of rows the way a clause is.
    query: VALUE n = 20 + 2 RETURN n AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "22"

  - name: a-value-variable-read-more-than-once
    doc: A name read twice in one expression is the same value twice, which is what worked out once means when it is said about an expression that has no graph in it. Nothing here can tell the two readings apart, and that is the point: the case is here so that an engine which evaluated the definition per reading would still have to answer this.
    query: VALUE n = 21 RETURN n + n AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "42"

  - name: a-value-variable-read-against-the-graph
    doc: A definition read in a predicate, which is where a value worked out per row rather than once would show up as work rather than as a wrong answer. Three of the four people are over the cut.
    query: VALUE cut = 35 MATCH (p:person) WHERE p.age > cut RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-definition-reads-the-ones-in-front-of-it
    doc: The block is a block and not a list of unrelated names, so a definition may read the ones written before it. That is also what fixes the order they are worked out in.
    query: VALUE a = 7 VALUE b = a * 6 RETURN b AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "42"

  - name: a-value-variable-defined-out-of-a-query
    doc: GP07. What stands after the equals may be a whole query, so a definition may match, aggregate and page, and it is still worked out once. The oldest person is fifty, which is one row of one column and therefore one value.
    query: "VALUE oldest = { MATCH (p:person) RETURN max(p.age) AS a } MATCH (p:person) WHERE p.age = oldest RETURN p.name AS x"
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: cy

  - name: a-value-variable-out-of-a-query-read-per-row
    doc: The same definition read once per row, which is the shape a reader writes when they want a whole table measured against one number the table itself decided. Every row reads the same fifty and the arithmetic is done against it.
    query: "VALUE oldest = { MATCH (p:person) RETURN max(p.age) AS a } MATCH (p:person) RETURN p.name AS x, oldest - p.age AS d ORDER BY x"
    columns:
      - x
      - d
    rows:
      - values:
          - type: STRING
            value: ann
          - type: INT64
            value: "20"
      - values:
          - type: STRING
            value: bo
          - type: INT64
            value: "10"
      - values:
          - type: STRING
            value: cy
          - type: INT64
            value: "0"
      - values:
          - type: STRING
            value: di
          - type: INT64
            value: "10"

  - name: a-binding-table-variable-holds-rows
    doc: GP08. A binding table variable is the whole result of a query held as one value, and CARDINALITY is how many rows that is. BINDING is a word the definition may carry and neither reading needs.
    query: "BINDING TABLE t = { MATCH (p:person) RETURN p.name AS name } RETURN cardinality(t) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-binding-table-variable-run-over
    doc: GP10. The other thing a table is for: running over its rows. Three people are over the cut and the FOR answers a row for each.
    query: "TABLE t = { MATCH (p:person) WHERE p.age > 35 RETURN p.name AS name } FOR r IN t RETURN count(*) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-binding-table-variable-that-names-another
    doc: GP09. A definition may read the ones in front of it, so a binding table variable defined as another binding table variable is that table and not a one row table holding it. The FOR runs over the rows either way, which is what makes this worth a case: an engine that wrapped the value would answer one row here rather than three, and every other reading of the name would still look right.
    query: "BINDING TABLE t = { MATCH (p:person) WHERE p.age > 35 RETURN p.name AS name } BINDING TABLE again = t FOR r IN again RETURN count(*) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-binding-table-variable-defined-with-something-else
    doc: A definition written as an expression stands for whatever the expression is, and the name is going to be read as a table, so an expression that is not one is refused where it is written rather than at the first reader. The nested query form is the one that turns rows into a table and this is not it.
    query: "BINDING TABLE t = 1 + 1 RETURN cardinality(t) AS a"
    raises: "22G03"

  - name: a-graph-variable-is-a-reference
    doc: GP11. A graph variable names a graph and what it holds is a reference to one rather than the graph itself, which is why it can be a value at all. The graph named here is the one the session is working in.
    query: GRAPH g = CURRENT_PROPERTY_GRAPH RETURN (g IS NOT NULL) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-graph-variable-a-use-names
    doc: GP12. What a graph variable is for is standing where a graph reference stands, and the plainest of those places is the USE clause. The clause is written behind the definitions here because that is the only place it can be written when it reads one of them, and ISO puts it there: the graph clause belongs to the statement and the definitions are the head in front of it.
    query: PROPERTY GRAPH g = CURRENT_PROPERTY_GRAPH USE g MATCH (p:person) RETURN count(p) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-graph-variable-that-names-another
    doc: GP12. A definition may read the ones in front of it whatever it defines, so a graph variable defined as another graph variable is the graph that one names. Nothing here can tell one name from two, and that is the point: the case is here so that an engine which resolved only the first name would still have to answer this.
    query: GRAPH a = CURRENT_PROPERTY_GRAPH GRAPH b = a USE b MATCH (p:person) RETURN count(p) AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-graph-variable-defined-by-a-query-that-returns-a-reference
    doc: GP13. A graph expression may be a value query, and a query has not run when the graph the statement compiles against is settled, so the general case is refused. This one is not the general case: a body that is a bare RETURN of a graph reference answers what the reference answers and says so in the text, so it is read where a reference is read and the USE below it works. The case is here to fix which queries count, because the answer is the shape and not the engine's mood.
    query: "PROPERTY GRAPH g = VALUE { RETURN CURRENT_PROPERTY_GRAPH } USE g MATCH (p:person) RETURN count(p) AS x"
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-graph-variable-defined-by-a-query-with-a-clause-in-it
    doc: The line the case above draws, from the other side. A query with a clause in it answers what the rows say rather than what the text says, so it is settled when the definition runs and the USE that reads it is refused.
    query: "PROPERTY GRAPH g = VALUE { UNWIND [1] AS n RETURN CURRENT_PROPERTY_GRAPH } USE g MATCH (p:person) RETURN count(p) AS x"
    raises: "42001"

  - name: a-graph-variable-a-use-names-defined-out-of-a-query
    doc: Which graph a statement runs against is settled before the statement is compiled, the schema of that graph being what the names in it are bound against, so a definition a USE reads has to answer while the text is being read. A query has not run by then, and compiling against one graph and running against another is worse than a refusal.
    query: "PROPERTY GRAPH g = { RETURN 1 AS a } USE g MATCH (p:person) RETURN count(p) AS x"
    raises: "42001"

  - name: a-use-in-front-of-the-definitions-and-behind-them
    doc: A statement runs against one graph, so it names one once. Both places are places a USE may be written, and writing one in each is refused rather than one of them being read and the other dropped.
    query: USE CURRENT_PROPERTY_GRAPH GRAPH g = HOME_PROPERTY_GRAPH USE g MATCH (p:person) RETURN count(p) AS x
    raises: "42001"

  - name: a-definition-written-with-the-type-it-answers
    doc: A definition may be written with a type, which is a statement about what the query is going to answer and is checked against the answer. It is the same decision IS TYPED makes, so a type means one thing wherever it is written.
    query: "VALUE oldest INT = { MATCH (p:person) RETURN max(p.age) AS a } RETURN oldest AS x"
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "50"

  - name: a-definition-written-with-a-double-colon-separator
    doc: GP06. The standard writes the separator between the name and the type two ways and lets the type be written with neither, so all three spellings are one definition. The colons are the spelling a client that also speaks a type system elsewhere is likely to reach for.
    query: "VALUE oldest :: INT = { MATCH (p:person) RETURN max(p.age) AS a } RETURN oldest AS x"
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "50"

  - name: a-definition-written-with-the-typed-word
    doc: The other spelling of the same separator, which is the one the standard writes out in words. It says what the colons say, so the type it carries is checked the same way and the answer is the same answer.
    query: "VALUE oldest TYPED INT = { MATCH (p:person) RETURN max(p.age) AS a } RETURN oldest AS x"
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "50"

  - name: a-value-variable-returned-as-a-column
    doc: GP05. A definition is worked out once and reading the name is reading what it answered, wherever the name is read. A projection is the plainest place to read one and the place where an engine that never worked the definition out would answer null instead, so the value goes out beside a column of the graph to say the row carries both.
    query: "VALUE cut = 45 MATCH (p:person) WHERE p.age > cut RETURN cut AS x, p.name AS y ORDER BY y"
    columns:
      - x
      - y
    rows:
      - values:
          - type: INT64
            value: "45"
          - type: STRING
            value: cy

  - name: a-definition-that-does-not-answer-its-type
    doc: The declared type turning out to be wrong is a condition about a value and not about the text, so it is a data exception rather than a syntax one, and it is raised where the value was worked out rather than where the name is read.
    query: VALUE n STRING = 1 + 1 RETURN n AS x
    raises: "22G03"

  - name: a-definition-that-answers-more-than-one-column
    doc: A value variable stands for one value, so what defines it has to answer one column. Two columns is a definition that cannot be read, and it is refused where it is written rather than at the first reader.
    query: "VALUE v = { MATCH (p:person) RETURN p.name AS a, p.age AS b } RETURN v AS x"
    raises: "42001"

  - name: a-definition-that-writes
    doc: A statement taken apart at its write runs in parts, and each part fills the parameter positions it reads, so a definition that wrote would write once per part. Reading a graph twice answers the same thing and writing to it twice does not, so a definition that writes is refused.
    query: "VALUE n = { INSERT (x:person) RETURN 1 AS a } RETURN n AS x"
    raises: "42001"

  - name: a-name-defined-twice
    doc: A definition is worked out once, so a second definition of the same name would have nothing to say and no way to be read. The statement parses, so this is a reference condition and not a syntax one.
    query: VALUE v = 1 VALUE v = 2 RETURN v AS x
    raises: "42002"

  - name: a-definition-that-reads-a-row
    doc: A definition is worked out before anything has been matched, so there is no row for it to read, and a definition inside a block may not reach for the row the block is running for either.
    query: "MATCH (p:person) CALL (p) { VALUE mine = p.age RETURN mine AS a } RETURN count(*) AS n"
    raises: "42002"

  - name: a-block-defines-names-of-its-own
    doc: GP17. A block carries a definition block of its own, and what it defines is in reach inside it. Every person over the cut who is also older than the person the row is for, which is three for ann, one for bo, none for cy and one for di.
    query: "MATCH (p:person) CALL (p) { VALUE cut = 35 MATCH (q:person) WHERE q.age > cut AND q.age > p.age RETURN q.name AS f } RETURN count(*) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "5"

  - name: a-name-a-block-defined-is-gone-after-it
    doc: The other half of GP17. What a block defines goes out of scope with the block, so the statement around it cannot read the name, and the refusal is the same one any undefined name gets.
    query: "MATCH (p:person) CALL (p) { VALUE cut = 35 MATCH (q:person) WHERE q.age > cut RETURN q.name AS f } RETURN cut AS x"
    raises: "42002"
  - name: a-statement-written-in-braces
    doc: ISO 9.1. A statement may be written in braces with nothing around them. The braces say where the statement ends and nothing else, so the braced text and the bare text answer alike, and the case is here because the braces are read before the first clause says whether this statement reads or writes.
    query: "{ MATCH (p:person) RETURN count(p) AS a }"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-use-in-front-of-the-braces
    doc: ISO 13.1. The clause in front of the braces names the graph the statement inside them runs against, which is the same graph the clause names when it is written inside them instead. Only the brace behind the clause says which of the two shapes the text is, so the clause has to be read before the shape is known.
    query: "USE CURRENT_PROPERTY_GRAPH { MATCH (p:person) RETURN count(p) AS a }"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-use-in-front-of-the-braces-and-the-same-graph-inside-them
    doc: Both places may be written at once when they name the one graph, because then there is nothing to choose between and the statement runs against what both of them said.
    query: "USE CURRENT_PROPERTY_GRAPH { USE CURRENT_PROPERTY_GRAPH MATCH (p:person) RETURN count(p) AS a }"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-use-written-again-in-front-of-a-later-part
    doc: ISO 16.2 builds a focused statement out of parts, each one a graph clause and the clauses under it, and only the last part carries the result. A query with one clause in it derives the last part alone, so a clause written again is the only way the earlier parts appear at all. Both name the one graph, because what this asks is whether the clause may be repeated and not what happens when the graph moves under a bound variable.
    query: USE CURRENT_PROPERTY_GRAPH MATCH (p:person) USE CURRENT_PROPERTY_GRAPH MATCH (p)-[:knows]->(q:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-second-graph-in-front-of-a-later-part
    doc: The line the case above draws, from the other side. A statement runs against the one graph it names, so a second clause naming a second graph is not the graph changing partway through, it is a statement with nothing to compile against.
    query: USE CURRENT_PROPERTY_GRAPH GRAPH g = HOME_PROPERTY_GRAPH MATCH (p:person) USE g MATCH (p)-[:knows]->(q:person) RETURN count(*) AS a
    raises: "25G04"

  - name: the-word-variable-in-front-of-a-graph-name
    doc: GP11. A name standing where a graph goes could be a variable or a catalog object, and ISO 11.1 lets the query say which before the engine looks. A name written plainly is read as a variable first and as a catalog object where nothing bound it, so the word settles what was already settled and the two answer alike.
    query: GRAPH g = CURRENT_PROPERTY_GRAPH USE VARIABLE g MATCH (p:person) RETURN count(p) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-graph-written-where-a-value-goes
    doc: GE01. A graph reference is a value of graph type, and ISO 20.1 lets a query write one where a value goes rather than only pass one in. The word in front says which of the two reference types is meant, and it adds nothing the value does not already say, so the long spelling and the short one answer the same graph the session is working in.
    query: RETURN (PROPERTY GRAPH CURRENT_PROPERTY_GRAPH IS TYPED ANY PROPERTY GRAPH) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-short-word-in-front-of-a-graph-written-out
    doc: The same reference under the other spelling. GRAPH alone is a name a query may write and a slash behind one is a division as often as it is a path, so the short word is read this way only in front of the words that can be nothing else, of which the two graphs the session already has are two.
    query: RETURN (GRAPH CURRENT_PROPERTY_GRAPH = HOME_PROPERTY_GRAPH) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-graph-written-out-and-then-named
    doc: What makes it a value and not a clause is that it flows. A definition may hold what the words answered and the name reads back the graph they named, which is the same claim GP11 makes about a graph variable holding a reference.
    query: LET g = PROPERTY GRAPH CURRENT_PROPERTY_GRAPH RETURN (g = HOME_PROPERTY_GRAPH) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-binding-table-written-where-a-value-goes
    doc: GE02. A binding table is the rows of a query held as one value, and ISO 20.1 writes one by writing the query. Four people are four rows, which is the count the definition form answers for the same query, because it is the same value written in a different place.
    query: "RETURN cardinality(BINDING TABLE { MATCH (p:person) RETURN p.name AS name }) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: the-short-spelling-of-a-binding-table-written-out
    doc: BINDING is a word the form may carry and neither reading needs, the same way the definition may carry it. The rows are the rows either way, so a FOR over the short spelling runs the three that are over the cut.
    query: "FOR r IN TABLE { MATCH (p:person) WHERE p.age > 35 RETURN p.name AS name } RETURN count(*) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-binding-table-written-out-and-then-named
    doc: A written table is a value like any other, so a definition may hold one and the name reads back the table rather than a one row table holding it. That is the same thing a definition naming another definition says, checked from the side where nobody named the first one.
    query: "BINDING TABLE t = TABLE { MATCH (p:person) RETURN p.name AS name } RETURN cardinality(t) AS a"
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-binding-table-written-out-that-reads-its-row
    doc: GP10 from the side that shows what the shape costs. The query in the braces is worked out once, before the first row, the way every definition is, so there is no row for it to read and a name from the match around it is a name nothing bound.
    query: "MATCH (p:person) RETURN cardinality(TABLE { MATCH (q:person) WHERE q.name = p.name RETURN q.name AS name }) AS a"
    raises: "42002"

  - name: a-binding-table-written-out-that-writes
    doc: A value is read and not written, and what makes a query a value here is that it ends by returning rows. One that ends by changing the graph has no rows to be, so it is refused where it is written rather than run for its effect.
    query: "RETURN cardinality(TABLE { MATCH (p:person) SET p.seen = true }) AS a"
    raises: "42001"
