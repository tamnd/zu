schema: 4
suite: list
doc: The one composite type in the v0 core, and the only place a value can hold other values. A client decoding a list has to have decoded every type inside it, so a list case is a test of the whole decoder rather than one branch of it, and the nesting is where a client written against a flat wire format runs out of room.

cases:
  - name: empty
    doc: An empty list is a value, and a client giving back a null or a missing column for it has lost the difference between no elements and no list.
    query: RETURN [] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:

  - name: integers
    doc: The ordinary case, three elements in the order they were written, because order is part of what a list is and a client decoding into an unordered container fails here first.
    query: RETURN [1, 2, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
              - type: INT64
                value: "3"

  - name: mixed-types
    doc: A list is not required to be uniform, which is the fact a client decoding into a typed array cannot represent. It has to reach for the dynamic container here or say so in its skip list.
    query: RETURN [1, 'a', true] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: STRING
                value: a
              - type: BOOL
                value: true

  - name: an-integer-and-a-float-keep-their-types
    doc: Two elements that compare equal and are stored differently. A client that decides a list's element type from the first element gives back an integer for the second and loses the distinction.
    query: RETURN [1, 1.0] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: FLOAT64
                value: "1.0"

  - name: nested
    doc: A list of lists, where a client flattening on the way through gives back three elements instead of two.
    query: RETURN [[1, 2], [3]] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: LIST
                value:
                  - type: INT64
                    value: "1"
                  - type: INT64
                    value: "2"
              - type: LIST
                value:
                  - type: INT64
                    value: "3"

  - name: nested-three-deep
    doc: Three levels, because a client whose decoder recurses once and then assumes scalars passes the case above and fails this one.
    query: RETURN [[[1]]] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: LIST
                value:
                  - type: LIST
                    value:
                      - type: INT64
                        value: "1"

  - name: an-empty-list-inside-a-list
    doc: One element, and that element has none. A client counting the leaves rather than the elements answers zero for the size of this.
    query: RETURN [[]] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: LIST
                value:

  - name: size
    doc: The number of elements, which is the only thing the v0 core can ask a list about, so it is what every case below is measured with.
    query: RETURN size([1, 2, 3]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: size-of-empty
    doc: No elements is a size and not an absence, which a client folding empty into null gets wrong.
    query: RETURN size([]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: size-counts-elements-not-leaves
    doc: A list of two lists holding three integers has a size of two. This is the same function as size on a string and the same question a client answers about nesting.
    query: RETURN size([[1, 2], [3]]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: equality
    doc: Two lists with the same elements in the same order are the same list, which is by value and not by identity, and a client comparing references answers false.
    query: RETURN [1, 2] = [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: equality-of-empties
    doc: Two empty lists are equal, which is worth its own case because it is the one an implementation short-circuiting on length gets right for the wrong reason and the one comparing first elements crashes on.
    query: RETURN [] = [] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: inequality-by-element
    doc: Lists of the same length differing in one place are not equal.
    query: RETURN [1, 2] = [1, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: inequality-by-length
    doc: A list is not equal to one that extends it, which separates the length check from the element check for a client that only implemented one of them.
    query: RETURN [1, 2] = [1, 2, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: equality-across-numeric-types
    doc: An integer element and a float element that compare equal make the lists equal, because a list comparison is the comparison of its elements and inherits their rules rather than comparing storage.
    query: RETURN [1] = [1.0] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-by-first-difference
    doc: Lists order at the first element that differs and ignore everything after it, which is the same rule as for strings and is worth pinning separately because it is a separate code path.
    query: RETURN [1, 2] < [1, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-by-prefix
    doc: A list sorts before one it is a prefix of, which is how a shorter list is placed when nothing before the end distinguishes them.
    query: RETURN [1] < [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-of-the-empty-list
    doc: The empty list sorts before every other list, which follows from the rule above and is the boundary of it.
    query: RETURN [] < [1] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-of-strings-inside
    doc: A list of strings orders by the strings, so a client comparing lists by a serialised form rather than element by element has to have serialised in an order-preserving way.
    query: RETURN ['a'] < ['b'] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: membership
    doc: IN asks whether any element equals the value, which is the equality of the case above applied once per element.
    query: RETURN 1 IN [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: membership-absent
    doc: A value in no element is false and not null, because with no nulls in the list every comparison has an answer.
    query: RETURN 3 IN [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: membership-across-numeric-types
    doc: A float finds the integer element it equals, because IN uses the same comparison the equality operator does and not an identity check on the storage.
    query: RETURN 1.0 IN [1] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: membership-of-a-list
    doc: A list is a value and can be an element, so it can be looked for. A client flattening the haystack finds an integer here and answers about the wrong question.
    query: RETURN [1] IN [[1]] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: membership-of-a-null-is-unknown
    doc: Looking for a null gives a null, because every comparison it makes is unknown and no number of unknowns is a false.
    query: RETURN null IN [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: membership-found-past-a-null
    doc: A match found is true even though the list holds a null, because a true settles the question and the unknown behind it cannot unsettle it.
    query: RETURN 1 IN [1, null] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: membership-not-found-past-a-null
    doc: No match and a null in the list is unknown rather than false, which is the other half of the case above and the one a client short-circuiting on the end of the list gets wrong.
    query: RETURN 3 IN [1, null] AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: unwind-gives-a-row-per-element
    doc: UNWIND is how a list becomes rows, which is the only way the v0 core reaches an element, and so it is the operation every list case below leans on.
    query: UNWIND [1, 2] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "2"

  - name: unwind-of-empty-gives-no-rows
    doc: An empty list produces nothing, not one row holding a null, which is where a client implementing UNWIND as an outer join over the elements differs.
    query: UNWIND [] AS n RETURN n
    columns:
      - n
    rows:

  - name: unwind-does-not-flatten
    doc: Unwinding a list of lists gives rows holding lists and does not go a second level down. A client that flattens gives two rows of integers where the answer is two rows of lists.
    query: UNWIND [[1], [2]] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "2"

  - name: distinct-compares-lists-by-value
    doc: Two lists built separately with the same elements are one value under DISTINCT, which is the equality rule applied where a client is most likely to have reached for a hash of the container's address.
    query: UNWIND [[1], [1]] AS n RETURN DISTINCT n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"

  - name: plus-does-not-concatenate
    doc: The operator that joins two strings does not join two lists, and asks for numbers instead. A client offering list concatenation on this spelling has invented syntax the engine will not accept.
    query: RETURN [1, 2] + [3] AS n
    raises: "22G03"

  - name: a-null-inside-a-list
    doc: A list holds a null like any other element, so the container is not the thing that says whether a value is missing.
    query: RETURN [null] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: NULL

  - name: a-null-is-counted
    doc: The length of a list with one null in it is one, because the null is an element and not an absence of one.
    query: RETURN size([null]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: a-null-element-makes-a-comparison-unknown
    doc: Two lists that differ where one holds a null compare to a null rather than to false, which is the three valued logic of the elements reaching the container.
    query: RETURN [1] = [null] AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: two-nulls-in-the-same-place-are-still-unknown
    doc: A null does not equal a null inside a list any more than it does outside one, so this is unknown and not true.
    query: RETURN [null] = [null] AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: a-list-is-not-null
    doc: The empty list is a value, which is the case a client mapping an absent list and an empty one onto one host value fails.
    query: RETURN [] IS NULL AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: cardinality-is-size-by-another-name
    doc: The standard gives the element count two names and they answer the same, so a client implementing one and forwarding the other is right by construction.
    query: RETURN cardinality([1, 2, 3]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: cardinality-counts-elements-not-leaves
    doc: A list of two lists has two elements whatever is inside them, the same statement the size case makes, and both names are pinned because a client may implement them apart.
    query: RETURN cardinality([[1], [2]]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: cardinality-refuses-a-string
    doc: A string has a length and not a cardinality, so this raises where size answers, and a client that forwards both names to one implementation has to keep the refusal.
    query: RETURN cardinality('abc') AS n
    raises: "22G03"

  - name: cardinality-of-an-empty-list
    doc: A list with nothing in it has a cardinality of zero rather than no cardinality, which is the same distinction the empty list case makes about the value itself.
    query: RETURN cardinality([]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: size-refuses-a-number
    doc: A number has no length, so this raises rather than counting digits, which a client with a permissive fallback would happily do.
    query: RETURN size(1) AS n
    raises: "22G03"

  - name: lengths-add
    doc: Two lengths go into arithmetic as ordinary integers, which says the result of the function is a value and not a handle a client has to unwrap.
    query: RETURN size([1, 2]) + size([3]) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: nothing-is-in-the-empty-list
    doc: Membership of an empty list is false and not unknown, even for a null, which is the one place a null in a membership test has a definite answer.
    query: RETURN null IN [] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: the-empty-list-is-a-value-to-look-for
    doc: An empty list found inside a list of lists is a hit, so the search compares elements by value and does not treat the empty one as nothing.
    query: RETURN [] IN [[]] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: inequality-of-lists
    doc: The unequal operator over lists, separate from equality in a client that wrote one and negated it somewhere else.
    query: RETURN [1, 2] <> [1, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-is-not-strict
    doc: A list is greater than or equal to itself, so all four ordering operators are defined over the type and not only the two the sort uses.
    query: RETURN [1, 2] >= [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-first-difference-decides-regardless-of-length
    doc: A shorter list with a larger first element is the greater one, which says length is a tie break and not the first thing compared.
    query: RETURN [2] > [1, 9] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: order-inside-a-list-is-part-of-the-value
    doc: The same three numbers in another order are another list, so a client comparing lists as sets or as multisets says true where the engine says false.
    query: RETURN [1, 2, 3] = [3, 2, 1] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: the-two-zeroes-are-equal-inside-a-list
    doc: Negative zero equals zero as an element, the same as it does alone, which is worth saying because the float suite pins that they are still two different values.
    query: RETURN [0.0] = [-0.0] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-of-strings-past-the-first-element
    doc: Lists of strings order by the first element that differs and by the string order, not by length, which is two rules in one case.
    query: RETURN ['a', 'A'] < ['a', 'a'] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: negative-numbers-order-inside-a-list
    doc: Elements compare by value and not by anything the encoding does to a sign, which a client comparing the encoded bytes gets backwards.
    query: RETURN [-1] < [0] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: nested-lists-compare-by-value
    doc: Two lists of lists built separately are equal, which says the comparison goes all the way down rather than comparing identity at the top.
    query: RETURN [[1], [2]] = [[1], [2]] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: booleans-in-a-list
    doc: A list of truth values, because a client packing booleans into bits inside a container is one of the two ways this type is stored.
    query: RETURN [true, false] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: BOOL
                value: true
              - type: BOOL
                value: false

  - name: floats-in-a-list
    doc: Floats keep their type inside a list, which the mixed case above says and this one says for the type most likely to be widened on the way through a container.
    query: RETURN [1.5, 2.5] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: FLOAT64
                value: "1.5"
              - type: FLOAT64
                value: "2.5"

  - name: temporal-values-in-a-list
    doc: A date inside a list, which is where a client that renders temporal values at the top level and recurses with a plain encoder loses the type.
    query: RETURN [DATE '2024-01-01'] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: DATE
                value: "2024-01-01"

  - name: a-list-does-not-cast-to-text
    doc: There is no rendering of a list as a string, so a client offering one has picked a separator and a bracket style the engine never agreed to.
    query: RETURN cast([1] AS STRING) AS n
    raises: "22G03"

  - name: a-list-casts-to-a-list-type
    doc: A list cast to a list of a type it already holds comes back unchanged, which is the cast that checks rather than converts.
    query: RETURN cast([1, 2] AS LIST<INT>) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"

  - name: a-list-of-one-type-is-typed-as-that-list
    doc: The type test over a list looks at the elements, so a client answering from the container alone cannot tell the two cases here apart.
    query: RETURN [1, 2] IS TYPED LIST<INT> AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-mixed-list-is-not-typed-as-one-of-them
    doc: One element of another type is enough for the test to answer false, which is the other half of the pair above.
    query: RETURN [1, 'a'] IS TYPED LIST<INT> AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: unwinding-twice-flattens
    doc: A second unwind over the rows of the first is how a nested list is flattened, since the first one does not do it, and the result is the whole of both lists in order.
    query: UNWIND [[1, 2], [3]] AS r UNWIND r AS n RETURN collect(n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
              - type: INT64
                value: "3"

  - name: unwind-gives-a-row-holding-a-null
    doc: A null element becomes a row whose value is a null, so the row count follows the length of the list and not the number of values in it.
    query: UNWIND [null] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: rows-collect-into-a-list
    doc: The fold from rows back into one list is the other direction of unwind, and the pair of them is how a client's list encoding is checked in both directions.
    query: UNWIND [1, 2] AS n RETURN collect(n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"

  - name: collecting-no-rows-gives-an-empty-list
    doc: A fold over nothing is the empty list and not a null, which is the answer a client that starts its accumulator as absent gives instead.
    query: UNWIND [] AS n RETURN collect(n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:

  - name: collecting-drops-nulls
    doc: A null row does not reach the list, because set functions ignore nulls, so the list is shorter than the number of rows that went in.
    query: UNWIND [1, null, 2] AS n RETURN collect(n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"

  - name: collecting-distinct-rows
    doc: The fold takes a duplicate free argument, which is a second path through the same accumulator and one a client rendering the result has to decode the same way.
    query: UNWIND [1, 2] AS n RETURN collect(DISTINCT n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"

  - name: lists-order
    doc: Sorting rows whose values are lists uses the list ordering the comparison cases pin, rather than an order the sort makes up for a container.
    query: UNWIND [[2], [1]] AS n RETURN n ORDER BY n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "2"

  - name: the-smallest-list
    doc: A set function over lists answers with a list, which is the same order again and the last place a client with a separate comparison for aggregates can differ.
    query: UNWIND [[2], [1]] AS n RETURN min(n) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"

  - name: named-by-its-type
    doc: The list value constructor of ISO 20.17 may name what it is building before it lists what goes in it, and the name changes nothing about the list. A client that only reads the bracket form fails here on a query the standard writes both ways.
    query: RETURN LIST [1, 2, 3] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "2"
              - type: INT64
                value: "3"

  - name: array-is-the-same-word-twice
    doc: ARRAY and LIST are one type name spelled two ways, in the constructor as in the type grammar, so the two constructors build the same value and compare equal.
    query: RETURN ARRAY [1, 2] = LIST [1, 2] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-word-is-a-type-and-not-a-name
    doc: LIST is a reserved word of ISO 21.3, so it is a type where a type belongs and nothing at all where a name belongs. A query that wants the word as a variable writes it in accent quotes, and one that writes it plainly is refused.
    query: LET list = 7 RETURN list AS n
    raises: "42001"

  - name: an-ordinary-name-in-the-same-slot-binds
    doc: The other half of the rule above. The slot after LET takes a name, and a name the standard leaves alone binds and reads back the way any name does.
    query: LET tally = 7 RETURN tally AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "7"
