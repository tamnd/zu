schema: 3
suite: pattern
doc: What a pattern selects, which is the half of a statement that reads the graph rather than the values in it. The fixture is four people and three edges, one of which runs from a node to itself, and every case here is a question about which of those a pattern reaches: whether a label selects, whether an arrow has a direction, whether a name written twice means one element or two, and how many rows a walk of two edges is. The counts are small enough to check by reading the pairs at the top of this file, which is the point of them.

load:
  nodes: person
  edges: knows
  count: 4
  columns:
    - name: name
      type: STRING
      values:
        - ann
        - bo
        - cy
        - di
    - name: age
      type: INT64
      values:
        - "30"
        - "40"
        - "50"
        - "40"
  pairs:
    - from: 0
      to: 1
    - from: 1
      to: 2
    - from: 3
      to: 3

cases:
  - name: a-label-selects-its-table
    doc: The plainest pattern there is, which every case below is counted against.
    query: MATCH (n:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-label-nothing-carries-selects-nothing
    doc: A label no element has is an empty result rather than a condition, because a graph is allowed not to hold something.
    query: MATCH (n:nothing) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-node-pattern-with-no-label
    doc: A pattern that names no label reaches every node, which is the shape a client writes when it is counting the whole graph.
    query: MATCH (n) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-node-pattern-with-no-variable
    doc: A node nothing refers to still selects, so a pattern's cardinality does not depend on whether the client asked for the element.
    query: MATCH (:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-label-conjunction
    doc: Two labels joined, which selects the elements carrying both, and here nothing carries the second one.
    query: MATCH (n:person&other) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-label-disjunction
    doc: The same two labels the other way, which selects everything carrying either and so selects the whole table.
    query: MATCH (n:person|other) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-label-negation
    doc: A label expression that says which label an element does not carry, which reaches every node here because nothing carries it.
    query: MATCH (n:!other) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-negation-of-the-label-everything-carries
    doc: The other end of the same expression, where the negated label is the one every node has, so nothing is selected.
    query: MATCH (n:!person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: an-inline-property
    doc: A property written into the pattern, which is the lookup by key that every client's first read is.
    query: MATCH (n:person {name: 'ann'}) RETURN n.age AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "30"

  - name: two-inline-properties
    doc: Two properties in one pattern, which are joined by and, so a row has to answer both.
    query: MATCH (n:person {name: 'ann', age: 30}) RETURN n.age AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "30"

  - name: two-inline-properties-that-no-row-answers-together
    doc: Each of the two matches a row on its own and no row matches both, which is the case a client that treats the map as a disjunction gets wrong.
    query: MATCH (n:person {name: 'ann', age: 40}) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: an-inline-property-nothing-matches
    doc: A key that is not in the table's values, which selects nothing and is not a condition.
    query: MATCH (n:person {name: 'zz'}) RETURN n.age AS a
    columns:
      - a
    rows:

  - name: an-inline-property-that-matches-more-than-one
    doc: Two people of the same age, so an inline property is a filter and not a key lookup that stops at the first row.
    query: MATCH (n:person {age: 40}) RETURN n.name AS a ORDER BY a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di

  - name: an-inline-property-and-a-predicate
    doc: The same filtering written half in the pattern and half in WHERE, which has to reach the same rows as writing all of it either way.
    query: MATCH (n:person {age: 40}) WHERE n.name = 'bo' RETURN n.name AS a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: bo

  - name: a-predicate-over-a-property
    doc: The plain WHERE, which is the same selection as an inline property and is the spelling that takes an operator other than equals.
    query: MATCH (n:person) WHERE n.age >= 40 RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-predicate-over-two-properties
    doc: A predicate joining two properties of one element, which no index answers and every engine has to evaluate.
    query: MATCH (n:person) WHERE n.age > 35 AND n.name < 'd' RETURN n.name AS a ORDER BY a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: cy

  - name: an-edge-walked-forwards
    doc: The three pairs the load wrote, read in the direction they were written, which is the count every direction case below is measured against.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: the-ends-of-every-edge
    doc: The same three edges with their ends named, so a client cannot pass the count without holding the pairs.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN a.name AS x, b.name AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: bo
          - type: STRING
            value: cy
      - values:
          - type: STRING
            value: di
          - type: STRING
            value: di

  - name: an-edge-walked-backwards
    doc: The arrow pointing the other way finds the same three edges from the other end, and a client storing one direction only answers nothing here.
    query: MATCH (a:person)<-[:knows]-(b:person) RETURN a.name AS x, b.name AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: bo
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: cy
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di
          - type: STRING
            value: di

  - name: an-anonymous-edge
    doc: An arrow with no bracket, which selects every edge between the two nodes whatever its table is called.
    query: MATCH (a:person)->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: an-edge-with-a-variable-and-no-label
    doc: A bracket that names the edge and not its table, which is how a client asks for whatever runs between two nodes.
    query: MATCH (a:person)-[e]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: an-edge-of-a-table-nothing-is-in
    doc: A rel table nobody declared, which selects nothing rather than refusing, the same way an unknown node label does.
    query: MATCH (a:person)-[:nothing]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: an-edge-from-a-node-to-itself
    doc: The pair the load wrote from a row to itself, which is an edge like any other and is the one a walk can take twice.
    query: MATCH (a:person)-[:knows]->(a) RETURN a.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: di

  - name: a-name-written-twice-is-one-element
    doc: The same variable at both ends selects only the edges whose ends are the same element, which is what makes the case above a self edge test and not a spelling.
    query: MATCH (a:person)-[:knows]->(a) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: a-walk-of-two-edges
    doc: One walk of two edges runs between distinct people here, which is a join of the pattern with itself and not a product.
    query: MATCH (a:person)-[:knows]->(b:person)-[:knows]->(c:person) WHERE a.name <> b.name RETURN a.name AS x, c.name AS y
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: cy

  - name: a-walk-of-two-edges-over-the-self-edge
    doc: A self edge can be the second hop of a walk that started on it, so the two hop pattern reaches the same node twice and that is a row.
    query: MATCH (a:person)-[:knows]->(b:person)-[:knows]->(c:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-walk-of-three-edges
    doc: Three hops, which only the self edge can supply here, so the count says whether a walk is allowed to reuse an edge.
    query: MATCH (a:person)-[:knows]->()-[:knows]->()-[:knows]->(d:person) RETURN d.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: di

  - name: two-edges-arriving-at-one-node
    doc: A pattern shaped like a V, which pairs every two edges that share a target, including each edge with itself.
    query: MATCH (a:person)-[:knows]->(b:person)<-[:knows]-(c:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: two-edges-leaving-one-node
    doc: The same shape turned around, which is the other way a client asks for a node's neighbourhood.
    query: MATCH (a:person)<-[:knows]-(b:person)-[:knows]->(c:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-walk-of-one-or-two-edges
    doc: A quantified edge, which is the three single hops plus the one walk of two, and is where a client that expands a walk itself has to agree with one that pushes it down.
    query: MATCH (a:person)-[:knows*1..2]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-quantifier-of-exactly-one
    doc: A quantified edge that allows one hop only, which has to give what the unquantified pattern gives.
    query: MATCH (a:person)-[:knows*1..1]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-quantifier-of-exactly-two
    doc: Two hops and no fewer, which is the half of the range case that the single hops would otherwise hide, and which the self edge does not answer because a quantified walk does not take one edge twice.
    query: MATCH (a:person)-[:knows*2..2]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: the-ends-of-a-two-hop-quantifier
    doc: The row behind that count, named, so a client that reaches the right number by a different walk is still caught.
    query: MATCH (a:person)-[:knows*2..2]->(b:person) RETURN a.name AS x, b.name AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: cy

  - name: a-pattern-that-exists
    doc: A predicate asking whether a walk leaves this node, which is the shape of every neighbour check and does not multiply the rows.
    query: MATCH (a:person) WHERE EXISTS { (a)-[:knows]->(:person) } RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di

  - name: a-pattern-that-does-not-exist
    doc: The negation of the same predicate, which is the node nothing leaves and is the case a client answering with a join returns wrongly.
    query: MATCH (a:person) WHERE NOT EXISTS { (a)-[:knows]->(:person) } RETURN a.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: cy

  - name: a-pattern-that-exists-in-the-other-direction
    doc: The same predicate over an arriving edge, so a client cannot answer it by looking at one adjacency list.
    query: MATCH (a:person) WHERE EXISTS { (a)<-[:knows]-(:person) } RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: cy
      - values:
          - type: STRING
            value: di

  - name: a-pattern-that-exists-written-in-parentheses
    doc: The standard writes the existence predicate in parentheses as well as in braces, and the pattern inside is the same pattern, so this answers what the braced spelling answers.
    query: MATCH (a:person) WHERE EXISTS ( (a)-[:knows]->(:person) ) RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di

  - name: a-block-of-matches-that-exists
    doc: Several match statements under one predicate, which is one conjunction over the names they share, so this asks for two hops rather than one.
    query: MATCH (a:person) WHERE EXISTS ( MATCH (a)-[:knows]->(b:person) MATCH (b)-[:knows]->(c:person) ) RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: di

  - name: a-query-that-exists
    doc: A whole query under the predicate rather than a block, which the RETURN is what tells apart, and it reads the row around it, so the answer is that row's.
    query: MATCH (a:person) WHERE EXISTS { MATCH (b:person) WHERE b.age = a.age + 10 RETURN b.name } RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di

  - name: what-the-query-under-a-predicate-returns-is-never-read
    doc: Only whether the query answered a row is asked, so it may return as many columns as it likes, which a query written where one value belongs may not.
    query: MATCH (a:person) WHERE EXISTS { MATCH (b:person) WHERE b.age = a.age RETURN b.name, b.age } RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-query-that-answers-nothing-is-false-and-not-null
    doc: The difference between asking whether something is there and asking what it is, since a query answering no row where one value belongs is null and here it is false.
    query: MATCH (a:person) WHERE NOT EXISTS { MATCH (b:person) WHERE b.age > 99 RETURN b.name } RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: two-patterns-with-nothing-joining-them
    doc: A cross product of the table with itself, which is sixteen rows and is the count a client that quietly joins on the variable name would not produce.
    query: MATCH (a:person), (b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "16"

  - name: two-patterns-joined-by-a-predicate
    doc: The product with a WHERE over both halves, which is how a client asks a question no edge answers.
    query: MATCH (a:person), (b:person) WHERE a.age < b.age RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "5"

  - name: two-patterns-sharing-a-variable
    doc: A name written in both halves, which joins them, so the product collapses to the table's own size.
    query: MATCH (a:person), (a) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-pattern-in-a-second-match-clause
    doc: Two MATCH clauses in a row, which join on the name they share the way two patterns in one clause do.
    query: MATCH (a:person) MATCH (a)-[:knows]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: an-optional-match-that-finds-nothing
    doc: An optional half nothing answers, which keeps the row and fills the column with null rather than dropping it.
    query: MATCH (n:person) WHERE n.name = 'cy' OPTIONAL MATCH (n)-[:knows]->(m:person) RETURN n.name AS x, m.name AS y
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: cy
          - type: NULL

  - name: an-optional-match-that-finds-something
    doc: The same clause where the walk exists, so the column holds the value and the row is not duplicated.
    query: MATCH (n:person) WHERE n.name = 'ann' OPTIONAL MATCH (n)-[:knows]->(m:person) RETURN n.name AS x, m.name AS y
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: bo

  - name: an-optional-match-over-every-row
    doc: The clause applied to the whole table, which is three walks and one null and is the join a client writes as a left outer one.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: an-optional-match-whose-null-is-counted
    doc: Counting the optional column rather than the rows, which is three because a count of a value skips the nulls and a count of rows does not.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person) RETURN count(m.name) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-predicate-after-an-optional-match
    doc: A WHERE written after the optional half belongs to it, so a row the predicate rejects is padded with nulls rather than dropped, and the count is the whole table rather than the rows that matched.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person) WHERE m.name = 'bo' RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: what-a-predicate-after-an-optional-match-keeps
    doc: The same clause counted over the optional column rather than over the rows, which is the one walk the predicate let through and is the number a client expects the case above to give.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person) WHERE m.name = 'bo' RETURN count(m.name) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: a-pattern-after-a-with
    doc: A match reading a name an earlier stage bound, which is the pipeline shape and not a new scan.
    query: MATCH (a:person) WHERE a.name = 'ann' WITH a MATCH (a)-[:knows]->(b:person) RETURN b.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo

  - name: a-pattern-over-a-node-the-store-holds-alone
    doc: The node no edge leaves, reached by the plain pattern, which is the row a client that builds its graph from the edge list loses.
    query: MATCH (n:person) WHERE n.name = 'cy' RETURN n.age AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "50"

  - name: the-neighbours-of-one-node
    doc: The read a client does most, which is one node by key and one hop out of it.
    query: MATCH (a:person {name: 'ann'})-[:knows]->(b:person) RETURN b.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo

  - name: the-neighbours-of-a-node-that-has-none
    doc: The same read over a node nothing leaves, which is an empty result and not a null row, because the pattern is not optional.
    query: MATCH (a:person {name: 'cy'})-[:knows]->(b:person) RETURN b.name AS x
    columns:
      - x
    rows:

  - name: the-degree-of-every-node
    doc: A count per node over an optional walk, which is the summary a client draws a histogram from and is where the padded null has to count as zero.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person) RETURN n.name AS x, count(m.name) AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: INT64
            value: "1"
      - values:
          - type: STRING
            value: bo
          - type: INT64
            value: "1"
      - values:
          - type: STRING
            value: cy
          - type: INT64
            value: "0"
      - values:
          - type: STRING
            value: di
          - type: INT64
            value: "1"

  - name: a-property-of-the-far-end
    doc: A value read through a walk, which is the join every client writes and the reason an edge is worth storing.
    query: MATCH (a:person {name: 'bo'})-[:knows]->(b:person) RETURN b.age AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "50"

  - name: a-predicate-over-the-far-end
    doc: A filter on the other side of the arrow, which is what makes a walk a query rather than a traversal.
    query: MATCH (a:person)-[:knows]->(b:person) WHERE b.age > 45 RETURN a.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo

  - name: a-predicate-comparing-the-two-ends
    doc: A predicate over both ends at once, which no index answers and which is the shape of every question about a difference along an edge.
    query: MATCH (a:person)-[:knows]->(b:person) WHERE a.age < b.age RETURN a.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo

  - name: an-aggregate-over-a-walk
    doc: A summary of the far ends, grouped by the near one, which is the read behind every neighbour list a client renders.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN a.name AS x, count(*) AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: INT64
            value: "1"
      - values:
          - type: STRING
            value: bo
          - type: INT64
            value: "1"
      - values:
          - type: STRING
            value: di
          - type: INT64
            value: "1"

  - name: an-aggregate-over-the-far-ends-values
    doc: The same walk with a value taken off the far end, so the aggregate reads a column through the edge rather than beside it.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN sum(b.age) AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "130"

  - name: the-nodes-a-walk-reaches
    doc: The distinct far ends, which is the set a client renders as a neighbourhood and is smaller than the count of walks whenever two walks land together.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN DISTINCT b.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: cy
      - values:
          - type: STRING
            value: di

  - name: a-walk-out-and-back
    doc: Out along an edge and back along another, which pairs a node with the nodes that share a target with it, itself included.
    query: MATCH (a:person)-[:knows]->()<-[:knows]-(b:person) RETURN a.name AS x, b.name AS y ORDER BY x
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di
          - type: STRING
            value: di

  - name: a-walk-out-and-back-to-somebody-else
    doc: The same shape with the trivial pairing filtered out, which is how the useful half of that query is written and is empty in this graph.
    query: MATCH (a:person)-[:knows]->()<-[:knows]-(b:person) WHERE a.name <> b.name RETURN count(*) AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: an-edge-either-way
    doc: A pattern with no arrowhead walks every edge in both directions, so each of the three answers twice, the self edge included.
    query: MATCH (a:person)-[:knows]-(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "6"

  - name: an-edge-either-way-from-one-node
    doc: The neighbours of a node in either direction, which is the read a client does when it draws a node and everything touching it.
    query: MATCH (a:person {name: 'bo'})-[:knows]-(b:person) RETURN b.name AS x ORDER BY x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: cy

  - name: a-self-edge-either-way
    doc: A self edge under an undirected pattern answers twice, once for each direction it can be walked in, which is the count that says the direction and not the pair of ends is what the pattern is asking about.
    query: MATCH (a:person {name: 'di'})-[:knows]-(b:person) RETURN count(*) AS x
    columns:
      - x
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-node-selected-by-a-property-of-a-neighbour
    doc: A pattern whose filter is one hop away from the node it returns, which is the read a recommendation is built out of.
    query: MATCH (a:person)-[:knows]->(b:person {name: 'cy'}) RETURN a.name AS x
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: bo

  - name: a-pattern-whose-ends-carry-the-same-value
    doc: A join on a property rather than on an edge, which is the query a client writes when the graph does not have the edge it wants.
    query: MATCH (a:person), (b:person) WHERE a.age = b.age AND a.name < b.name RETURN a.name AS x, b.name AS y
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: bo
          - type: STRING
            value: di

  - name: a-pattern-and-a-page
    doc: A walk with a limit over it, which is the read behind a paged neighbour list and takes its page after the order.
    query: MATCH (a:person)-[:knows]->(b:person) RETURN a.name AS x ORDER BY x LIMIT 2
    columns:
      - x
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo

  - name: brackets-around-a-pattern-say-nothing
    doc: A parenthesized path pattern matches nothing of its own, so the pattern inside the brackets answers what it answers without them. Everything else the brackets are for rests on this.
    query: MATCH ((a:person)-[:knows]->(b:person)) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-subpath-variable-measures-the-stretch-it-names
    doc: A name written inside the brackets binds a path over the stretch they hold rather than over the whole walk, so a two hop pattern whose second hop is bracketed answers a path of one hop.
    query: MATCH (a:person)-[:knows]->(b:person) (q = (b)-[:knows]->(c:person)) WHERE a.name = 'ann' RETURN path_length(q) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: two-stretches-of-a-pattern-meeting-at-one-node
    doc: A factor written straight against another meets it at a node, so the two node patterns there describe one node under two names and the pattern walks one edge rather than three.
    query: MATCH (a:person)((x:person)-[:knows]->(y:person))(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-condition-written-inside-the-brackets
    doc: A WHERE inside the brackets is a condition on the stretch they hold, and the walk from a node to itself is the one this drops.
    query: MATCH ((a:person)-[:knows]->(b:person) WHERE a.age < b.age) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-path-mode-on-one-stretch-of-a-walk
    doc: A path mode inside the brackets speaks about the stretch they hold, so an outer walk may hold an inner trail. The walk takes the edge from a node to itself twice and the trail does not.
    query: MATCH WALK (TRAIL (a:person)-[e:knows*1..2]->(b:person)) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-quantifier-behind-the-brackets-repeats-what-they-hold
    doc: A count behind a parenthesized path pattern repeats the stretch the brackets hold, so a pattern of one edge written twice walks two of them. The one walk this graph answers is ann to bo to cy, since the edge from a node to itself cannot be taken twice under the default trail.
    query: MATCH (a:person)((x:person)-[:knows]->(y:person)){2}(b:person) RETURN a.name AS x, b.name AS y
    columns:
      - x
      - y
    rows:
      - values:
          - type: STRING
            value: ann
          - type: STRING
            value: cy

  - name: a-name-inside-a-repeated-stretch-is-a-group
    doc: Every repetition binds the names written inside the brackets again, so a name there stands for one element per repetition rather than for one element, and reading a property of it answers the list of the properties in the order the walk took them.
    query: MATCH (a:person)((x:person)-[:knows]->(y:person)){2}(b:person) RETURN y.name AS a
    columns:
      - a
    rows:
      - values:
          - type: LIST
            value:
              - type: STRING
                value: bo
              - type: STRING
                value: cy

  - name: an-aggregate-over-a-group-folds-one-rows-bindings
    doc: An aggregate written around a group variable folds what that row bound rather than folding the rows, which is the horizontal aggregate, so it answers one row per walk the way any other expression does.
    query: MATCH (a:person)((x:person)-[:knows]->(y:person)){2}(b:person) RETURN sum(y.age) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "90"

  - name: a-directed-predicate-asks-whether-an-edge-has-a-direction
    doc: Every edge of a table has a direction or none of them does, so the question is about the table the edge came from and every edge here answers yes. A node has no direction to answer with, so the predicate is written of an edge and refused of anything else.
    query: MATCH (a:person)-[k:knows]->(b:person) WHERE k IS DIRECTED RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-labeled-predicate-tests-a-label-expression-on-a-bound-element
    doc: The label expression a pattern writes after a colon, asked of an element the query already bound rather than of the rows a scan is walking, so it reads the labels the row carries and nothing else.
    query: MATCH (n) WHERE n IS LABELED person RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-labeled-predicate-answers-no-for-a-label-nothing-carries
    doc: A name the graph has never held is a question with the answer no rather than a mistake, which is the reading a pattern naming one gets.
    query: MATCH (n) WHERE n IS NOT LABELED nothing RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-source-predicate-relates-a-node-to-the-edge-it-leaves
    doc: An edge value carries both of its ends, so the predicate is a comparison rather than another read of the graph. Every edge of a directed pattern leaves the node written first and arrives at the node written second, so both halves hold on every row.
    query: MATCH (a:person)-[k:knows]->(b:person) WHERE a IS SOURCE OF k AND b IS DESTINATION OF k RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: an-all-different-predicate-is-true-when-the-elements-are-distinct
    doc: Element identity, which is the table and the row for a node, so the two ends of the edge from a node to itself are one element and the two ends of the others are two.
    query: MATCH (a:person)-[:knows]->(b:person) WHERE all_different(a, b) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-same-predicate-is-true-when-the-elements-are-one-element
    doc: The other half of the same question, which the edge from a node to itself is the one row to answer yes for.
    query: MATCH (a:person)-[:knows]->(b:person) WHERE same(a, b) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: a-property-exists-predicate-asks-the-element-and-not-the-value
    doc: Whether the element carries a property, which is a question about the element and not about what is stored in it, so it is answered without reading the value.
    query: MATCH (n:person) WHERE property_exists(n, name) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-property-exists-predicate-answers-no-for-a-name-the-table-lacks
    doc: A property the table does not have is absent from every one of its elements, which is the answer no rather than a null and rather than a condition.
    query: MATCH (n:person) WHERE property_exists(n, nickname) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: an-element-pattern-predicate-selects-where-the-node-is-reached
    doc: A condition inside the parentheses is asked of the one node the pattern is standing on, so it is the same question a WHERE behind the pattern asks of that node and it is asked in the pattern rather than behind it.
    query: MATCH (n:person WHERE n.age > 35) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: an-element-pattern-predicate-reads-what-the-pattern-bound-before-it
    doc: The non local predicate of G041, which compares the node the walk has just reached with the node it came from, so only the edges that climb in age are kept.
    query: MATCH (a:person)-[:knows]->(b:person WHERE b.age > a.age) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: an-element-pattern-predicate-stands-beside-a-property-map
    doc: Both forms describe the one node, so the map and the condition are both asked of it, in the order they were written.
    query: MATCH (n:person {age: 40} WHERE n.name = 'bo') RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: an-element-pattern-predicate-inside-an-optional-match-keeps-the-row
    doc: The condition is part of the pattern, so a node it refuses is a match that did not happen rather than a row to drop, and the left side keeps its row with nulls in it.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person WHERE m.age > 45) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: element-id-names-a-node
    doc: ELEMENT_ID of ISO 20.10 answers an identifier for an element, and what the identifier is the standard leaves to the engine. zu answers a string that says which kind of element it names, then which table, then where in it, so the spelling is here rather than only in the declaration; a client that stores one of these is relying on it.
    query: MATCH (n:person) WHERE n.name = 'ann' RETURN element_id(n) AS a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: "n:0:0"

  - name: element-id-names-an-edge-as-well-as-a-node
    doc: The argument is an element and not a node, so an edge has one too, and an edge's is its table, the pair it runs between and which copy of that pair it is. Nothing an edge answers can collide with what a node answers, because the two spellings start differently.
    query: MATCH (a:person)-[r:knows]->(b:person) WHERE a.name = 'ann' RETURN element_id(r) AS a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: "e:1:0:1:0"

  - name: element-id-tells-two-elements-apart
    doc: The one thing an identifier owes is to name one element, so two elements answer two identifiers. This is the property a client relies on and the reason the answer is a string rather than the offset ID gives, which a node and an edge would share.
    query: MATCH (a:person), (b:person) WHERE a.name = 'ann' AND b.name = 'bo' RETURN element_id(a) <> element_id(b) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: element-id-of-nothing-is-nothing
    doc: A null element has no identifier rather than an identifier for null, which is how every other scalar here reads a null.
    query: MATCH (n:person) OPTIONAL MATCH (n)-[:knows]->(m:person WHERE m.age > 90) RETURN count(element_id(m)) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-bar-between-two-paths-matches-either-of-them
    doc: Path pattern union of ISO 16.7, feature G032. The two alternatives are separate walks and the clause after them reads the rows of both, so the count is the count each of them would have answered on its own added together. Here the first alternative finds the one edge out of ann and the second finds the one edge out of bo.
    query: MATCH (a:person WHERE a.name = 'ann')-[:knows]->(b:person) | (a:person WHERE a.name = 'bo')-[:knows]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-bar-answers-a-path-both-alternatives-found-once
    doc: The union is of paths and not of rows, so writing the same walk twice answers what the walk answers once. What tells two rows apart is the elements the walk went through, which is why this is a set: both alternatives here go through the same three edges.
    query: MATCH (a:person)-[:knows]->(b:person) | (a:person)-[:knows]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-multiset-alternation-answers-it-twice
    doc: Path multiset alternation of ISO 16.7, feature G030, which is the same shape with the counting left in. This is the one thing that separates the two spellings, so it is the same query as the case above with the bar changed.
    query: MATCH (a:person)-[:knows]->(b:person) |+| (a:person)-[:knows]->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "6"

  - name: a-bar-binds-inside-one-path-and-the-comma-outside
    doc: The bar sits inside one path pattern and the comma sits between two of them, so this is two ways of matching and each of them is a pair. Reading it the other way round would answer a different number, which is why it is written down.
    query: MATCH (a:person WHERE a.name = 'ann') | (a:person WHERE a.name = 'bo'), (c:person WHERE c.age = 40) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: an-alternative-reads-what-the-clause-in-front-of-it-bound
    doc: The row the alternatives run over is the row the clauses before them answered, so a name bound earlier is the same element in every alternative. That is what makes the shape useful for anything but a standalone walk.
    query: MATCH (n:person WHERE n.name = 'ann') MATCH (n)-[:knows]->(b:person) | (b:person)-[:knows]->(n) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: every-alternative-binds-the-same-names
    doc: The clauses after the alternatives read one row whichever alternative answered it, so a name only one of them binds would be readable only some of the time. That is refused where it is written rather than answered as a null.
    query: MATCH (a:person)-[:knows]->(b:person) | (a:person)-[r:knows]->(b:person) RETURN count(*) AS a
    raises: "42001"

  - name: an-optional-match-is-not-written-several-ways
    doc: An OPTIONAL MATCH answers a row of nulls where it found nothing, and there is no one answer for how many such rows a match written several ways should have. The alternatives are written as statements joined with UNION instead.
    query: OPTIONAL MATCH (a:person)-[:knows]->(b:person) | (a:person)-[:knows]->(b:person) RETURN count(*) AS a
    raises: "42001"

  - name: a-path-variable-is-not-written-several-ways
    doc: A path variable is assembled out of the slots of the walk that bound it, and the alternatives walk differently, so there is no one shape to assemble. It is refused by name rather than answered from whichever alternative happened to run first.
    query: MATCH p = (a:person)-[:knows]->(b:person) | (a:person)-[:knows]->(b:person) RETURN count(*) AS a
    raises: "42001"

  - name: a-questioned-stretch-is-walked-or-skipped
    doc: A questioned path of ISO 16.11, feature G037. The stretch is walked once or not at all, which is two shapes and not one, so the answer is the rows of each of them. Skipping it leaves the nodes at its ends standing on the one node, which is every person here, and walking it is every edge.
    query: MATCH (a:person) ((x:person)-[:knows]->(y:person))? (b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "7"

  - name: a-questioned-stretch-answers-both-of-its-lengths
    doc: The two shapes answer rows of the same columns, so what comes back reads as one result. Written from ann, skipping the stretch is ann itself and walking it is the person ann knows.
    query: MATCH (a:person WHERE a.name = 'ann') ((x:person)-[:knows]->(y:person))? (b:person) RETURN b.name AS a ORDER BY a
    columns:
      - a
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo

  - name: a-range-is-walked-at-every-length-it-holds
    doc: A bounded quantifier of ISO 16.11, feature G060, written over a stretch. Every length the range holds is a shape of its own, so a range of nought to two is three walks: ann itself, the person ann knows, and the person that person knows.
    query: MATCH (a:person WHERE a.name = 'ann') ((x:person)-[:knows]->(y:person)){0,2} (b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-count-with-no-ceiling-on-it-is-refused
    doc: The lengths are walked as patterns of their own, and there is no writing out a list with no end to it, so a stretch quantified with a plus is refused with that as the reason rather than answered for as many lengths as the engine felt like.
    query: MATCH (a:person) ((x:person)-[:knows]->(y:person))+ (b:person) RETURN count(*) AS a
    raises: "42001"

  - name: a-name-inside-a-stretch-of-several-lengths-is-out-of-reach
    doc: A name inside a repeated stretch stands for the elements every repetition bound, which are in a different place in each of the lengths, and the row that leaves the fork holds one column per name rather than one per step. Binding it costs nothing, so it is the reading of the name that is refused.
    query: MATCH (a:person) ((x:person)-[:knows]->(y:person))? (b:person) RETURN x AS a
    raises: "42002"

  - name: a-stretch-of-several-lengths-is-not-a-shape-to-write
    doc: An INSERT describes one shape to make, and a stretch of several lengths describes several, so there is no answer to how many elements it asked for. It is refused where it is written.
    query: INSERT (a:person) ((x:person)-[:knows]->(y:person))? (b:person)
    raises: "42001"

  - name: a-simplified-stretch-is-the-pattern-it-abbreviates
    doc: A simplified path pattern of ISO 16.12, feature G039, writes a stretch of edges between one pair of slashes and leaves the nodes between them unwritten. One label is one step, so this asks what the arrow written the long way asks and answers the three edges of the fixture.
    query: MATCH (a:person)-/ knows /->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: two-labels-in-a-simplified-stretch-are-two-steps
    doc: Labels written one after another are steps one after another, with a node nobody named between them, so this walks two edges. Ann knows bo and bo knows cy is one such walk and the edge that runs from di to di, walked twice, is the other, which is the same pair of walks the two steps written the long way answer.
    query: MATCH (a:person)-/ knows knows /->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-bar-in-a-simplified-stretch-is-either-label-on-one-step
    doc: The bar inside the slashes separates labels rather than walks, so a label written on both sides of it is the one label and the step is walked once. Anything else would count the same edge twice.
    query: MATCH (a:person)-/ knows|knows /->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-quantifier-in-a-simplified-stretch-repeats-what-it-follows
    doc: A count behind a label repeats that step, so a range of one to two hops answers the three walks of one edge and the one walk of two.
    query: MATCH (a:person)-/ knows{1,2} /->(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-step-may-override-the-direction-the-arrow-set
    doc: The arrow around the slashes says which way every step goes, and a step overrides it by writing an arrowhead of its own, which is ISO 16.12, features G081 and G082. The arrow here walks an edge either way round and the override narrows it to the way the edges run.
    query: MATCH (a:person)-/ knows> /-(b:person) RETURN count(*) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-label-expression-a-single-typed-edge-cannot-answer-is-refused
    doc: An edge is stored under exactly one type in this engine, so a negated label on a step describes something no edge of it can be asked about. It is refused by name where it is written rather than answered as though the negation had been dropped.
    query: MATCH (a:person)-/ !knows /->(b:person) RETURN count(*) AS a
    raises: "42001"

  - name: path-length-counts-the-edges-of-a-walk
    doc: Feature GF04, ISO 20.22. The length of a path is its edges and not its elements, and the two are different numbers that are both integers, so an engine answering with the element count would be believed. The walk asked about here is ann to bo to cy.
    query: MATCH p = (a:person)-[:knows]->(b:person)-[:knows]->(c:person) WHERE a.name = 'ann' RETURN path_length(p) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: path-length-of-a-path-of-one-node
    doc: A path of one node has no edges and is the shortest path there is. There is no empty path, a path being a walk and a walk starting somewhere, so nought is the bottom of this number.
    query: MATCH (a:person) WHERE a.name = 'ann' RETURN path_length(PATH [a]) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: path-length-of-null-is-null
    doc: The path functions answer null for a null path rather than nought, which is what an optional match that found nothing hands them.
    query: RETURN path_length(null) AS a
    columns:
      - a
    rows:
      - values:
          - type: NULL

  - name: path-length-refuses-a-list
    doc: A list of the elements of a walk is not the walk, so it has no path length. Answering the element count anyway would let a query that lost its path on the way in look like it still had one.
    query: RETURN path_length([1, 2, 3]) AS a
    raises: "22G03"

  - name: elements-answers-the-whole-walk
    doc: ISO 20.16. A path is a value of its own and nothing indexes into one, so ELEMENTS is how a query reads what a path holds. A walk of two edges is five elements, a node at each end and an edge between each pair.
    query: MATCH p = (a:person)-[:knows]->(b:person)-[:knows]->(c:person) WHERE a.name = 'ann' RETURN size(elements(p)) AS a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "5"

  - name: elements-answers-the-walk-in-the-order-it-was-taken
    doc: The list is the elements the path holds and in the same places, so it equals the list the query can write out of the names the pattern bound. An engine answering the same elements in another order passes a count and fails this.
    query: MATCH p = (a:person)-[e:knows]->(b:person) WHERE a.name = 'ann' RETURN (elements(p) = [a, e, b]) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: elements-refuses-a-list
    doc: A list is already the list of its elements, so asking a list for them is a query that has lost the path it meant to ask about.
    query: RETURN elements([1, 2, 3]) AS a
    raises: "22G03"

  - name: a-path-built-from-elements-equals-the-path-that-was-matched
    doc: Features GE06 and GA09 together. The constructor of ISO 20.14 builds a path out of the elements a pattern bound, and the only thing that says it built the same walk the pattern matched is that the two are equal.
    query: MATCH p = (a:person)-[e:knows]->(b:person) WHERE a.name = 'ann' RETURN (PATH [a, e, b] = p) AS a
    columns:
      - a
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-built-path-has-to-be-a-walk-somebody-could-take
    doc: The elements have to join. An edge between two nodes it does not touch is the interesting case, because the sequence is the right shape and the right kinds, so nothing but the graph can tell it is wrong. Here the edge runs from di to di and neither end of it is ann.
    query: MATCH (a:person), (d:person)-[e:knows]->(d) WHERE a.name = 'ann' AND d.name = 'di' RETURN PATH [a, e, d] AS a
    raises: "22G0Z"
