schema: 4
suite: scalar
doc: The values that cross a language boundary badly. Every case here is one a client has got wrong somewhere, which is why the corpus starts with them rather than with the ones that work everywhere.

cases:
  - name: int64-max
    doc: The largest INT64. A client that hands its integers to a double gives back 9223372036854775808, which is not a value at all.
    query: RETURN 9223372036854775807 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "9223372036854775807"

  - name: int64-min
    doc: The smallest INT64, written as a subtraction because the engine reads -9223372036854775808 as a negation of a literal that is itself out of range.
    query: RETURN -9223372036854775807 - 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "-9223372036854775808"

  - name: int64-beyond-double
    doc: The smallest positive integer a double cannot represent. A client that rounds gives back 9007199254740992, one less, and every other integer case in this file would still pass.
    query: RETURN 9007199254740993 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "9007199254740993"

  - name: int8-by-cast
    doc: A narrow integer, which a client is free to give back in a narrower host type than it uses for INT64 and has to give back with the same value either way.
    query: RETURN cast(1 AS INT8) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT8
            value: 1

  - name: int-out-of-range-cast
    doc: A cast that does not fit raises rather than wrapping, because a silently truncated integer is the same defect as a rounded one with a different cause.
    query: RETURN cast(300 AS INT8) AS n
    raises: "22003"

  - name: float-exact-half
    doc: A float a double holds exactly, which is the only kind a case can assert without saying how it was rounded.
    query: RETURN 1.5 AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "1.5"

  - name: float-not-exact
    doc: The sum every language's tutorial opens with. The answer is not 0.3 and a client that prints it as 0.3 has lost a digit that the next comparison will want.
    query: RETURN 0.1 + 0.2 AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "0.30000000000000004"

  - name: float-negative-zero
    doc: Negative zero is a different value from zero, it compares equal to it, and a client that normalises it away has changed an answer the user can still see the sign of.
    query: RETURN -0.0 AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "-0.0"

  - name: float-infinity
    doc: An overflow gives infinity rather than raising, and infinity has no JSON spelling, so a client that goes through JSON has to have decided what to do here.
    query: RETURN 1e308 * 10 AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "inf"

  - name: divide-by-zero
    doc: Integer division by zero raises 22012 rather than giving infinity, which is the arithmetic the standard asks for and not the one the hardware does.
    query: RETURN 1 / 0 AS n
    raises: "22012"

  - name: bool-both
    doc: Both booleans in one row, because a client that returns a truthy value rather than a boolean passes a test that only ever asks about true.
    query: RETURN true AS t, false AS f
    columns:
      - t
      - f
    rows:
      - values:
          - type: BOOL
            value: true
          - type: BOOL
            value: false

  - name: null-literal
    doc: A null is a value and not a missing column, and it arrives beside a value in the same row so that a client cannot answer by dropping the field.
    query: RETURN null AS a, 1 AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: NULL
          - type: INT64
            value: "1"

  - name: string-unicode
    doc: Characters outside the basic plane and a combining mark, because a client counting UTF-16 units or normalising the text gives back something a byte comparison fails on.
    query: RETURN 'héllo ☃ 𝄞' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "héllo ☃ 𝄞"

  - name: string-empty
    doc: The empty string is a string, and a client that gives back a null for it has answered a different question.
    query: RETURN '' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: ""

  - name: list-of-int
    doc: A list of the widest integers, which is where a client that decodes lists on a separate path from scalars first shows it.
    query: RETURN [1, 9007199254740993] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: INT64
                value: "9007199254740993"

  - name: list-empty
    doc: An empty list is a list, and a client that gives back a null for it has answered a different question.
    query: RETURN [] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:

  - name: list-mixed
    doc: A list whose elements are not all one type, which a client with a typed list has to decide about rather than discover in production.
    query: RETURN [1, 'a', null] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "1"
              - type: STRING
                value: a
              - type: NULL

  - name: rows-in-order
    doc: Two rows, in the order the statement produces them, because a client that hands back an unordered collection makes every later case ambiguous.
    query: UNWIND [1, 2] AS n RETURN n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "2"

  - name: no-rows
    doc: A statement that matches nothing gives back a result with no rows, which is not an error and not a null row.
    query: UNWIND [1] AS n WITH n WHERE false RETURN n
    columns:
      - n
    rows:

  - name: a-record-named-by-its-type
    doc: The record constructor of ISO 20.18 may name what it is building the way the list constructor does, and the name changes nothing about the record. The field is read back here rather than the record itself, because the wire encoding of this corpus has no record value and a client is not asked to invent one.
    query: RETURN (RECORD {a: 1, b: 2}).b AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-record-with-and-without-its-name
    doc: The name is optional, so the two ways of writing one record build the same record and compare equal.
    query: RETURN RECORD {a: 1} = {a: 1} AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-cardinality-of-a-record-is-its-field-count
    doc: A record is one of the four things ISO 20.10 gives CARDINALITY, and what it counts is the fields. Reading the count rather than the record is what lets this case be written at all, since the wire encoding of this corpus has no record value.
    query: RETURN cardinality(RECORD {a: 1, b: 2}) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: the-cardinality-of-a-record-with-no-fields
    doc: A record may hold nothing, and it has a cardinality of zero rather than no cardinality. A client that treats an empty record as a null loses this row.
    query: RETURN cardinality({}) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: size-refuses-a-record
    doc: SIZE is the list function of ISO 20.10 and CARDINALITY is the general one, so the count of a record is written with the second name only and asking for it with the first raises.
    query: RETURN size(RECORD {a: 1}) AS n
    raises: "22G03"

  - name: record-is-still-a-name
    doc: The word is a constructor only when a brace follows it, so a query may still bind a variable called record and read it back.
    query: LET record = 'kept' RETURN record AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: kept

  - name: the-working-graph-is-a-value
    doc: ISO 19.6 lets a graph stand where a value stands, and CURRENT_PROPERTY_GRAPH is the graph the statement is already running against. The answer is a reference and not the graph, so what is asked here is the type of it, which is the one thing about a reference every engine can agree on.
    query: RETURN CURRENT_PROPERTY_GRAPH IS TYPED GRAPH AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-short-and-long-spellings-name-one-graph
    doc: CURRENT_GRAPH and CURRENT_PROPERTY_GRAPH are the same words twice, as they are in the USE clause, so the two references are references to one graph and compare equal. Two references are equal when they name the same graph, which is what makes a reference a value rather than a moment.
    query: RETURN CURRENT_GRAPH = CURRENT_PROPERTY_GRAPH AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-session-that-has-not-moved-is-in-its-home-graph
    doc: The home graph is the one a session started in and the working graph is the one it is in now, and nothing here has moved it, so the two name one graph. A client that answers false has either moved the session or is comparing when the references were taken rather than what they name.
    query: RETURN HOME_PROPERTY_GRAPH = CURRENT_PROPERTY_GRAPH AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: graph-is-still-a-name
    doc: The words that name a graph are whole references on their own, and graph is not one of them, so a query may still bind a variable called graph and read it back.
    query: LET graph = 'kept' RETURN graph AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: kept

  - name: a-name-that-lives-for-one-expression
    doc: ISO 20.5 lets an expression name a value for its own length, which is the LET clause said in a smaller place. The name is worked out once however often the body reads it, and the answer says nothing about that, so what is asked here is the plain reading.
    query: RETURN LET n = 2 + 3 IN n * n END AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "25"

  - name: a-later-name-reads-an-earlier-one
    doc: The definitions are read in the order they are written and each is in scope for the ones after it, so a pair where the second is about the first means what it looks like.
    query: RETURN LET a = 4, b = a + 1 IN a * b END AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "20"

  - name: let-is-still-a-name
    doc: The word opens an expression only where a definition follows it, which is a name with an equals sign behind it, so a query may still bind a variable called let and read it back.
    query: LET let = 'kept' RETURN let AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: kept
