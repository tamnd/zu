schema: 3
suite: stored
doc: Values put in through a client's bulk load path and read back out through a query. Every other suite asks what a value means on the way out, which is half the question, because a client that decodes a date correctly and encodes it a day early is still wrong and no expression can catch that. Here the value crosses the boundary twice and by two different mechanisms, so a client passes only if its loader and its reader agree with each other and with this file.

load:
  nodes: person
  edges: knows
  count: 4
  columns:
    - name: age
      type: INT64
      values:
        - "30"
        - "40"
        - "50"
        - "40"
    - name: big
      type: INT64
      values:
        - "9223372036854775807"
        - "-9223372036854775808"
        - "0"
        - "-1"
    - name: name
      type: STRING
      values:
        - ann
        - bo
        - cy
        - di
    - name: tag
      type: STRING
      values:
        - ""
        - "héllo"
        - "a\tb"
        - "🙂"
    - name: ok
      type: BOOL
      values:
        - true
        - false
        - true
        - false
    - name: score
      type: FLOAT64
      values:
        - "0.1"
        - "-0.0"
        - "3.141592653589793"
        - "1e308"
    - name: born
      type: DATE
      values:
        - "0001-01-01"
        - "9999-12-31"
        - "2000-02-29"
        - "1970-01-01"
    - name: wake
      type: LOCALTIME
      values:
        - "00:00:00"
        - "12:34:56.789"
        - "23:59:59.999999999"
        - "06:00:00"
    - name: seen
      type: LOCALDATETIME
      values:
        - "1970-01-01T00:00:00"
        - "2000-02-29T12:00:00"
        - "2024-12-31T23:59:59.5"
        - "1999-12-31T23:59:59"
    - name: took
      type: DURATION
      values:
        - "PT1S"
        - "PT1H30M"
        - "P1D"
        - "PT0S"
    - name: span
      type: DURATION
      values:
        - "P1Y"
        - "P2M"
        - "P1Y6M"
        - "P3Y"
  pairs:
    - from: 0
      to: 1
    - from: 1
      to: 2
    - from: 0
      to: 2

cases:
  - name: every-row-of-the-load-is-a-node
    doc: The count of the rows, which is the first thing a loader can get wrong and the one that makes every case below meaningless if it is wrong.
    query: MATCH (n:person) RETURN count(*) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: an-integer-column-comes-back-in-the-order-it-went-in
    doc: The whole integer column, gathered in the order the rows were written, so that a loader that permutes its input fails here rather than passing every single value case by accident.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.age) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "30"
              - type: INT64
                value: "40"
              - type: INT64
                value: "50"
              - type: INT64
                value: "40"

  - name: the-integer-extremes-survive-the-store
    doc: The two ends of the signed 64 bit range and the two values next to zero, which is where a loader that hands its values over as unsigned turns the smallest into the largest.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.big) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "9223372036854775807"
              - type: INT64
                value: "-9223372036854775808"
              - type: INT64
                value: "0"
              - type: INT64
                value: "-1"

  - name: a-string-column-comes-back-byte-for-byte
    doc: Four strings a client has to hand over as bytes, being an empty one, one with a two byte code point, one with a tab in it, and one outside the basic plane, which between them catch a loader that measures length in the wrong unit.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.tag) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: STRING
                value: ""
              - type: STRING
                value: "héllo"
              - type: STRING
                value: "a\tb"
              - type: STRING
                value: "🙂"

  - name: a-stored-empty-string-is-a-value-and-not-a-missing-one
    doc: The empty string read back on its own and asked whether it is null, which is the question a client that keeps strings as pointers and treats the null pointer as absent gets wrong.
    query: MATCH (n:person) WHERE n.name = 'ann' RETURN n.tag AS a, n.tag IS NULL AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: STRING
            value: ""
          - type: BOOL
            value: false

  - name: a-boolean-column-comes-back
    doc: The truth values in row order, which a client storing them as one byte per row and reading them back as a bit set gets wrong in a way no single value catches.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.ok) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: BOOL
                value: true
              - type: BOOL
                value: false
              - type: BOOL
                value: true
              - type: BOOL
                value: false

  - name: a-float-column-comes-back-bit-for-bit
    doc: Four doubles that are each their own hazard, being one that no decimal writes exactly, a negative zero, the closest double to pi, and one near the top of the range.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.score) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: FLOAT64
                value: "0.1"
              - type: FLOAT64
                value: "-0.0"
              - type: FLOAT64
                value: "3.141592653589793"
              - type: FLOAT64
                value: "1e308"

  - name: a-stored-negative-zero-keeps-its-sign
    doc: Negative zero read back on its own, which compares equal to zero everywhere and so survives every comparison a client might check itself with, leaving the sign bit as the only evidence.
    query: MATCH (n:person) WHERE n.name = 'bo' RETURN n.score AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "-0.0"

  - name: a-date-column-comes-back
    doc: Four dates including both ends of the range and a leap day, which is the column a client with a day count and an epoch of its own has to translate in both directions.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.born) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: DATE
                value: "0001-01-01"
              - type: DATE
                value: "9999-12-31"
              - type: DATE
                value: "2000-02-29"
              - type: DATE
                value: "1970-01-01"

  - name: the-ends-of-the-date-range-survive-the-store
    doc: The earliest and latest stored dates found by aggregating the column, which is the same two values reached by a path that compares them rather than one that lists them.
    query: MATCH (n:person) RETURN min(n.born) AS a, max(n.born) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: DATE
            value: "0001-01-01"
          - type: DATE
            value: "9999-12-31"

  - name: a-localtime-column-keeps-every-digit
    doc: Times at both ends of the day, one with three fraction digits and one with nine, which a client keeping the time in milliseconds cannot hold and has to say so rather than round.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.wake) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: LOCALTIME
                value: "00:00:00"
              - type: LOCALTIME
                value: "12:34:56.789000000"
              - type: LOCALTIME
                value: "23:59:59.999999999"
              - type: LOCALTIME
                value: "06:00:00"

  - name: a-localdatetime-column-comes-back
    doc: Datetimes on either side of the epoch, one of them a leap day and one of them the last second of a year, which is where a client that stores the date and the time apart loses the carry.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.seen) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: LOCALDATETIME
                value: "1970-01-01T00:00:00"
              - type: LOCALDATETIME
                value: "2000-02-29T12:00:00"
              - type: LOCALDATETIME
                value: "2024-12-31T23:59:59.500000000"
              - type: LOCALDATETIME
                value: "1999-12-31T23:59:59"

  - name: a-day-time-duration-column-comes-back
    doc: Durations counted in seconds, including a zero and one written in a unit larger than the one it is kept in, which pins the normal form a client reads back rather than the text it wrote.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.took) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: DURATION
                value: "PT1S"
              - type: DURATION
                value: "PT1H30M"
              - type: DURATION
                value: "P1D"
              - type: DURATION
                value: "PT0S"

  - name: a-year-month-duration-column-comes-back
    doc: Durations counted in months, which are the other kind and are kept in a different column even though they are written with the same letters, so a loader with one duration type fails here.
    query: MATCH (n:person) WITH n ORDER BY n.name RETURN collect(n.span) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: DURATION
                value: "P1Y"
              - type: DURATION
                value: "P2M"
              - type: DURATION
                value: "P1Y6M"
              - type: DURATION
                value: "P3Y"

  - name: the-columns-of-one-row-belong-to-that-row
    doc: Five columns of a single row read together, which is the case that catches a loader that gets every column right and puts one of them in against the wrong row.
    query: MATCH (n:person) WHERE n.name = 'cy' RETURN n.age AS a, n.ok AS b, n.born AS c, n.wake AS d, n.took AS e
    columns:
      - a
      - b
      - c
      - d
      - e
    rows:
      - values:
          - type: INT64
            value: "50"
          - type: BOOL
            value: true
          - type: DATE
            value: "2000-02-29"
          - type: LOCALTIME
            value: "23:59:59.999999999"
          - type: DURATION
            value: "P1D"

  - name: filtering-on-a-stored-integer
    doc: A comparison against a stored column, which is the value going the other way through the boundary because the engine reads it where the client wrote it.
    query: MATCH (n:person) WHERE n.age > 35 RETURN count(*) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: filtering-on-a-stored-string
    doc: A stored string compared with a literal, which fails for a loader that wrote a length prefix the reader does not expect or a terminator it does not strip.
    query: MATCH (n:person) WHERE n.name = 'di' RETURN n.age AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "40"

  - name: filtering-on-a-stored-boolean
    doc: A stored truth value used as a condition without being compared to anything, which is where a client that wrote something other than zero and one for false and true is found out.
    query: MATCH (n:person) WHERE n.ok RETURN count(*) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: filtering-on-a-stored-date
    doc: A stored date compared with a date literal, which is the comparison a client that stored the date as text passes and a client that stored it in the wrong epoch fails.
    query: MATCH (n:person) WHERE n.born < DATE '1980-01-01' RETURN count(*) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: ordering-by-a-stored-column
    doc: The rows sorted by a stored number with the name breaking the tie, which pins both the order and the tie rather than leaving the equal pair free to fall either way.
    query: MATCH (n:person) RETURN n.name AS who ORDER BY n.age, n.name
    columns:
      - who
    rows:
      - values:
          - type: STRING
            value: ann
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: di
      - values:
          - type: STRING
            value: cy

  - name: ordering-descending-by-a-stored-column
    doc: The same sort the other way round, which a client that reverses the comparison rather than the result gets wrong on the tie.
    query: MATCH (n:person) RETURN n.name AS who ORDER BY n.age DESC, n.name DESC
    columns:
      - who
    rows:
      - values:
          - type: STRING
            value: cy
      - values:
          - type: STRING
            value: di
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: ann

  - name: the-aggregates-of-a-stored-column
    doc: The four aggregates over the stored numbers at once, where the average comes back as a double even though every value in the column is an integer.
    query: MATCH (n:person) RETURN min(n.age) AS a, max(n.age) AS b, sum(n.age) AS c, avg(n.age) AS d
    columns:
      - a
      - b
      - c
      - d
    rows:
      - values:
          - type: INT64
            value: "30"
          - type: INT64
            value: "50"
          - type: INT64
            value: "160"
          - type: FLOAT64
            value: "40.0"

  - name: counting-the-distinct-values-of-a-stored-column
    doc: Three distinct numbers in four rows, which counts the values and not the rows and so catches a reader that compares the rows by their position.
    query: MATCH (n:person) RETURN count(DISTINCT n.age) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: collecting-a-stored-column-over-no-rows
    doc: A filter no stored row satisfies, which gathers an empty list rather than a null and rather than no row at all.
    query: MATCH (n:person) WHERE n.age > 1000 RETURN collect(n.age) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:

  - name: arithmetic-over-a-stored-column
    doc: A stored number in an expression, which is the value being read into the engine's own numeric type rather than handed straight back to the client.
    query: MATCH (n:person) WHERE n.name = 'ann' RETURN n.age * 2 + 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "61"

  - name: a-stored-integer-casts-to-text
    doc: A stored number turned into a string, which is the same conversion a client applies when it prints a row and so pins the digits rather than the client's own formatter.
    query: MATCH (n:person) WHERE n.name = 'ann' RETURN cast(n.age AS STRING) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "30"

  - name: a-stored-string-has-a-size
    doc: The code points of every stored string added up, which is nine because the empty one contributes nothing and the emoji contributes one rather than four.
    query: MATCH (n:person) RETURN sum(size(n.tag)) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "9"

  - name: a-duration-added-to-a-stored-date
    doc: A stored leap day with a day added to it, which lands in March and is the arithmetic a client that stored the date as a month and a day cannot do.
    query: MATCH (n:person) WHERE n.name = 'cy' RETURN n.born + DURATION 'P1D' AS n
    columns:
      - n
    rows:
      - values:
          - type: DATE
            value: "2000-03-01"

  - name: a-stored-duration-added-to-a-stored-date
    doc: Two stored columns of two different types in one expression, which is the strongest form of the round trip because both operands crossed the boundary and neither was written in the query.
    query: MATCH (n:person) WHERE n.name = 'cy' RETURN n.born + n.took AS n
    columns:
      - n
    rows:
      - values:
          - type: DATE
            value: "2000-03-01"

  - name: a-stored-value-goes-into-a-list
    doc: Stored values gathered into a list by the query rather than by an aggregate, which puts a value that came out of the store back into a container on the way out.
    query: MATCH (n:person) WHERE n.name = 'ann' RETURN [n.age, n.big] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: INT64
                value: "30"
              - type: INT64
                value: "9223372036854775807"

  - name: a-stored-value-compares-with-another-stored-value
    doc: Two columns of one row compared against each other, which is a comparison the query never sees the operands of and so tests the store rather than the reader.
    query: MATCH (n:person) WHERE n.age > n.big RETURN n.name AS who ORDER BY who
    columns:
      - who
    rows:
      - values:
          - type: STRING
            value: bo
      - values:
          - type: STRING
            value: cy
      - values:
          - type: STRING
            value: di

  - name: a-stored-string-orders-by-code-point
    doc: The stored strings sorted, where the empty one comes first and the emoji last, which is the order of the code points and not of any locale.
    query: MATCH (n:person) RETURN n.tag AS n ORDER BY n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: ""
      - values:
          - type: STRING
            value: "a\tb"
      - values:
          - type: STRING
            value: "héllo"
      - values:
          - type: STRING
            value: "🙂"

  - name: stored-temporals-order-by-their-instant
    doc: The stored datetimes sorted, which is the order of the moments they name and not of the text they were written in, though here the two happen to agree.
    query: MATCH (n:person) RETURN n.seen AS n ORDER BY n
    columns:
      - n
    rows:
      - values:
          - type: LOCALDATETIME
            value: "1970-01-01T00:00:00"
      - values:
          - type: LOCALDATETIME
            value: "1999-12-31T23:59:59"
      - values:
          - type: LOCALDATETIME
            value: "2000-02-29T12:00:00"
      - values:
          - type: LOCALDATETIME
            value: "2024-12-31T23:59:59.500000000"

  - name: stored-durations-order-by-length
    doc: The stored day time durations sorted, which puts the zero first and the day last and is the order a client that compares them as text gets wrong.
    query: MATCH (n:person) RETURN n.took AS n ORDER BY n
    columns:
      - n
    rows:
      - values:
          - type: DURATION
            value: "PT0S"
      - values:
          - type: DURATION
            value: "PT1S"
      - values:
          - type: DURATION
            value: "PT1H30M"
      - values:
          - type: DURATION
            value: "P1D"

  - name: a-stored-value-groups-the-rows
    doc: The rows grouped by a stored column, which reaches the value through the grouping key rather than through the projection and so tests a third path out of the store.
    query: MATCH (n:person) RETURN n.age AS a, count(*) AS b ORDER BY a
    columns:
      - a
      - b
    rows:
      - values:
          - type: INT64
            value: "30"
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "40"
          - type: INT64
            value: "2"
      - values:
          - type: INT64
            value: "50"
          - type: INT64
            value: "1"

  - name: a-property-no-column-holds-is-null
    doc: ISO 20.11. A property reference to a property the element does not have is null and not an error, which is the same answer an element carrying the property and holding nothing in it gives, so a query cannot tell a property nobody wrote from a property nobody stored. A graph where half the people have a nickname is one column half the rows are null in, and a graph where none of them do is the same question asked of no column.
    query: MATCH (n:person) RETURN n.nickname AS v ORDER BY n.age LIMIT 1
    columns:
      - v
    rows:
      - values:
          - type: NULL

  - name: a-property-no-column-holds-is-null-in-a-predicate
    doc: The same null read where a predicate reads it. A comparison against a null is unknown rather than false, so a filter on a property nobody stored answers no rows and refuses nothing.
    query: MATCH (n:person) WHERE n.nickname = 'ann' RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-divisor-a-row-makes-nought-raises
    doc: ISO 20.21. A divisor of nought is a condition rather than a null or an infinity, and a stored column is where an engine that vectorizes its arithmetic answers it. A kernel that cleared the row's validity instead would read as a row that failed the predicate, so the statement would answer no rows where it has no answer at all.
    query: MATCH (n:person) WHERE n.age / (n.age - n.age) > 0 RETURN count(*) AS c
    raises: "22012"

  - name: a-division-behind-a-guard-never-runs
    doc: The conjuncts of a WHERE are read in the order they were written and a conjunct that decided the row stops the rest, so the guard people write in front of a division is a guard. Nobody here is over a hundred, so the division is never worked out and the statement answers no rows rather than raising.
    query: MATCH (n:person) WHERE n.age > 100 AND 100 / (n.age - 40) > 1 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: the-distance-from-nought-of-a-stored-column
    doc: ISO 20.22. An integer argument keeps its type through the numeric functions, so the distance from nought of a whole number is a whole number and not a float that would lose a digit above two to the fifty third. A stored column is where a vectorized engine answers this a chunk at a time rather than a row at a time.
    query: MATCH (n:person) RETURN abs(n.age - 40) AS a ORDER BY a
    columns:
      - a
    rows:
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "10"
      - values:
          - type: INT64
            value: "10"

  - name: the-bottom-integer-has-no-distance-from-nought
    doc: The one whole number whose distance from nought is not a whole number, because it is one past the top of the type holding it. The standard's 22003 is the answer rather than the number wrapped back to itself, which is what an engine computing it without a check hands back.
    query: MATCH (n:person) RETURN abs(n.big) AS a ORDER BY a
    raises: "22003"

  - name: the-sign-of-a-stored-column
    doc: Minus one, nought or one, which is exact whatever arrived and is the one numeric function whose answer is not the type of its argument.
    query: MATCH (n:person) RETURN sign(n.big) AS s ORDER BY s
    columns:
      - s
    rows:
      - values:
          - type: INT64
            value: "-1"
      - values:
          - type: INT64
            value: "-1"
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "1"

  - name: a-numeric-function-in-a-filter
    doc: A call in a predicate, which is the shape that decides whether a whole scan is answered a chunk at a time or a row at a time. The answer has to be the same either way.
    query: MATCH (n:person) WHERE abs(n.age - 40) < 5 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: rounding-a-stored-integer-left-of-the-point
    doc: A negative digit count rounds tens and hundreds, and over the integers it never goes through a float, so a number wider than a double holds is rounded exactly. Halves go away from nought, which is the rule SQL rounds by.
    query: MATCH (n:person) RETURN round(n.age, -2) AS r ORDER BY r
    columns:
      - r
    rows:
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "100"

  - name: a-numeric-function-behind-a-guard-never-runs
    doc: The same rule the division behind a guard follows. Nobody here is over a hundred, so the distance from nought of the bottom integer is never worked out and the statement answers no rows rather than raising.
    query: MATCH (n:person) WHERE n.age > 100 AND abs(n.big) > 0 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-root-of-a-stored-column
    doc: The half of the numeric library whose answer is a float whatever arrived. A whole number in and a float out is the one shape where the answer is wider than the argument, and a square of a whole number is where that answer is exact enough to write down.
    query: MATCH (n:person) RETURN sqrt(n.age * n.age) AS r ORDER BY r
    columns:
      - r
    rows:
      - values:
          - type: FLOAT64
            value: "30.0"
      - values:
          - type: FLOAT64
            value: "40.0"
      - values:
          - type: FLOAT64
            value: "40.0"
      - values:
          - type: FLOAT64
            value: "50.0"

  - name: a-root-below-nought-has-no-answer
    doc: ISO 20.22 defines the square root as the power of one half, so a negative argument is the power function's condition rather than one of its own. A NaN would travel through every comparison below it as false and tell the statement nothing about what went wrong.
    query: MATCH (n:person) RETURN sqrt(n.age - 40) AS r ORDER BY r
    raises: "2201F"

  - name: a-logarithm-of-nought-has-no-answer
    doc: A logarithm is defined for a number above nought and for no other, and the standard names the condition rather than leaving the answer to IEEE arithmetic.
    query: MATCH (n:person) RETURN ln(n.age - 30) AS l ORDER BY l
    raises: "2201E"

  - name: an-inverse-sine-outside-minus-one-to-one-has-no-answer
    doc: The sine of an angle is between minus one and one, so a number outside that is not the sine of anything and the standard says the value is out of range.
    query: MATCH (n:person) RETURN asin(n.score) AS a ORDER BY a
    raises: "22003"

  - name: a-cotangent-where-the-sine-is-nought-has-no-answer
    doc: The cotangent is the cosine over the sine, so where the sine is nought it is a division by nought and is raised as one.
    query: MATCH (n:person) RETURN cot(n.age - 30) AS c ORDER BY c
    raises: "22012"

  - name: an-answer-past-the-top-of-a-float-has-no-answer
    doc: An exponential of a number near the top of the range leaves the range, and an engine that quietly answers infinity has given a wrong answer rather than raised a condition.
    query: MATCH (n:person) RETURN exp(n.score) AS e ORDER BY e
    raises: "22003"

  - name: a-root-in-a-filter
    doc: A call in a predicate over a stored column, which is the shape that decides whether a scan is answered a chunk at a time or a row at a time.
    query: MATCH (n:person) WHERE sqrt(n.age) > 6.5 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: an-angle-read-in-both-directions
    doc: Degrees into radians and back, which is a pair of multiplications and lands within a digit or two of where it started. The test is written as a comparison rather than an equality because the last digit of the trip is the implementation's to lose.
    query: MATCH (n:person) WHERE degrees(radians(n.age)) > 39 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-remainder-of-two-stored-integers
    doc: ISO 20.22. MOD is the modulus operator under a name, so a remainder of two whole numbers is a whole number and carries the sign of the dividend. It is the one of the three two argument functions whose answer is exact, which is why this case can be written as values rather than as a comparison.
    query: MATCH (n:person) RETURN mod(n.age, 7) AS m ORDER BY m
    columns:
      - m
    rows:
      - values:
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "2"
      - values:
          - type: INT64
            value: "5"
      - values:
          - type: INT64
            value: "5"

  - name: a-remainder-in-a-filter
    doc: A remainder in a predicate over a stored column, which is the shape a query picking every nth row is written in and the shape that decides whether a scan is answered a chunk at a time or a row at a time.
    query: MATCH (n:person) WHERE mod(n.age, 20) = 0 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-remainder-by-nought-has-no-answer
    doc: A modulus of a nought divisor is undefined for the reason a division by nought is, and the standard gives it the same condition rather than the infinity or the NaN the hardware would answer.
    query: MATCH (n:person) RETURN mod(n.age, n.age - 40) AS m ORDER BY m
    raises: "22012"

  - name: the-bottom-integer-has-no-remainder-by-minus-one
    doc: The one pair of whole numbers whose remainder is not a whole number, for the reason the distance of the bottom integer from nought is not one. An engine that answers nought here has answered from the hardware rather than from the type.
    query: MATCH (n:person) RETURN mod(n.big, -1) AS m ORDER BY m
    raises: "22003"

  - name: a-remainder-behind-a-guard-never-runs
    doc: The same rule the division behind a guard follows. Nobody here is over a hundred, so the remainder by nought is never worked out and the statement answers no rows rather than raising.
    query: MATCH (n:person) WHERE n.age > 100 AND mod(n.age, n.age - 40) > 0 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: a-power-of-a-stored-column
    doc: A power answers a float whatever arrived, so a whole column comes back wider than it went in. The answer is rounded here because a square worked out through an exponential and a logarithm can land a digit either side of the whole number, and which of those an implementation does is not what this case is about.
    query: MATCH (n:person) RETURN round(power(n.age, 2)) AS p ORDER BY p
    columns:
      - p
    rows:
      - values:
          - type: FLOAT64
            value: "900.0"
      - values:
          - type: FLOAT64
            value: "1600.0"
      - values:
          - type: FLOAT64
            value: "1600.0"
      - values:
          - type: FLOAT64
            value: "2500.0"

  - name: nought-to-a-negative-power-has-no-answer
    doc: ISO 20.22 names two pairs a power has no answer for, and this is the first: nought raised to a negative power is a division by nought written another way.
    query: MATCH (n:person) RETURN power(n.age - 40, -1) AS p ORDER BY p
    raises: "2201F"

  - name: a-negative-number-to-a-fraction-has-no-answer
    doc: The second pair a power has no answer for. A negative number raised to a power that is not whole is not a real number at all, and an engine that answers NaN has let a value travel that every comparison below it reads as false.
    query: MATCH (n:person) RETURN power(n.age - 40, 0.5) AS p ORDER BY p
    raises: "2201F"

  - name: a-power-past-the-top-of-a-float-has-no-answer
    doc: A square of a number near the top of the range leaves the range, and an engine that quietly answers infinity has given a wrong answer rather than raised a condition.
    query: MATCH (n:person) RETURN power(n.score, 2) AS p ORDER BY p
    raises: "22003"

  - name: a-logarithm-in-a-written-base
    doc: LOG takes the base first and the number second, which is the order ISO 20.22 writes it in. The case is a comparison rather than an equality because a logarithm in a base other than the two the library names is worked out as a ratio, and the last digit of that ratio is the implementation's to lose.
    query: MATCH (n:person) WHERE log(2, n.age) > 5 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-logarithm-in-base-one-has-no-answer
    doc: A base of one has every power equal to one, so no number but one has a logarithm in it and one has every logarithm at once. The standard names the condition rather than leaving the answer to a division by nought inside the ratio.
    query: MATCH (n:person) RETURN log(1, n.age) AS l ORDER BY l
    raises: "2201E"

  - name: a-logarithm-in-a-base-of-nought-has-no-answer
    doc: A base has to be above nought as well as not be one, which is the same condition the logarithm of a number that is not above nought raises.
    query: MATCH (n:person) RETURN log(n.age - 30, 8) AS l ORDER BY l
    raises: "2201E"

  - name: the-character-length-of-a-stored-column
    doc: ISO 20.9. CHAR_LENGTH counts characters and OCTET_LENGTH counts bytes, and the two agree on ASCII and nowhere else. The tag column here holds an empty string, a word with an accent in it, a word with a tab in it and one emoji, so a client that measured the encoding where the standard asked for characters answers differently on three of the four rows.
    query: MATCH (n:person) RETURN char_length(n.tag) AS c ORDER BY c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "1"
      - values:
          - type: INT64
            value: "3"
      - values:
          - type: INT64
            value: "5"

  - name: the-octet-length-of-a-stored-column
    doc: The same four strings counted in bytes, which is what they take in the store rather than what a reader sees.
    query: MATCH (n:person) RETURN octet_length(n.tag) AS o ORDER BY o
    columns:
      - o
    rows:
      - values:
          - type: INT64
            value: "0"
      - values:
          - type: INT64
            value: "3"
      - values:
          - type: INT64
            value: "4"
      - values:
          - type: INT64
            value: "6"

  - name: the-two-lengths-part-company-outside-ascii
    doc: The two counts compared against each other on the same row, which is the case an engine measuring both the same way cannot pass whichever of the two it picked. A character takes more than one byte on the accented word and on the emoji, and exactly one on the empty string and on the word with a tab in it.
    query: MATCH (n:person) WHERE char_length(n.tag) < octet_length(n.tag) RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: a-length-in-a-filter
    doc: A count in a predicate over a stored column, which is the shape that decides whether a scan is answered a chunk at a time or a row at a time. Three of these four names are two characters long.
    query: MATCH (n:person) WHERE char_length(n.name) = 2 RETURN count(*) AS c
    columns:
      - c
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: a-length-as-a-grouping-key
    doc: A count standing in a key, which is the shape a report grouping by how long a value is takes. The names are one of three characters and three of two.
    query: MATCH (n:person) RETURN char_length(n.name) AS w, count(*) AS c ORDER BY w
    columns:
      - w
      - c
    rows:
      - values:
          - type: INT64
            value: "2"
          - type: INT64
            value: "3"
      - values:
          - type: INT64
            value: "3"
          - type: INT64
            value: "1"
