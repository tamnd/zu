schema: 4
suite: string
doc: Text, which every language claims to have solved and each of them solved differently. What a character is, how many of them a string has, and whether two strings that look identical are the same string are three questions with three different answers per language, and each one is a case here.

cases:
  - name: ascii
    doc: A plain string, here so that a client failing everything below fails this first and the report says whether the problem is text at all or only the awkward parts of it.
    query: RETURN 'abc' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: abc

  - name: empty
    doc: The empty string is a string, and a client that gives back a null for it has answered a different question.
    query: RETURN '' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: ""

  - name: double-quoted-is-the-same-string
    doc: The two quote characters make the same value, so a client re-emitting the statement cannot change the answer by choosing the other one.
    query: RETURN "abc" AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: abc

  - name: newline-escape
    doc: An escaped newline is one character and not two, which a client counting the source text rather than the value gets wrong.
    query: RETURN 'a\nb' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a\nb"

  - name: tab-escape
    doc: A tab, in double quotes, because the escape rules are the same in both and a client that implemented them once has to have implemented them for both.
    query: RETURN "a\tb" AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a\tb"

  - name: backslash-escape
    doc: An escaped backslash is one backslash. It is the escape most often lost in a client that unescapes twice, once on the way in and once on the way out.
    query: RETURN 'a\\b' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a\\b"

  - name: latin-one-supplement
    doc: A character outside ASCII but inside one byte of Latin-1, which is where a client assuming one byte per character stops being right.
    query: RETURN 'é' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "é"

  - name: outside-the-basic-plane
    doc: A character needing a surrogate pair in UTF-16. A client on a UTF-16 string type has to give back one character here and not two.
    query: RETURN '𝄞' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "𝄞"

  - name: size-counts-characters-not-bytes
    doc: Five characters in six bytes. A client measuring the encoded length answers 6.
    query: RETURN size('héllo') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "5"

  - name: size-counts-characters-not-utf16-units
    doc: One character in two UTF-16 units. A JavaScript client answering with the host string's own length gives 2, and this is the case that says so.
    query: RETURN size('𝄞') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: size-of-empty
    doc: The empty string has no characters, which is not the same fact as it being falsy, and a client answering from truthiness has to be told.
    query: RETURN size('') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "0"

  - name: no-normalisation
    doc: An e with an acute accent written as one character and as two. They look the same and are not the same string, and a client normalising text on the way through makes this true and loses a distinction the user can still see.
    query: RETURN 'é' = 'é' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: sizes-differ-under-no-normalisation
    doc: The other half of the case above, counted rather than compared, because a client that normalises would report the same size for both and this says which size each has.
    query: RETURN size('é') AS a, size('é') AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: INT64
            value: "1"
          - type: INT64
            value: "2"

  - name: concatenation
    doc: Two strings joined. A client that concatenates in a narrower encoding than it returns loses the second half of anything outside it.
    query: RETURN 'héllo ' + '𝄞' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "héllo 𝄞"

  - name: concatenation-with-null
    doc: A join with a null is a null and not the other operand, which is the rule for every operator and is easiest to forget on this one.
    query: RETURN 'a' + null AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: equality
    doc: Two strings with the same characters are the same string, which is the assertion every case above is measured against.
    query: RETURN 'abc' = 'abc' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-is-by-code-point
    doc: Ordering compares code points, so an upper case letter sorts before a lower case one. A client sorting by the host locale puts 'a' first in some locales and this case fails there, which is the point of it.
    query: RETURN 'A' < 'a' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-by-prefix
    doc: A string sorts before another it is a prefix of, which is where a client comparing fixed-width buffers padded with anything has to have padded with nothing.
    query: RETURN '' < 'a' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-past-the-basic-plane
    doc: A character outside the basic plane sorts after one inside it. A UTF-16 client comparing units rather than code points gets this backwards, because a surrogate is numerically below the characters it stands for.
    query: RETURN 'ﬁ' < '𝄞' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: sort-order
    doc: Three strings sorted, so that the pairwise comparisons above are also asserted where a client actually uses them, which is under an ORDER BY it did not implement itself.
    query: UNWIND ['b', 'A', 'a'] AS n RETURN n ORDER BY n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: A
      - values:
          - type: STRING
            value: a
      - values:
          - type: STRING
            value: b

  - name: cast-from-integer
    doc: An integer as text. A client formatting the number itself rather than taking the engine's text has a chance to disagree about the spelling.
    query: RETURN cast(42 AS STRING) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "42"

  - name: cast-to-integer
    doc: Text read back as a number, which is the other direction and the one that can fail.
    query: RETURN cast('42' AS INT64) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "42"

  - name: cast-to-integer-refuses-prose
    doc: Text that is not a number raises 22018 rather than giving zero, which is what several host languages' own parsers do and is the defect this case exists to catch.
    query: RETURN cast('abc' AS INT64) AS n
    raises: "22018"

  - name: carriage-return-escape
    doc: A carriage return written as an escape, which is the character a client running on a system that ends lines with two of them is most likely to add or drop.
    query: RETURN 'a\rb' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a\rb"

  - name: a-quote-escaped-inside-its-own-quotes
    doc: A single quote escaped inside a single quoted string, which is one of two spellings the engine takes and the one a client building queries by hand forgets.
    query: RETURN 'a\'b' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a'b"

  - name: a-double-quote-escaped-inside-its-own-quotes
    doc: The same escape on the other quote, because the two literal forms are two paths through a lexer and a client that tested one has not tested the other.
    query: RETURN "a\"b" AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a\"b"

  - name: a-string-of-one-backslash
    doc: Two characters in the query and one in the value, which is the shortest statement of what an escape is and the case a client doubling backslashes on the way out breaks.
    query: RETURN '\\' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "\\"

  - name: an-escape-is-one-character
    doc: A newline written as two characters counts as one, so length is measured on the value and not on the text that produced it.
    query: RETURN size('\n') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: size-answers-a-wide-integer
    doc: A length goes into arithmetic as a sixty four bit integer, so a client giving back the narrowest type that holds the number disagrees about the type while agreeing about the value.
    query: RETURN size('abc') + 1 AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: size-counts-spaces
    doc: Whitespace is part of the string, which is here so that no client is tempted to trim on the way in or on the way out.
    query: RETURN size('  ') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "2"

  - name: size-counts-every-code-point-of-a-joined-emoji
    doc: A family emoji is three pictures and two joiners and it counts as five, because the unit is the code point and not the thing a reader sees.
    query: RETURN size('👨‍👩‍👧') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "5"

  - name: concatenation-chains
    doc: Three pieces join into one, which says the operator returns a string that can be an operand again rather than a builder a client has to finish.
    query: RETURN 'a' + 'b' + 'c' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "abc"

  - name: concatenation-of-two-empties
    doc: Nothing joined to nothing is the empty string and not a null, which a client representing the empty string as an absent value gets wrong.
    query: RETURN '' + '' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: ""

  - name: a-string-and-a-number-do-not-add
    doc: Plus over a string and an integer raises rather than rendering the number, so a client borrowing its host language's overloading sends something the engine refuses.
    query: RETURN 'abc' + 1 AS n
    raises: "22G03"

  - name: a-number-and-a-string-do-not-add
    doc: The same refusal with the operands the other way round, which is the arrangement a client that checks only its left operand lets through.
    query: RETURN 1 + 'abc' AS n
    raises: "22G03"

  - name: a-string-does-not-multiply
    doc: There is no repetition operator on strings, a thing two popular languages do have, and a client offering it has added an operator to the language.
    query: RETURN 'abc' * 2 AS n
    raises: "22G03"

  - name: ordering-by-the-last-character
    doc: Two strings alike until their end order by the character where they differ, which is the ordinary case the prefix and code point cases sit either side of.
    query: RETURN 'abc' < 'abd' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: ordering-is-not-strict
    doc: A string is less than or equal to itself, so the ordering operators are the four a client has to supply and not two of them.
    query: RETURN 'abc' <= 'abc' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: every-upper-case-letter-sorts-before-every-lower-case-one
    doc: The last upper case letter comes before the first lower case one, because the order is on code points and not on what a reader of a dictionary expects.
    query: RETURN 'Z' < 'a' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: a-tab-sorts-before-a-letter
    doc: A control character is below the printable ones in the same order, which a client comparing with a collation rather than with code points can get wrong.
    query: RETURN '\t' < 'a' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: inequality
    doc: Two different strings are unequal, the operator being separate from equality in more clients than one would think.
    query: RETURN 'abc' <> 'abd' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: case-matters
    doc: A letter is not the same string as its capital, so nothing case folds anywhere, and a client comparing case insensitively agrees with a user and not with the engine.
    query: RETURN 'a' = 'A' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: a-sharp-s-is-not-two-letters
    doc: The German letter does not equal the two letters it uppercases to, which is the case folding a client that reached for a locale aware comparison performs.
    query: RETURN 'ß' = 'SS' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: comparing-with-a-null-is-a-null
    doc: A string against a null is neither true nor false, so a comparison on this type answers three ways and a client with a boolean return type has nowhere to put the third.
    query: RETURN 'abc' > null AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: cast-from-boolean
    doc: A truth value rendered as text is the lower case word, which is one of several spellings a client might have picked and the only one the engine uses.
    query: RETURN cast(true AS STRING) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "true"

  - name: cast-from-float
    doc: A float rendered as text keeps the point, so the text says what type it came from, which the float suite goes into in more detail.
    query: RETURN cast(3.5 AS STRING) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "3.5"

  - name: cast-from-null-is-null
    doc: Casting a null to a string gives a null and not the word null, which a client rendering with its host language's string conversion gets wrong in the quietest way available.
    query: RETURN cast(null AS STRING) AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: cast-to-integer-ignores-surrounding-space
    doc: Space either side of the digits is skipped, so the text a user pastes reads as a number, and a client validating the text itself before sending refuses what the engine takes.
    query: RETURN cast('  42  ' AS INT64) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "42"

  - name: cast-to-integer-refuses-a-fraction
    doc: A number with a point is not an integer even though it names one nearby, so the cast raises rather than truncating.
    query: RETURN cast('42.5' AS INT64) AS n
    raises: "22018"

  - name: cast-to-float
    doc: Digits with no point read as a float and come back with one, because the type of the result is the type asked for and not the shape of the text.
    query: RETURN cast('42' AS FLOAT64) AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "42.0"

  - name: cast-to-float-with-an-exponent
    doc: Exponent notation reads, which is the spelling a client is likeliest to receive from another system and to have to pass through unchanged.
    query: RETURN cast('1e3' AS FLOAT64) AS n
    columns:
      - n
    rows:
      - values:
          - type: FLOAT64
            value: "1000.0"

  - name: a-declared-length-that-fits
    doc: A string cast to a type wide enough for it comes back unchanged, which is the half of the pair that says the length is checked and not applied.
    query: RETURN cast('a' AS STRING(1)) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a"

  - name: a-declared-length-that-does-not-fit
    doc: One character too many raises rather than truncating, so a client shortening the value to fit has lost data and reported success.
    query: RETURN cast('ab' AS STRING(1)) AS n
    raises: "22001"

  - name: a-string-that-cannot-be-null
    doc: A null cast to a type that refuses one raises, which is the same rule the integer suite states and it holds on every type that has it.
    query: RETURN cast(null AS STRING NOT NULL) AS n
    raises: "22004"

  - name: a-varying-length-type-does-not-pad
    doc: A string shorter than the type it is cast to keeps its length, which is what varying means and is the difference the case below turns on.
    query: RETURN cast('abc' AS VARCHAR(10)) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "abc"

  - name: a-fixed-length-type-pads-with-spaces
    doc: The same string cast to a fixed length comes back with spaces on the end, so the type changed the value, and a client trimming what it receives loses the difference between the two casts.
    query: RETURN cast('abc' AS CHAR(5)) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "abc  "

  - name: a-fixed-length-type-of-the-exact-length
    doc: Nothing is added when the string already fills the type, which is here so the case above reads as padding and not as a suffix.
    query: RETURN cast('abc' AS CHAR(3)) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "abc"

  - name: a-string-is-not-null
    doc: The empty string is a value and the test says so, which is the case a client mapping absent and empty onto one host value fails.
    query: RETURN '' IS NULL AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: false

  - name: a-string-is-in-a-list
    doc: Membership uses the same equality the comparison cases pin, so a client with one equality for values and another for lists has two answers here.
    query: RETURN 'abc' IN ['abc', 'd'] AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: strings-in-a-list
    doc: Strings nest inside a list, which is a second decoding path for the type and one where the length prefix is easiest to read from the wrong place.
    query: RETURN ['a', 'b'] AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: STRING
                value: "a"
              - type: STRING
                value: "b"

  - name: the-smallest-string
    doc: A set function over strings uses the order the comparison cases declare rather than an order of its own.
    query: UNWIND ['b', 'a'] AS s RETURN min(s) AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "a"

  - name: the-length-of-the-longest-string
    doc: A length inside an aggregate, which is a function applied per row and then folded, and is how a client finds out whether it decoded every row or only the first.
    query: UNWIND ['a', 'bb', 'ccc'] AS s RETURN max(size(s)) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "3"

  - name: strings-collect-into-a-list
    doc: Rows folded into one list value, which puts the type inside a container that the client built rather than one the query wrote.
    query: UNWIND ['a', 'b'] AS s RETURN collect(s) AS n
    columns:
      - n
    rows:
      - values:
          - type: LIST
            value:
              - type: STRING
                value: "a"
              - type: STRING
                value: "b"

  - name: distinct-strings
    doc: Three rows of two strings give two rows, which is the client's equality used to deduplicate and the last place a normalising client differs from the engine.
    query: UNWIND ['b', 'a', 'b'] AS n RETURN DISTINCT n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "b"
      - values:
          - type: STRING
            value: "a"

  - name: two-strings-joined
    doc: The concatenation operator of ISO 20.23, which is the one operator a string has that a number does not, and is written apart from the plus so that a query says which of the two it meant.
    query: RETURN 'ab' || 'cd' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: abcd

  - name: a-join-of-three-strings-folds-to-the-left
    doc: Three operands and one answer, so an engine that read the operator as anything but left associative still answers the same string and an engine that read it as a label alternation does not.
    query: RETURN 'a' || 'b' || 'c' AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: abc

  - name: a-join-with-a-null-in-it-is-null
    doc: The rule every operator here shares, which is what keeps a joined string from quietly gaining the four letters of the word null.
    query: RETURN 'ab' || NULL AS n
    columns:
      - n
    rows:
      - values:
          - type: NULL

  - name: a-join-binds-tighter-than-a-comparison
    doc: The precedence ISO gives the operator, so this asks whether the joined string is the one written rather than joining a string to a boolean.
    query: RETURN 'ab' || 'cd' = 'abcd' AS n
    columns:
      - n
    rows:
      - values:
          - type: BOOL
            value: true

  - name: the-characters-of-a-string-counted
    doc: CHAR_LENGTH of ISO 20.22, which counts characters and not bytes, so a client that measured the encoding answers differently here than the engine does.
    query: RETURN CHAR_LENGTH('abcd') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: the-characters-and-the-bytes-of-one-string
    doc: The same string under both lengths. The character is one character and three bytes of UTF-8, which is the whole difference between the two questions.
    query: RETURN CHAR_LENGTH('日') AS c, OCTET_LENGTH('日') AS o
    columns:
      - c
      - o
    rows:
      - values:
          - type: INT64
            value: "1"
          - type: INT64
            value: "3"

  - name: character-length-is-the-same-word-written-out
    doc: ISO gives the function two spellings and neither is preferred, so an engine reading only the short one leaves half of the standard's text unparseable.
    query: RETURN CHARACTER_LENGTH('abcd') AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "4"

  - name: a-string-folded-up-and-down
    doc: The fold of ISO 20.24 in both directions, which is where a client's locale used to decide the answer and where the standard says the collation does.
    query: RETURN UPPER('aB') AS u, LOWER('aB') AS l
    columns:
      - u
      - l
    rows:
      - values:
          - type: STRING
            value: AB
          - type: STRING
            value: ab

  - name: the-spaces-taken-off-both-ends-of-a-string
    doc: TRIM with only a source, which is the one form of it every implementation must have, and it takes spaces off both ends and nothing out of the middle.
    query: RETURN TRIM('  a b  ') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: a b

  - name: a-string-function-over-a-null-is-null
    doc: Four functions asked about nothing, which is the row an OPTIONAL MATCH leaves behind, and each answers null rather than the empty string.
    query: RETURN CHAR_LENGTH(NULL) AS a, UPPER(NULL) AS b, LOWER(NULL) AS c, TRIM(NULL) AS d
    columns:
      - a
      - b
      - c
      - d
    rows:
      - values:
          - type: NULL
          - type: NULL
          - type: NULL
          - type: NULL

  - name: normalize-composes-and-decomposes
    doc: The same letter written two ways, one character with an accent on it and the letter followed by a combining accent, meet under the two canonical forms. A client whose normalization is a no-op passes the first of these and fails the second.
    query: RETURN NORMALIZE('é', NFC) AS a, NORMALIZE('é', NFD) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: STRING
            value: "é"
          - type: STRING
            value: "é"

  - name: normalize-defaults-to-nfc
    doc: The form is optional and defaults to NFC, which is what ISO 20.24 defaults it to. A client that defaults it to no normalization at all answers the argument unchanged.
    query: RETURN NORMALIZE('é') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: "é"

  - name: the-compatibility-forms-lose-the-formatting
    doc: The fi ligature has no canonical decomposition, because it is not the same character as the two letters it draws, and it has a compatibility one, because it reads as them. That is the whole difference between the K forms and the other two.
    query: RETURN NORMALIZE('ﬁ', NFC) AS a, NORMALIZE('ﬁ', NFKC) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: STRING
            value: "ﬁ"
          - type: STRING
            value: fi

  - name: is-normalized-asks-the-same-question
    doc: The predicate of ISO 19.7 over a string that is in one form and not the other, and over a null, which answers null the way every other predicate over a null does. The form is written in front of the word and not behind it, the production putting the optional NOT and the optional form between IS and NORMALIZED, so an engine that took the form as a suffix reads none of these.
    query: RETURN 'é' IS NFC NORMALIZED AS a, 'é' IS NFD NORMALIZED AS b, NULL IS NORMALIZED AS c
    columns:
      - a
      - b
      - c
    rows:
      - values:
          - type: BOOL
            value: true
          - type: BOOL
            value: false
          - type: NULL

  - name: is-not-normalized-is-the-same-predicate-negated
    doc: The NOT sits inside the predicate rather than in front of it, and the form still stands behind the NOT, so this is the one spelling that tells an engine reading the form as a suffix apart from an engine reading the production.
    query: RETURN 'é' IS NOT NFD NORMALIZED AS a, 'ab' IS NOT NORMALIZED AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: BOOL
            value: true
          - type: BOOL
            value: false

  - name: trim-takes-one-character-off-each-end
    doc: The explicit form of ISO 20.24 with an end named and a character to take off it. BOTH is what the form means when no end is written, and it is written out here so the two cases below read as the halves of this one.
    query: RETURN TRIM(BOTH 'x' FROM 'xax') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: a

  - name: trim-from-the-front-only
    doc: LEADING takes characters off the front and leaves the back alone, so a client that trims both ends whatever the statement asked for answers 'a' here and fails.
    query: RETURN TRIM(LEADING 'x' FROM 'xxay') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: ay

  - name: trim-from-the-back-only
    doc: TRAILING is the other half, and the two together are why the specification is part of the syntax rather than three functions with three names.
    query: RETURN TRIM(TRAILING 'y' FROM 'xxay') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: xxa

  - name: trim-with-no-end-named-takes-both
    doc: The specification may be left out and the character kept, which is the shortest spelling of the explicit form and the one a reader is most likely to write.
    query: RETURN TRIM('x' FROM 'xax') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: a

  - name: trim-with-no-character-named-takes-spaces
    doc: The character may be left out and the end kept, and the character it defaults to is a space rather than every space-like character Unicode has.
    query: RETURN TRIM(BOTH FROM '  a  ') AS n
    columns:
      - n
    rows:
      - values:
          - type: STRING
            value: a

  - name: trim-of-more-than-one-character
    doc: TRIM trims one character and raises 22027 when it is handed a longer string, which is the condition that makes the multi-character functions a separate feature rather than a convenience.
    query: RETURN TRIM(BOTH 'ab' FROM 'abx') AS n
    raises: "22027"

  - name: the-multi-character-trims
    doc: GF05. BTRIM, LTRIM and RTRIM take a set of characters rather than one, and any character of the set is trimmed however often it appears and in whatever order.
    query: RETURN LTRIM('xxay', 'x') AS l, RTRIM('xxay', 'y') AS r, BTRIM('xyaxy', 'xy') AS b
    columns:
      - l
      - r
      - b
    rows:
      - values:
          - type: STRING
            value: ay
          - type: STRING
            value: xxa
          - type: STRING
            value: a

  - name: a-multi-character-trim-with-no-set-named
    doc: The set defaults to a space, the same way the trim character does, so the one argument form of each of the three is the plain question a client asks most often.
    query: RETURN LTRIM('  a') AS l, RTRIM('a  ') AS r, BTRIM('  a  ') AS b
    columns:
      - l
      - r
      - b
    rows:
      - values:
          - type: STRING
            value: a
          - type: STRING
            value: a
          - type: STRING
            value: a

  - name: trimming-a-character-the-string-does-not-have
    doc: Nothing is trimmed and nothing is refused, because a trim is not a match: the string comes back as it was written.
    query: RETURN LTRIM('ay', 'x') AS l, BTRIM('a', '') AS b
    columns:
      - l
      - b
    rows:
      - values:
          - type: STRING
            value: ay
          - type: STRING
            value: a

  - name: a-trim-over-a-null-is-null
    doc: A null on either side answers null, so a row an OPTIONAL MATCH left empty is not the empty string and a set nobody named is not the space it defaults to.
    query: RETURN TRIM(LEADING NULL FROM 'xxa') AS a, LTRIM(NULL) AS b, RTRIM('a', NULL) AS c
    columns:
      - a
      - b
      - c
    rows:
      - values:
          - type: NULL
          - type: NULL
          - type: NULL

  - name: the-first-and-last-characters-of-a-string
    doc: ISO 20.24. LEFT counts from the front and RIGHT from the back, and both count characters, so a string of accented letters answers by the letters a reader sees rather than by the bytes the store keeps.
    query: RETURN LEFT('héllo', 2) AS l, RIGHT('héllo', 2) AS r
    columns:
      - l
      - r
    rows:
      - values:
          - type: STRING
            value: hé
          - type: STRING
            value: lo

  - name: a-substring-of-more-characters-than-the-string-has
    doc: Asking for more than there is answers the string, and asking for none of it answers the empty string, neither being a condition the standard names.
    query: RETURN LEFT('abc', 9) AS l, RIGHT('abc', 9) AS r, LEFT('abc', 0) AS n
    columns:
      - l
      - r
      - n
    rows:
      - values:
          - type: STRING
            value: abc
          - type: STRING
            value: abc
          - type: STRING
            value: ""

  - name: a-substring-of-a-negative-number-of-characters
    doc: A string has no negative number of characters, so the count is refused with the substring error the standard names for it rather than read as a count from the other end.
    query: RETURN LEFT('abc', -1) AS v
    raises: "22011"

  - name: a-substring-over-a-null-is-null
    doc: A null string or a null count answers null, the way every scalar here does, so a row an OPTIONAL MATCH left empty is not the empty string.
    query: RETURN LEFT(NULL, 2) AS a, RIGHT('abc', NULL) AS b
    columns:
      - a
      - b
    rows:
      - values:
          - type: NULL
          - type: NULL

  - name: a-byte-string-literal
    doc: A byte string is written as an X and the octets in hexits, and it is a value of its own and not the characters those octets happen to encode, so a client that hands back the letter A for X'0041' has decoded something the statement never asked it to decode.
    query: RETURN X'00AB00' AS b
    columns:
      - b
    rows:
      - values:
          - type: BYTES
            value: "00AB00"

  - name: an-empty-byte-string
    doc: A byte string of no octets is a value the way the empty string is one, so a client answering null for it has answered a different question.
    query: RETURN X'' AS b
    columns:
      - b
    rows:
      - values:
          - type: BYTES
            value: ""

  - name: either-case-of-hexit-writes-the-same-octets
    doc: The hexits above nine are letters and both cases of them spell the same octet, so a client that keeps the source text rather than the value gives back two different answers for one value.
    query: RETURN X'00ab' AS lowercase, X'00AB' AS uppercase
    columns:
      - lowercase
      - uppercase
    rows:
      - values:
          - type: BYTES
            value: "00AB"
          - type: BYTES
            value: "00AB"

  - name: a-byte-string-is-not-the-string-it-encodes
    doc: The octets of X'0041' are those of a NUL and the letter A in every encoding anyone uses, and the two values are still not equal, because a byte string is a sequence of octets and a character string is a sequence of characters and no comparison between them is defined.
    query: RETURN X'0041' = 'A' AS alike
    columns:
      - alike
    rows:
      - values:
          - type: BOOL
            value: false

  - name: byte-strings-order-by-their-octets
    doc: Octets are all a byte string has to order by, there being no collation over bytes that are not text, and a shorter one that is a prefix of a longer one comes first the way a shorter string does.
    query: RETURN X'00AA' < X'00AB' AS lt, X'00' < X'0000' AS prefix
    columns:
      - lt
      - prefix
    rows:
      - values:
          - type: BOOL
            value: true
          - type: BOOL
            value: true

  - name: the-octets-of-a-byte-string-are-counted
    doc: OCTET_LENGTH is the one length question a byte string answers, and it answers it without decoding anything first, the octets being the value.
    query: RETURN OCTET_LENGTH(X'00AB00') AS n, OCTET_LENGTH(X'') AS empty
    columns:
      - n
      - empty
    rows:
      - values:
          - type: INT64
            value: "3"
          - type: INT64
            value: "0"

  - name: a-byte-string-trimmed-at-both-ends
    doc: The trim family takes a byte string as readily as a string and trims octets rather than characters, which is the whole of GF07.
    query: RETURN OCTET_LENGTH(TRIM(BOTH X'00' FROM X'00AB00')) AS n
    columns:
      - n
    rows:
      - values:
          - type: INT64
            value: "1"

  - name: each-end-of-a-byte-string-trims-on-its-own
    doc: LEADING and TRAILING name one end each over octets the way they name one end each over characters, and the answer is a byte string and not a count.
    query: RETURN TRIM(LEADING X'00' FROM X'00AB00') AS front, TRIM(TRAILING X'00' FROM X'00AB00') AS back
    columns:
      - front
      - back
    rows:
      - values:
          - type: BYTES
            value: "AB00"
          - type: BYTES
            value: "00AB"

  - name: a-set-of-octets-is-trimmed-by-the-three-that-take-one
    doc: BTRIM, LTRIM and RTRIM take as many octets as they are given and stop at the first octet the set does not hold, which is what they do with characters.
    query: RETURN BTRIM(X'0011AB1100', X'0011') AS b, LTRIM(X'0011AB1100', X'0011') AS l, RTRIM(X'0011AB1100', X'0011') AS r
    columns:
      - b
      - l
      - r
    rows:
      - values:
          - type: BYTES
            value: "AB"
          - type: BYTES
            value: "AB1100"
          - type: BYTES
            value: "0011AB"

  - name: the-octet-nobody-wrote-is-nought
    doc: A trim with no octet written trims X'00' and not a space, a space being a character and a byte string having none, and X'00' being the octet a short byte string is padded out with.
    query: RETURN TRIM(X'0000AB0000') AS t
    columns:
      - t
    rows:
      - values:
          - type: BYTES
            value: "AB"

  - name: trimming-more-than-one-octet-is-a-condition
    doc: TRIM trims one octet and says so, the way it trims one character and says so, and a longer one raises the trim error the standard names rather than being read as the set the other three take.
    query: RETURN TRIM(BOTH X'0011' FROM X'00AB') AS t
    raises: "22027"
