[package]
name = "zu-capi"
description = "C API for zu: libzu, the in-process query surface"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The artifact is libzu.{a,so,dylib} and zu.{lib,dll}; the lib target
# takes the name `zu`, so the facade crate (also `zu`) comes in under
# its crates.io name.
#
# Both library forms, because dx/09 C-5 ships both and they answer
# different questions. A shared library is what a package manager
# installs and what several processes share a copy of. A static archive
# is what a binding links into itself so that its users install one
# file, and what a build with no loader at all has to use.
[lib]
name = "zu"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
zu-common.workspace = true
zudb = { package = "zu", path = "../zu" }
# The Arrow export, which is a feature rather than a dependency because
# it is the one part of this library that costs a megabyte to link. On
# by default, since a shipped libzu is what every binding's Arrow path
# goes through; off for an embedder that counts bytes and never exports.
zu-arrow = { workspace = true, features = ["ffi"], optional = true }

[dev-dependencies]
# The import half of the C Data Interface, so that the suite reads back
# what zu_result_arrow writes the way a consumer does rather than by
# looking at the struct.
arrow = { workspace = true, features = ["ffi"] }
tempfile.workspace = true

[features]
default = ["arrow"]
# zu_result_arrow, and the C Data Interface structs it writes. The
# symbol exists either way, because a binding that dlopens a library
# should find out what it can do from a status and not from a missing
# symbol; without this it answers ZU_UNSUPPORTED.
arrow = ["dep:zu-arrow"]

[[bench]]
name = "result"
harness = false

[[bench]]
name = "loader"
harness = false

[lints]
workspace = true
