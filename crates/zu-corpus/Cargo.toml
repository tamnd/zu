[package]
name = "zu-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The cross-client conformance corpus and its Rust runner"

[[bench]]
name = "corpus"
harness = false

[dependencies]
zu.workspace = true
zu-common.workspace = true
# The export the `arrow:` of a case is about. It is a feature rather
# than a plain dependency because it costs a megabyte to link and the
# corpus is read by tools that only want the cases; on by default,
# since a runner that skips the export checks part of the corpus
# without saying so.
zu-arrow = { workspace = true, features = ["ffi"], optional = true }
arrow = { workspace = true, features = ["ffi"], optional = true }

[features]
default = ["arrow"]
arrow = ["dep:zu-arrow", "dep:arrow"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
