[package]
name = "zudb-encoding"
description = "Lightweight columnar encodings for zu (FastLanes, ALP, FSST, cascades)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

# Published as zudb-*, because zu is taken on crates.io, but the
# library keeps the name every crate in this workspace already uses.
[lib]
name = "zu_encoding"

[dependencies]
zu-common.workspace = true
ruzstd.workspace = true
zstd = { workspace = true, optional = true }

[features]
zstd = ["dep:zstd"]

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
