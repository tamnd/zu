[package]
name = "zudb-exec"
description = "Push-based morsel-parallel pipeline executor for zu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

# Published as zudb-*, because zu is taken on crates.io, but the
# library keeps the name every crate in this workspace already uses.
[lib]
name = "zu_exec"

[dependencies]
zu-common.workspace = true
zu-vector.workspace = true
zu-query.workspace = true

[[bench]]
name = "join"
harness = false

[[bench]]
name = "sip"
harness = false

[lints]
workspace = true
