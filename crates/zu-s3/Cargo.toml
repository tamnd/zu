[package]
name = "zudb-s3"
description = "Object-storage-native engine for zu with fixed-cost batching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

# Published as zudb-*, because zu is taken on crates.io, but the
# library keeps the name every crate in this workspace already uses.
[lib]
name = "zu_s3"

[dependencies]
zu-common.workspace = true
zu-storage.workspace = true
crc32c.workspace = true
object_store.workspace = true

[dev-dependencies]
# The "fs" feature exists only so tests can pin down what LocalFileSystem
# does and does not support; the library itself never uses it.
object_store = { workspace = true, features = ["fs"] }
tempfile.workspace = true

[lints]
workspace = true
