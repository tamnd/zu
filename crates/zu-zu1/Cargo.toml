[package]
name = "zudb-zu1"
description = "Native single-file columnar storage engine for zu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

# Published as zudb-*, because zu is taken on crates.io, but the
# library keeps the name every crate in this workspace already uses.
[lib]
name = "zu_zu1"

[dependencies]
zu-common.workspace = true
zu-encoding.workspace = true
crc32c.workspace = true
parquet = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[features]
arrow = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[dev-dependencies]
tempfile.workspace = true

# Compiled only under RUSTFLAGS="--cfg loom" for the suite in
# tests/loom.rs; a plain build never pulls this in.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "open"
harness = false

[[bench]]
name = "blob"
harness = false

[[bench]]
name = "read"
harness = false
