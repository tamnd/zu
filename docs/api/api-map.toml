# The map from the API model to what a binding owes it.
#
# One of these files lives here and classifies the whole public surface. One lives in each binding repository and gives every classified entity the name that binding calls it by. They are the same schema doing two jobs, and `target` says which.
#
# Every entity in `model.json` has to be covered, so a new public symbol that nobody decided about fails CI here rather than shipping unbound in six languages. Check it with `cargo xtask api-map`.
#
# `[[group]]` covers a path prefix and everything under it. Longest prefix wins, so a narrower group is an exception to a wider one and the order of the file carries no meaning. `[[entity]]` names one identifier exactly and beats every group. Groups are what make this file reviewable: `zu::zu1` is five hundred entities and one decision, and writing that decision out five hundred times would hide the twenty entries that are not it.
#
# The tiers:
#
#   1  every tier-1 SDK exposes it, and a release where one does not is a release that fails
#   2  a binding may expose it, and nothing is gated either way
#   3  no binding exposes it, and a `reason` is required
#
# The reason on a tier 3 is the point of that tier. A public symbol nobody binds is a decision, and a decision with no reason written down is one nobody can revisit.
#
# Modules are not mapped. A module is a namespace, and namespaces are the one part of a Rust surface that no binding reproduces: Python flattens them, C prefixes them, Go packages them by repository. Every entity carries its full path already.
#
# This file is sorted, groups by prefix and entities by identifier, and the reader refuses it if it is not, because a ledger nobody can follow a diff of is a ledger nobody reviews.

schema = 1
target = "rust"

[[group]]
prefix = "zu::Appender"
tier = 1
reason = "the bulk load path: a binding that can only load through statements pays a commit per row, which is the difference between a load that takes seconds and one that takes an hour"

[[group]]
prefix = "zu::Batch"
tier = 2
reason = "the rows a streaming sink is handed, borrowed for the length of its call; a binding that gives its user a cursor hands these on, and one that answers with the whole result never names it"

[[group]]
prefix = "zu::CheckpointMode"
tier = 2
reason = "how much work a checkpoint does, which only a binding that exposes checkpointing needs"

[[group]]
prefix = "zu::Column"
tier = 2
reason = "one column of a registered frame: the name, the logical type and the layout the caller's own memory holds it in. A binding that can hand the engine a pointer to a column builds these; one that can only copy rows in through the appender never names it"

[[group]]
prefix = "zu::Config"
tier = 1
reason = "how a database is opened: the memory budget, the thread count, and read-only, which every binding takes as an option map"

[[group]]
prefix = "zu::Connection"
tier = 1
reason = "the object a statement runs on, which is what a binding hands its user"

[[group]]
prefix = "zu::Database"
tier = 1
reason = "the object a process opens once and shares, and the other half of the split every binding inherits"

[[group]]
prefix = "zu::DiagnosticRecord"
tier = 1
reason = "the diagnostic record the standard defines, and half of what an error carries back"

[[group]]
prefix = "zu::Direction"
tier = 2
reason = "traversal direction, which a query says in its text rather than through an argument"

[[group]]
prefix = "zu::DurationKind"
tier = 2
reason = "which of the two durations a value is, year-month or day-time, which a binding needs only where it hands a duration back as something other than a string"

[[group]]
prefix = "zu::Field"
tier = 1
reason = "one value on its way into a column, which is the appender's half of the conversion code every binding writes"

[[group]]
prefix = "zu::FloatBits"
tier = 2
reason = "the width of an approximate number, which goes with the logical type and is read by a binding that describes a column rather than one that only reads its values"

[[group]]
prefix = "zu::Flow"
tier = 2
reason = "what a streaming sink answers to carry on or to stop, which is only a name in a binding that exposes streaming at all"

[[group]]
prefix = "zu::Frame"
tier = 2
reason = "a table of the caller's own memory registered with a session and scanned in place, which is the zero copy read path: a binding that can pin a buffer for the length of a query exposes it, and one whose runtime moves memory under it cannot"

[[group]]
prefix = "zu::FromRow"
tier = 3
reason = "the trait that reads a row into a struct the caller declared, which is Rust asking for a type it named; every other language reads a row as the dynamic thing it already is"

[[group]]
prefix = "zu::FromValue"
tier = 3
reason = "the same conversion for one value, and the same argument"

[[group]]
prefix = "zu::GqlStatus"
tier = 1
reason = "the ISO 39075 condition code on every error and every warning"

[[group]]
prefix = "zu::GraphStore"
tier = 3
reason = "the trait the storage engines implement, chosen by the path a session opens rather than by a caller"

[[group]]
prefix = "zu::IntBits"
tier = 2
reason = "the width of an exact number, the integer half of what FloatBits says for the approximate one"

[[group]]
prefix = "zu::Interrupt"
tier = 2
reason = "the flag a running statement checks, set from another thread; the C ABI exposes the act of cancelling rather than the flag, so a binding that hands its user a cancellation token names this and one with a cancel call does not"

[[group]]
prefix = "zu::Layout"
tier = 2
reason = "how a registered column is laid out in the caller's memory, which is the one part of the frame API that is raw pointers and the reason the whole of it is tier 2"

[[group]]
prefix = "zu::LogicalType"
tier = 2
reason = "the type the language talks about, which is larger than the physical layout under it: a binding describing a column with more than a kind byte reads this, and one that hands values back already converted does not"

[[group]]
prefix = "zu::NodeId"
tier = 1
reason = "a node value carries one, so every binding that returns a node returns this"

[[group]]
prefix = "zu::OpProfile"
tier = 2
reason = "one operator's line of a PROFILE: rows in, rows out, the time it spent and how far its estimate was off, which a binding exposing profiling gives back and the rest do not"

[[group]]
prefix = "zu::PlanNode"
tier = 2
reason = "one operator of a plan as a node rather than as the line EXPLAIN prints, for a binding that draws the tree instead of printing it"

[[group]]
prefix = "zu::Position"
tier = 1
reason = "where in a statement a condition was raised, which every binding hands on so a caller can point at the token"

[[group]]
prefix = "zu::Profile"
tier = 2
reason = "what PROFILE answers, the plan with the counters the run put on it, which follows whatever the binding decided about the plan"

[[group]]
prefix = "zu::QueryPlan"
tier = 2
reason = "the plan EXPLAIN answers, as a tree; every binding can print it as text through the session, and this is for the one that wants the shape"

[[group]]
prefix = "zu::Row"
tier = 2
reason = "one row borrowed out of a result, with its column names, which a binding with a cursor hands over a row at a time and one that answers with columns and rows of values never builds"

[[group]]
prefix = "zu::RowIter"
tier = 2
reason = "the rows of a result borrowed one at a time, the other half of that cursor"

[[group]]
prefix = "zu::ScalarPlan"
tier = 2
reason = "one value query expression of a plan, with the names it reads from the query around it, which is what says whether it runs once or once per row; it goes wherever the plan tree goes"

[[group]]
prefix = "zu::Severity"
tier = 1
reason = "whether a condition stopped the statement, which decides whether a binding raises or warns"

[[group]]
prefix = "zu::Snapshot"
tier = 3
reason = "the engine's read view at a fixed epoch, an interface the executor uses and no caller holds"

[[group]]
prefix = "zu::StageProfile"
tier = 2
reason = "one pipeline stage of a profile, which is where the time went rather than which operator spent it"

[[group]]
prefix = "zu::Streamed"
tier = 2
reason = "what a streaming call answers once the rows are gone: the column names, how many went over, whether the caller stopped it and whether the engine made them as it handed them over"

[[group]]
prefix = "zu::Temporal"
tier = 2
reason = "a date, a time, a datetime or a duration as the engine holds one, which a binding converting into its own language's temporal types reads and one handing them back as text does not"

[[group]]
prefix = "zu::ZuError"
tier = 1
reason = "the error every call can return, mapped onto each language's own exception type"

[[group]]
prefix = "zu::append"
tier = 1
reason = "the appender under its own module path, the same surface as zu::Appender and the same obligation"

[[group]]
prefix = "zu::append::AppendRow"
tier = 3
reason = "the trait that lets a tuple be a row, which is how Rust spells a variadic argument and not something another language needs a name for"

[[group]]
prefix = "zu::append::RowSink"
tier = 3
reason = "where a row writes its fields on the way into the column buffers, an implementation detail of that trait and never named by a caller"

[[group]]
prefix = "zu::catalog_stmt"
tier = 3
reason = "applying a catalog statement to an open file, which a caller reaches by running the statement"

[[group]]
prefix = "zu::convert"
tier = 2
reason = "converting a store between engines, which the CLI exposes and a binding may"

[[group]]
prefix = "zu::dataset"
tier = 2
reason = "bulk loading a directory of node files and rel files as the tables it names, which the CLI exposes and a binding may"

[[group]]
prefix = "zu::db"
tier = 1
reason = "the public API itself: open a database, take a connection, run a statement"

[[group]]
prefix = "zu::gqlstatus"
tier = 3
reason = "the generated condition table's own accessors, which a binding reaches through GqlStatus"

[[group]]
prefix = "zu::gqlstatus::Condition"
tier = 1
reason = "the condition an error names, which is what a caller matches on rather than the code text"

[[group]]
prefix = "zu::gqlstatus::DiagnosticRecord"
tier = 2
reason = "the same type as zu::DiagnosticRecord, which is the path a user types and the one a binding owes"

[[group]]
prefix = "zu::gqlstatus::GqlStatus"
tier = 2
reason = "the same type as zu::GqlStatus, which is the path a user types and the one a binding owes"

[[group]]
prefix = "zu::gqlstatus::Position"
tier = 2
reason = "the same type as zu::Position, which is the path a user types and the one a binding owes"

[[group]]
prefix = "zu::gqlstatus::Severity"
tier = 2
reason = "the same type as zu::Severity, which is the path a user types and the one a binding owes"

[[group]]
prefix = "zu::gqlstatus::codes"
tier = 2
reason = "one constant per condition, useful to a binding that wants named codes and not required of one"

[[group]]
prefix = "zu::list_text"
tier = 3
reason = "the JSON a staged list column holds while it crosses sqlite, a detail of bulk load"

[[group]]
prefix = "zu::params"
tier = 3
reason = "the macro that writes a parameter list as a literal on the caller's stack, which is Rust's spelling of the keyword arguments the other languages already have"

[[group]]
prefix = "zu::query"
tier = 3
reason = "the one-shot entry points, which pay the open and plan cost per call; a binding holds a session"

[[group]]
prefix = "zu::query::QueryResult"
tier = 1
reason = "the rows a query returns and the warnings it raised, which is the other half of the envelope"

[[group]]
prefix = "zu::query::Value"
tier = 1
reason = "one runtime value, in and out, which is the type every binding spends its conversion code on"

[[group]]
prefix = "zu::query::column"
tier = 1
reason = "the same rows read down their columns, which is the shape every binding hands to Arrow, pandas or polars; a binding that writes the transpose itself is the one docs/clients/duckdb.md measured at twenty times DuckDB"

[[group]]
prefix = "zu::session"
tier = 1
reason = "open, prepare, execute, explain, profile: the surface a binding is"

[[group]]
prefix = "zu::shared"
tier = 3
reason = "the one write side a process keeps per file, which sessions borrow to write and fork to read. A binding opens a connection and the sharing happens under it."

[[group]]
prefix = "zu::snapshot"
tier = 3
reason = "the vectorized read path, zone maps and CSR pins, which sits under the executor"

[[group]]
prefix = "zu::sqlite"
tier = 3
reason = "the sqlite engine's own facade, reached by opening a sqlite path rather than by naming it"

[[group]]
prefix = "zu::write"
tier = 3
reason = "the log, the overlay store and the fold behind a session's writes, staged against the engine's own transaction type and naming tables by catalog id. A binding writes by running a statement."

[[group]]
prefix = "zu::zu1"
tier = 3
reason = "the storage engine: blocks, segments, catalog, WAL. A binding talks to a session, and a session talks to this."

[[entity]]
id = "zu::C_ABI_VERSION"
tier = 2
reason = "the revision of the C ABI this build publishes, which a binding reporting what it is linked against wants beside its own version, and which every binding on the C ABI can also read as ZU_ABI_VERSION out of the header it compiled with"

[[entity]]
id = "zu::Connection::session_mut"
tier = 3
reason = "the escape hatch to the engine's own session, which exists for the paths this API has not grown yet and which no binding reproduces"

[[entity]]
id = "zu::Epoch"
tier = 2
reason = "the commit epoch a snapshot pins, which a binding exposing point-in-time reads would need"

[[entity]]
id = "zu::Result"
tier = 3
reason = "a Rust alias for Result<T, ZuError>, and every other language raises instead of returning"

[[entity]]
id = "zu::db::Connection::session_mut"
tier = 3
reason = "the same escape hatch under its own module path"

[[entity]]
id = "zu::query::Value::NO_REL_ROW"
tier = 3
reason = "the row an edge with nothing stored on it carries, which is a marker inside a rel value and not a value of its own; a binding hands back an edge as its table and its two endpoints, and the C ABI does not carry the row at all, so there is nothing for this to mark"

[[entity]]
id = "zu::session::Session::catalog"
tier = 3
reason = "the catalog behind the session, which exists so a caller staging a write can turn a label into the table id the transaction wants; a binding never sees a table id"

[[entity]]
id = "zu::session::Session::epoch"
tier = 2
reason = "the epoch the session last reloaded at, which a binding exposing whether some work published anything would want"

[[entity]]
id = "zu::session::Session::file_mut"
tier = 3
reason = "the engine file under the session, which the appender takes for the length of its borrow and which nothing outside this crate has a use for"

[[entity]]
id = "zu::session::Session::options"
tier = 3
reason = "the execution switches on the engine's session, which a binding reaches through Config instead"

[[entity]]
id = "zu::session::Session::set_options"
tier = 3
reason = "the same switches, set, which is what Config does on the caller's behalf"

[[entity]]
id = "zu::session::Session::write"
tier = 3
reason = "one write transaction staged against the engine's own WriteTxn, which is the shape the write statements are being built on rather than the shape a binding gets; a binding writes by running a statement"

[[entity]]
id = "zu::zu1::BLOCK_SIZE"
tier = 2
reason = "the block size, which a tool reporting on a file wants and a binding does not have to carry"

[[entity]]
id = "zu::zu1::FORMAT_VERSION"
tier = 2
reason = "what this build writes, which a binding reporting compatibility wants"

[[entity]]
id = "zu::zu1::MAGIC"
tier = 2
reason = "the file magic, enough to tell a zu1 file from anything else without opening it"

[[entity]]
id = "zu::zu1::MIN_READER_VERSION"
tier = 2
reason = "the oldest reader that can open what this build writes, the other half of a compatibility check"
