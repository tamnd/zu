test = false
doc = false
bench = false

[[bin]]
name = "decode_delta_patch"
path = "fuzz_targets/decode_delta_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zu1_decode"
path = "fuzz_targets/zu1_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zu1_file"
path = "fuzz_targets/zu1_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seeds"
path = "src/seeds.rs"
