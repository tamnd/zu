[package]
name = "zu-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
zu-encoding = { path = "../crates/zu-encoding" }
zu-zu1 = { path = "../crates/zu-zu1" }

[[bin]]
name = "decode_for_bitpack"
path = "fuzz_targets/decode_for_bitpack.rs"
