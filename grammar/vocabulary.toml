schema = 1
doc = "The words of zuQL, grouped by what they are, for the three things that colour them."
audited = "2026-08-19"

# One list of words, three consumers. The shell scans a statement as it
# is typed and colours the words it recognises, the tree-sitter grammar
# parses a statement that is finished, and the Shiki grammar colours a
# statement printed on a page. A word that three files agree on is one
# word; three files that each keep their own list agree until they do
# not, and the day they stop is the day a keyword the engine added is
# blue in the shell, plain on the website and an identifier in an
# editor.
#
# So the lists live here and `cargo xtask grammar` puts them where each
# consumer needs them: `grammar/shiki/gql.tmLanguage.json` is written
# from this file, `crates/zu-cli/src/highlight.rs` is checked against it,
# because the shell's table is sorted for a binary search and is read by
# a scanner on the keystroke path rather than by a generator, and
# `queries/highlights.scm` is written into a checkout of
# https://github.com/tamnd/tree-sitter-gql, which is where the editor's
# grammar lives and which puts this file to itself in its own CI.
#
# What a `kind` means:
#   keyword   a word the parser gives meaning to by position
#   literal   NULL and the two booleans, which are values and not words
#   function  a built-in the binder resolves by name
#   algorithm a graph algorithm, called as a table function
#   type      a value type name, from `crates/zu-query/src/value_type.rs`
#
# The shell shows the first three and not the last two, and that is a
# decision rather than an oversight: a type name is a name until the
# grammar around it makes it a type, `DATE` is a legal variable and
# `RETURN date` is a variable read, and a scanner with no grammar behind
# it would colour the variable as a type. The tree-sitter and Shiki
# grammars have the context to tell them apart, so they get the fourth
# list too.
#
# None of this is the parser's own table. The parser has no keyword
# table: keywords are ordinary identifiers to the lexer and the parser
# matches them by position, which is what makes `RETURN match` legal.
# A word missing from here is a word that comes out uncoloured, which
# is a cosmetic drift and not a wrong answer, and that is the trade for
# not making three highlighters depend on the parser's internals.

[[group]]
kind = "keyword"
doc = "The clauses a query is made of, in the order they may appear, and NEXT, which is not a clause but the word one statement hands its result to the next with. FILTER and LET are the two GQL writes where Cypher writes a WHERE and a WITH: one keeps rows without a pattern under it, the other adds a name without dropping the others. LET is also a whole expression, ISO 20.7, where it names a value for the length of one expression and the name is gone at the END; the word opens one only where a definition follows it, which is a name with an equals sign behind it, so RETURN let is still a variable read. FOR is where GQL makes a row of every element of a list, which Cypher spells UNWIND, and ORDINALITY and OFFSET are the counter it may number them with; IN belongs to the predicates group, being the same word the membership test is written with. FINISH is the other way a query may end: RETURN says what the answer is and FINISH says there is none, which is not the same as a query that answered no rows."
words = ["USE", "OPTIONAL", "MATCH", "FOR", "ORDINALITY", "OFFSET", "UNWIND", "FILTER", "LET", "WITH", "WHERE", "RETURN", "FINISH", "YIELD", "NEXT"]

[[group]]
kind = "keyword"
doc = "The conjunctions, which join two result tables rather than two clauses. The set quantifier after a set operator is ALL or DISTINCT, both of which are already words, and leaving it out means DISTINCT. OTHERWISE is not a set operator: it answers the right operand only when the left had no rows."
words = ["UNION", "EXCEPT", "INTERSECT", "OTHERWISE"]

[[group]]
kind = "keyword"
doc = "Projection, grouping, ordering and the page. GROUP is also a value type word, being the GROUP of a group type, and one word is one entry here however many places the grammar reads it in. OFFSET is with the clauses, since it is the standard's word for the clause SKIP is the synonym of and the counter a FOR numbers its rows with."
words = ["DISTINCT", "AS", "GROUP", "ORDER", "BY", "ASC", "ASCENDING", "DESC", "DESCENDING", "NULLS", "FIRST", "LAST", "SKIP", "LIMIT"]

[[group]]
kind = "keyword"
doc = "Patterns: the selectors, the path modes, the match modes, the KEEP that says one selector for a whole list of patterns, and the words a path may carry. PATHS and GROUPS are the plurals a selector may be written with, PATH being a word already as the type and the constructor, and GROUP being one as the grouping clause. A match mode is written REPEATABLE ELEMENTS or DIFFERENT EDGES, either of them with the singular noun and either of them with BINDINGS behind it, and EDGE, ELEMENTS and BINDING are words already elsewhere."
words = ["ALL", "ANY", "SHORTEST", "PATHS", "GROUPS", "KEEP", "WALK", "TRAIL", "ACYCLIC", "SIMPLE", "REPEATABLE", "ELEMENT", "DIFFERENT", "EDGES", "BINDINGS"]

[[group]]
kind = "keyword"
doc = "Predicates and the operators spelled as words. DIRECTED, LABELED, SOURCE and DESTINATION are the words behind IS that make the pattern predicates, and OF is a word already in the catalog statements."
words = ["AND", "OR", "XOR", "NOT", "IS", "IN", "STARTS", "ENDS", "CONTAINS", "LIKE", "EXISTS", "TYPED", "CAST", "DIRECTED", "LABELED", "SOURCE", "DESTINATION"]

[[group]]
kind = "keyword"
doc = "The case expression and the two abbreviations of it. COALESCE and NULLIF are written like calls and are not calls: the binder resolves no function by either name, because both pick which of their arguments to evaluate and a function has all of its arguments in hand before it is entered. END closes a CASE and closes nothing else, and ENDS is a different word, in the predicates group with the string tests."
words = ["CASE", "WHEN", "THEN", "ELSE", "END", "COALESCE", "NULLIF"]

[[group]]
kind = "keyword"
doc = "The catalog statements and what they name. The last four are the graph references that name a graph without naming one, and they are not only a USE clause's words: ISO 19.6 lets a graph stand where a value stands, so each of them is a whole expression too. A graph named rather than referred to is written as the path it is at when it stands in an expression, GRAPH and PROPERTY GRAPH being spellings a USE takes and an expression cannot, since a word with a path behind it is a division as often as it is a graph. Both words do stand in front of a parameter, where the dollar sign settles it."
words = ["CREATE", "DROP", "SCHEMA", "GRAPH", "PROPERTY", "TYPE", "IF", "REPLACE", "COPY", "OF", "NODE", "EDGE", "RELATIONSHIP", "PROPERTIES", "NO", "CURRENT_GRAPH", "CURRENT_PROPERTY_GRAPH", "HOME_GRAPH", "HOME_PROPERTY_GRAPH"]

[[group]]
kind = "keyword"
doc = "Value type words that are grammar rather than type names: the list types and the open types. The three type names are also the constructors that build a value of the type, ISO 20.17 and 20.19, where the name is optional and only a bracket or a brace behind it tells the constructor from a variable read."
words = ["LIST", "ARRAY", "RECORD", "VALUE"]

[[group]]
kind = "keyword"
doc = "The write clauses and the procedure call, which the parser reads like any other clause."
words = ["INSERT", "SET", "REMOVE", "DELETE", "DETACH", "NODETACH", "CALL"]

[[group]]
kind = "keyword"
doc = "The transaction statements, which the parser reads and the session runs, since a transaction outlives the statement that opened it."
words = ["START", "COMMIT", "ROLLBACK"]

[[group]]
kind = "keyword"
doc = "Words the parser knows and refuses by name, because a statement that writes one is a statement somebody expected to work. CREATE is refused the same way and is in the catalog group, being the one word that opens a statement here and a different one in Cypher. They are coloured for the reason they are refused by name: a word that comes out plain reads as a variable, and the error is easier to believe when the word looked like a word."
words = ["MERGE", "SESSION"]

[[group]]
kind = "keyword"
doc = "The fields an interval qualifier is written with, and the TO that names a range of them. ISO 21.5 gives a duration a second spelling, a string with a qualifier behind it, and the qualifier is the whole of what says how to read the string: '1-2' is a year and two months under YEAR TO MONTH and is no duration at all under DAY. A field word can only stand behind an interval string, so each of these is an ordinary variable name everywhere else, and DAY is the same kind of word DATE is."
words = ["YEAR", "MONTH", "DAY", "HOUR", "MINUTE", "SECOND", "TO"]

[[group]]
kind = "literal"
doc = "The three values that are written as words."
words = ["NULL", "TRUE", "FALSE"]

[[group]]
kind = "function"
doc = "The built-ins the binder resolves by name. The first six are the set functions and the rest are scalar; ID, PATH_LENGTH and ELEMENTS are the three that read something only the graph knows, and ALL_DIFFERENT, SAME and PROPERTY_EXISTS are the three pattern predicates written as calls. The last six are the character string functions of ISO 20.22 and 20.24, CHAR_LENGTH and CHARACTER_LENGTH being two spellings the standard gives one function and OCTET_LENGTH being the other question, since the characters a reader counts and the bytes the store keeps are the same number only for ASCII."
words = ["COUNT", "SUM", "AVG", "MIN", "MAX", "COLLECT", "ID", "SIZE", "CARDINALITY", "PATH_LENGTH", "ELEMENTS", "ALL_DIFFERENT", "SAME", "PROPERTY_EXISTS", "CHAR_LENGTH", "CHARACTER_LENGTH", "OCTET_LENGTH", "UPPER", "LOWER", "TRIM"]

[[group]]
kind = "algorithm"
doc = "The graph algorithms, which are table functions called in a CALL and read through a YIELD. Written lower case here because that is how a statement writes them, and the match is case-insensitive either way."
words = ["pagerank", "wcc", "bfs", "sssp", "sssp_weighted", "cdlp", "lcc", "triangle_count", "betweenness", "louvain"]

[[group]]
kind = "type"
doc = "The integer tower, its word spellings, and the exact numbers."
words = ["INT8", "INT16", "INT32", "INT64", "INT128", "INT256", "UINT8", "UINT16", "UINT32", "UINT64", "UINT128", "UINT256", "SMALLINT", "USMALLINT", "INT", "INTEGER", "UINT", "BIGINT", "UBIGINT", "DECIMAL", "DEC", "NUMERIC"]

[[group]]
kind = "type"
doc = "The approximate numbers, the booleans, and the two string families."
words = ["FLOAT16", "FLOAT32", "FLOAT64", "FLOAT128", "FLOAT256", "REAL", "DOUBLE", "PRECISION", "FLOAT", "BOOL", "BOOLEAN", "STRING", "VARCHAR", "CHAR", "BYTES", "VARBINARY", "BINARY"]

[[group]]
kind = "type"
doc = "The temporals and the immaterial types. LOCAL and ZONED are words of a two word name rather than names of their own, and a bare TIME or DATETIME carries a zone, which is GQL's default."
words = ["DATE", "TIME", "DATETIME", "TIMESTAMP", "LOCAL", "ZONED", "DURATION", "INTERVAL", "PATH", "BINDING", "TABLE", "NOTHING"]
